<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* rolagem sem barra visível (página e tabelas) */
html, body, * { scrollbar-width: none; -ms-overflow-style: none; }
::-webkit-scrollbar { display: none; width: 0; height: 0; }

/* ── Dark (default) ── */
:root {
  --bg: #0d0f14;
  --surface: #161920;
  --surface2: #1e2130;
  --border: #2a2d3e;
  --border2: #353849;
  --text: #e2e8f0;
  --muted: #6b7280;
  --accent: #22c55e;
  --green: #22c55e;
  --yellow: #f59e0b;
  --amber: #f59e0b;
  --orange: #ee4d2d;
  --red: #ef4444;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --radius: 10px;
  --shadow: 0 2px 8px rgba(0,0,0,.4);
}

/* ── Light mode ── */
[data-theme="light"] {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface2: #f8fafc;
  --border: #e2e8f0;
  --border2: #cbd5e1;
  --text: #0f172a;
  --muted: #64748b;
  --shadow: 0 2px 8px rgba(0,0,0,.08);
}

html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  min-height: 100vh;
  transition: background .2s, color .2s;
}

/* ── Header ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: var(--shadow);
}
.header-icon {
  width: 34px; height: 34px; background: var(--accent);
  border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-size: 17px; flex-shrink: 0;
}
.header-title h1 { font-size: 14px; font-weight: 700; }
.header-title p  { font-size: 11px; color: var(--muted); }
.header-right    { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.live-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.live-dot   { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink:0; }
.live-dot.on { background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.meta-tag {
  font-size: 11px; color: var(--muted);
  background: var(--surface2); padding: 3px 8px; border-radius: 20px;
  border: 1px solid var(--border);
}
.theme-btn {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 10px; cursor: pointer;
  font-size: 14px; color: var(--muted); transition: all .15s; line-height: 1;
}
.theme-btn:hover { border-color: var(--border2); color: var(--text); }

/* ── Zone tabs ── */
.zone-tabs {
  padding: 0 24px; display: flex; gap: 4px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
.zone-tab {
  background: transparent; border: none; color: var(--muted);
  padding: 9px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: all .15s; display: flex; align-items: center; gap: 5px;
}
.zone-tab:hover { color: var(--text); }
.zone-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.zone-tab .tab-count {
  background: var(--surface2); color: var(--muted);
  font-size: 10px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--border);
}
.zone-tab.active .tab-count {
  background: rgba(34,197,94,.12); color: var(--accent); border-color: rgba(34,197,94,.25);
}

/* ── KPIs ── */
.stats {
  display: grid; grid-template-columns: repeat(6,1fr);
  gap: 10px; padding: 14px 24px;
}
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 16px;
}
.stat.clickable { cursor: pointer; transition: border-color .15s, background .15s; }
.stat.clickable:hover { border-color: var(--blue); background: rgba(59,130,246,.06); }
.stat.pct-active { border-color: var(--blue) !important; background: rgba(59,130,246,.10) !important; box-shadow: 0 0 0 2px rgba(59,130,246,.25); }
.stat.pct-active .stat-sub::after { content: ' ✕'; font-size:10px; opacity:.6; }
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 4px; }
.stat-value { font-size: 24px; font-weight: 700; line-height: 1; }
.stat-sub   { font-size: 11px; color: var(--muted); margin-top: 4px; }
/* Banner de filtro ativo */
.pct-filter-banner { display:flex; align-items:center; gap:10px; padding:6px 12px; background:rgba(59,130,246,.12); border:1px solid rgba(59,130,246,.3); border-radius:8px; font-size:11px; margin-bottom:8px; }
.pct-filter-banner strong { color:var(--blue); }
.pct-filter-clear { cursor:pointer; padding:2px 8px; border-radius:10px; background:rgba(59,130,246,.2); border:none; color:var(--blue); font-size:10px; }
/* TO linha destacada na subtabela */
.to-match { background: rgba(59,130,246,.12) !important; }
.to-match td:nth-child(2) { font-weight:800; color:var(--blue) !important; }

/* ── Visão por Zona ── */
.section { padding: 0 24px 14px; }
.section-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .6px;
  color: var(--muted); font-weight: 600; margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::before {
  content: ''; width: 8px; height: 8px; border-radius: 2px;
  background: var(--accent); display: inline-block;
}

/* Zone summary cards */
.zone-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 10px; margin-bottom: 14px; }
.zone-card  {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; border-top: 3px solid;
}
.zone-card-label { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; font-weight: 700; margin-bottom: 4px; }
.zone-card-value { font-size: 28px; font-weight: 800; line-height: 1; margin-bottom: 5px; }
.zone-card-meta  { font-size: 11px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.zone-card-meta strong { color: var(--text); }
.zc-linear   { border-top-color: #3b82f6; }
.zc-linear   .zone-card-label { color: #60a5fa; }
.zc-linear   .zone-card-value { color: #3b82f6; }
.zc-volumoso { border-top-color: #22c55e; }
.zc-volumoso .zone-card-label { color: #4ade80; }
.zc-volumoso .zone-card-value { color: #22c55e; }
.zc-cop      { border-top-color: #f59e0b; }
.zc-cop      .zone-card-label { color: #fbbf24; }
.zc-cop      .zone-card-value { color: #f59e0b; }
.zc-other    { border-top-color: #8b5cf6; }
.zc-other    .zone-card-label { color: #a78bfa; }
.zc-other    .zone-card-value { color: #8b5cf6; }

/* Cross-tab */
.crosstab-wrap { overflow-x: auto; }
table.crosstab {
  width: 100%; border-collapse: collapse; min-width: 500px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
table.crosstab th {
  font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
  color: var(--muted); padding: 10px 14px; text-align: left;
  border-bottom: 1px solid var(--border); font-weight: 600;
  background: var(--surface2);
}
table.crosstab th.col-total { text-align: right; }
table.crosstab th.col-zone  { text-align: center; }
table.crosstab .sub { display: block; font-size: 9px; font-weight: 400; color: var(--muted); margin-top: 2px; }
table.crosstab td {
  padding: 8px 14px; border-bottom: 1px solid rgba(42,45,62,.4);
  vertical-align: middle; font-family: monospace; font-size: 12px;
}
[data-theme="light"] table.crosstab td { border-bottom-color: rgba(226,232,240,.8); }
table.crosstab tr:last-child td { border-bottom: none; }
table.crosstab td.faixa { font-family: 'Segoe UI',sans-serif; font-size: 11px; color: var(--muted); font-weight: 500; }
table.crosstab td.zone-cell { text-align: center; }
table.crosstab td.total-cell { text-align: right; font-weight: 700; color: var(--text); }
table.crosstab tr.row-total td { background: var(--surface2); font-weight: 700; border-top: 1px solid var(--border); }
table.crosstab tr.row-total td.faixa { color: var(--text); }
.cell-inner { display: inline-block; padding: 2px 8px; border-radius: 4px; min-width: 52px; text-align: center; }
.cell-zero  { color: var(--muted); }

/* ── Panels row ── */
.panel-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 0 24px 14px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.panel-title { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
.top5-table { width: 100%; border-collapse: collapse; }
.top5-table th {
  font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
  color: var(--muted); padding: 4px 8px; text-align: left;
  border-bottom: 1px solid var(--border); font-weight: 500;
}
.top5-table td { padding: 8px 8px; border-bottom: 1px solid rgba(42,45,62,.4); vertical-align: middle; }
[data-theme="light"] .top5-table td { border-bottom-color: rgba(226,232,240,.8); }
.top5-table tr:last-child td { border-bottom: none; }
.rank-num { color: var(--muted); font-size: 11px; margin-right: 5px; }
.occ-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.occ-label { font-size: 11px; color: var(--muted); min-width: 70px; }
.occ-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin: 0 10px; }
.occ-fill  { height: 100%; border-radius: 4px; }
.occ-val   { font-size: 11px; font-family: monospace; min-width: 44px; text-align: right; }
.occ-low  { background: var(--green); }
.occ-mid  { background: var(--yellow); }
.occ-high { background: var(--red); }

/* ── Detail table ── */
.section-header { display: flex; align-items: center; gap: 12px; padding: 0 24px 10px; }
.section-title  { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
.table-wrap { padding: 0 24px 32px; overflow-x: auto; }
table.main-table { width: 100%; border-collapse: collapse; min-width: 700px; }
table.main-table th {
  font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
  color: var(--muted); padding: 8px 12px; text-align: left;
  border-bottom: 1px solid var(--border); font-weight: 500;
  cursor: pointer; user-select: none; white-space: nowrap;
}
table.main-table th:hover { color: var(--text); }
table.main-table th.sorted { color: var(--accent); }
table.main-table td { padding: 8px 12px; border-bottom: 1px solid rgba(42,45,62,.4); vertical-align: middle; }
[data-theme="light"] table.main-table td { border-bottom-color: rgba(226,232,240,.8); }
table.main-table tr:hover td { background: rgba(0,0,0,.02); }
table.main-table tr:last-child td { border-bottom: none; }

.area-name { font-weight: 600; font-size: 13px; }
.zone-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.zone-linear   { background: rgba(59,130,246,.15);  color: #60a5fa; border: 1px solid rgba(59,130,246,.25); }
.zone-volumoso { background: rgba(34,197,94,.15);   color: #4ade80; border: 1px solid rgba(34,197,94,.25); }
.zone-cop      { background: rgba(245,158,11,.15);  color: #fbbf24; border: 1px solid rgba(245,158,11,.25); }
.zone-other    { background: rgba(139,92,246,.15);  color: #a78bfa; border: 1px solid rgba(139,92,246,.25); }
.occ-bar-wrap { display: flex; align-items: center; gap: 6px; }
.occ-bar  { width: 60px; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.occ-fill2 { height: 100%; border-radius: 3px; }
.aging-val  { font-family: monospace; font-size: 12px; }
.aging-ok   { color: var(--muted); }
.aging-warn { color: var(--yellow); }
.aging-hot  { color: var(--orange); }
.aging-crit { color: var(--red); font-weight: 700; }

/* ── Empty ── */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
.empty code {
  display: inline-block; background: var(--surface); border: 1px solid var(--border);
  padding: 10px 18px; border-radius: 8px; font-size: 12px; margin-top: 14px;
  text-align: left; line-height: 1.8;
}

@media (max-width: 1100px) { .stats { grid-template-columns: repeat(3,1fr); } }
/* Donut chart */
.donut-wrap { display:flex; align-items:center; gap:18px; flex:1; }
.donut-svg-wrap { position:relative; flex-shrink:0; }
.donut-center {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  text-align:center; pointer-events:none; line-height:1;
}
.donut-center-val { font-size:15px; font-weight:800; }
.donut-center-lbl { font-size:9px; color:var(--muted); margin-top:2px; }
.donut-legend-item {
  display:flex; align-items:center; gap:8px; margin-bottom:9px;
}
.donut-swatch { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
.donut-legend-name { font-weight:700; font-size:13px; }
.donut-legend-pct  { color:var(--muted); font-size:11px; margin-left:4px; }
.donut-legend-val  { font-family:monospace; font-size:12px; font-weight:600; margin-left:auto; }
/* ── Table toolbar ── */
.table-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 24px 10px; }
.search-wrap { position: relative; min-width: 200px; max-width: 300px; }
.search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search-input {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 7px 10px 7px 30px; border-radius: 8px;
  font-size: 12px; outline: none; transition: border-color .15s;
}
.search-input:focus { border-color: var(--accent); }
.filter-pills { display: flex; gap: 5px; flex-wrap: wrap; }
.fpill {
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
  cursor: pointer; transition: all .15s;
}
.fpill:hover { border-color: var(--border2); color: var(--text); }
.fpill.active { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.3); color: var(--accent); }
.aging-sort-btn {
  display: flex; align-items: center; gap: 5px; margin-left: auto;
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  padding: 5px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.aging-sort-btn:hover { border-color: var(--border2); color: var(--text); }
.aging-sort-btn.desc { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.25); color: var(--red); }
.aging-sort-btn.asc  { background: rgba(34,197,94,.08); border-color: rgba(34,197,94,.25); color: var(--accent); }

/* ── Pagination ── */
.pagination-bar {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px;
  padding: 12px 24px; border-top: 1px solid var(--border);
}
.pag-info { font-size: 12px; color: var(--muted); }
.pag-pages { display: flex; align-items: center; gap: 4px; }
.pag-btn {
  min-width: 32px; height: 32px; padding: 0 8px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 7px; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center;
}
.pag-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pag-btn:disabled { opacity: .35; cursor: default; }
.pag-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.pag-ellipsis { font-size: 12px; color: var(--muted); padding: 0 4px; }
.pag-size { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.pag-size select {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 4px 8px; border-radius: 7px; font-size: 12px; cursor: pointer; outline: none;
}
.pag-size select:focus { border-color: var(--accent); }

/* ── VOLUMOSO specific ── */
.vol-row { display:flex; align-items:center; gap:10px; padding:6px 4px; border-bottom:1px solid var(--border); border-radius:6px; cursor:pointer; transition:background .15s; }
.vol-row:last-child { border-bottom:none; }
.vol-row:hover { background:rgba(255,255,255,.04); }
.vol-row.vol-active { background:rgba(59,130,246,.13); border-bottom-color:transparent; box-shadow:inset 2px 0 0 var(--blue); }
.vol-label { min-width:60px; font-size:12px; font-weight:600; color:var(--muted); }
.vol-bar-wrap { flex:1; background:var(--surface2); border-radius:4px; height:10px; overflow:hidden; }
.vol-bar { height:100%; border-radius:4px; background:var(--green); transition:width .4s ease; }
.vol-val { min-width:110px; text-align:right; font-family:monospace; font-size:12px; font-weight:700; }
.vol-pct { color:var(--muted); font-weight:400; font-size:11px; }
.vol-hist-label { min-width:72px; font-size:11px; color:var(--muted); flex-shrink:0; }
.vol-turno-row { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--border); border-radius:6px; cursor:pointer; transition:background .15s; }
.vol-turno-row:last-child { border-bottom:none; }
.vol-turno-row:hover { background:rgba(255,255,255,.04); }
.vol-turno-row.vol-active { background:rgba(59,130,246,.13); border-bottom-color:transparent; box-shadow:inset 2px 0 0 var(--blue); }
/* Aging histogram row clicável */
.vol-aging-row { cursor:pointer; border-radius:8px; transition:box-shadow .15s; }
.vol-aging-row:hover { box-shadow:0 0 0 1px rgba(255,255,255,.1); }
.vol-aging-row.vol-active { box-shadow:0 0 0 2px var(--blue); }

/* ── Expandable TO rows ── */
.area-row { cursor: pointer; }
.area-row:hover td { background: rgba(34,197,94,.04); }
.expand-chevron { font-size: 9px; color: var(--muted); margin-right: 5px; display: inline-block; transition: transform .18s; }
.expand-chevron.open { transform: rotate(90deg); color: var(--accent); }
.expand-row td { padding: 0 !important; background: var(--surface2); border-bottom: 1px solid var(--border) !important; }
.expand-inner { padding: 10px 12px 10px 44px; }
.tos-subtable { width: 100%; border-collapse: collapse; }
.tos-subtable th {
  font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted);
  padding: 5px 10px; text-align: left; border-bottom: 1px solid var(--border); font-weight: 500;
}
.tos-subtable td { padding: 6px 10px; border-bottom: 1px solid rgba(42,45,62,.3); font-size: 12px; }
[data-theme="light"] .tos-subtable td { border-bottom-color: rgba(226,232,240,.6); }
.tos-subtable tr:last-child td { border-bottom: none; }
.turno-tag {
  display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 10px; font-weight: 700;
}
.t-t1 { background: rgba(59,130,246,.15); color: #60a5fa; }
.t-t2 { background: rgba(245,158,11,.15); color: #fbbf24; }
.t-t3 { background: rgba(34,197,94,.15);  color: #4ade80; }
.t-other { background: rgba(139,92,246,.15); color: #a78bfa; }

.perfil-badge {
  display: inline-block; padding: 1px 6px; border-radius: 8px;
  font-size: 10px; font-weight: 700; font-family: monospace;
  margin: 1px 3px 1px 0; white-space: nowrap;
}

@media (max-width: 900px)  { .panel-row { grid-template-columns: 1fr 1fr; } }
@media (max-width: 700px) {
  .stats { grid-template-columns: repeat(2,1fr); }
  .panel-row { grid-template-columns: 1fr; }
  .header-right .meta-tag { display: none; }
}

/* ── Aging Criticality Panel ──────────────────────────────────── */
.aging-crit-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.aging-crit-hdr {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 16px; border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.aging-crit-hdr-title {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .7px; color: var(--muted);
}
.aging-alert-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 11px; border-radius: 20px; font-size: 10px;
  font-weight: 800; text-transform: uppercase; letter-spacing: .5px;
  cursor: default; flex-shrink: 0;
}
.aging-alert-pill.red   { background:rgba(239,68,68,.18);  color:var(--red);   border:1px solid rgba(239,68,68,.35);  animation:blink-pill 1.8s infinite; }
.aging-alert-pill.amber { background:rgba(245,158,11,.18); color:var(--amber); border:1px solid rgba(245,158,11,.35); animation:blink-pill 2.4s infinite; }
@keyframes blink-pill { 0%,100%{opacity:1} 50%{opacity:.5} }
