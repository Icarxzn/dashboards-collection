<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0D0D0D;
  --bg-elevated: #131315;
  --surface: #1A1A1C;
  --surface2: #2A2A2C;
  --surface-hover: #232325;
  --border: #2A2A2C;
  --border2: #3a3a3e;
  --hairline: rgba(255,255,255,.07);
  --text: #F5F5F6;
  --muted: #BFBFC3;
  --dim: #96969b;
  --faint: #6b6b70;
  --orange: #FA4C00;
  --orange-soft: rgba(250,76,0,.14);
  --orange-glow: rgba(250,76,0,.35);
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #f59e0b;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --radius: 14px;
  --radius-sm: 9px;
  --ease: cubic-bezier(.16,1,.3,1);
  --font-ui: 'Fira Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'Fira Code', 'SFMono-Regular', Consolas, monospace;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 4px 16px rgba(0,0,0,.35);
  --shadow-3: 0 12px 32px rgba(0,0,0,.45);
  color-scheme: dark;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  background:
    radial-gradient(1100px 480px at 12% -8%, rgba(250,76,0,.05), transparent 55%),
    radial-gradient(900px 420px at 100% 0%, rgba(59,130,246,.035), transparent 50%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--orange-soft); color: var(--text); }

/* rolagem sem barra visível (página e tabelas) */
html, body, * { scrollbar-width: none; -ms-overflow-style: none; }
::-webkit-scrollbar { display: none; width: 0; height: 0; }

a, button, input, [tabindex] { font-family: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible, a:focus-visible {
  outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 4px;
}

/* ── Header ── */
.header {
  background: linear-gradient(180deg, var(--bg-elevated), var(--surface));
  border-bottom: 1px solid var(--hairline);
  padding: 14px 24px;
  display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
}
.header-icon {
  width: 38px; height: 38px;
  background: linear-gradient(155deg, #ff6a30, var(--orange));
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: #fff;
  box-shadow: 0 4px 14px var(--orange-glow), inset 0 1px 0 rgba(255,255,255,.25);
}
.header-icon svg { width: 20px; height: 20px; }
.header-title h1 { font-size: 15.5px; font-weight: 800; letter-spacing: -.01em; }
.header-title p  { font-size: 10.5px; color: var(--dim); letter-spacing: .3px; margin-top: 1px; }
.header-right    { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.live-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.live-dot   { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
.live-dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(34,197,94,.18); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.meta-tag {
  font-size: 11px; color: var(--muted); font-family: var(--font-mono);
  background: var(--surface2); padding: 4px 10px; border-radius: 20px;
  border: 1px solid var(--hairline); white-space: nowrap;
}

/* ── Filter bar ── */
.filter-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
  padding: 12px 24px;
  position: sticky; top: 65px; z-index: 99;
  display: flex; flex-direction: column; gap: 10px;
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
}
.filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip {
  background: var(--surface2); border: 1px solid var(--hairline); color: var(--muted);
  padding: 7px 14px; border-radius: 20px; font-size: 12px; cursor: pointer;
  transition: background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), transform .12s var(--ease);
  white-space: nowrap; font-weight: 600; -webkit-tap-highlight-color: transparent;
}
.chip:hover { color: var(--text); border-color: var(--border2); background: var(--surface-hover); }
.chip:active { transform: scale(.96); }
.chip.active { background: var(--orange-soft); border-color: var(--orange); color: var(--orange); }
.chip.chip-t1.active { background: rgba(59,130,246,.14); border-color: var(--blue); color: #7fb2ff; }
.chip.chip-t2.active { background: rgba(139,92,246,.14); border-color: var(--purple); color: #b79bfa; }
.chip.chip-t3.active { background: var(--orange-soft); border-color: var(--orange); color: var(--orange); }
.date-input {
  background: var(--surface2); border: 1px solid var(--hairline); color: var(--text);
  padding: 7px 10px; border-radius: var(--radius-sm); font-size: 12px; outline: none;
  font-family: var(--font-mono); transition: border-color .18s var(--ease);
  color-scheme: dark;
}
.date-sep { color: var(--faint); font-size: 12px; }
.search-wrap { position: relative; display: inline-flex; align-items: center; }
.search-wrap svg { position: absolute; left: 11px; width: 14px; height: 14px; color: var(--faint); pointer-events: none; }
.search-input {
  background: var(--surface2); border: 1px solid var(--hairline); color: var(--text);
  padding: 7px 12px 7px 32px; border-radius: var(--radius-sm); font-size: 12px; outline: none;
  min-width: 190px; transition: border-color .18s var(--ease);
}
.search-input::placeholder { color: var(--faint); }
.search-input:focus, .date-input:focus { border-color: var(--orange); }
.clear-btn {
  background: none; border: 1px solid var(--hairline); color: var(--dim);
  padding: 7px 14px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: color .18s var(--ease), border-color .18s var(--ease);
}
.clear-btn svg { width: 13px; height: 13px; }
.clear-btn:hover { color: var(--text); border-color: var(--border2); }
.filter-summary {
  font-size: 11px; color: var(--muted); margin-left: auto; text-align: right; font-family: var(--font-mono);
}
.filter-summary b { color: var(--orange); font-weight: 600; }

/* ── Content ── */
.content { padding: 22px 24px 48px; max-width: 1680px; margin: 0 auto; }
.section { margin-bottom: 28px; animation: fadeUp .35s var(--ease) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
.section-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  color: var(--muted); margin-bottom: 12px; padding-bottom: 9px;
  border-bottom: 1px solid var(--hairline);
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
}

/* ── KPI cards ── */
.kpi-row { display: grid; grid-template-columns: repeat(5,1fr); gap: 14px; }
.kpi-card {
  background: linear-gradient(160deg, var(--bg-elevated), var(--surface));
  border: 1px solid var(--hairline); border-radius: var(--radius);
  padding: 18px 20px; position: relative; overflow: hidden; cursor: pointer;
  transition: border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  box-shadow: var(--shadow-1);
}
.kpi-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: var(--shadow-2); }
.kpi-card:active { transform: translateY(-2px) scale(.99); }
.kpi-card.kpi-active { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange), var(--shadow-2); }
.kpi-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius: var(--radius) var(--radius) 0 0; }
.kpi-card.k-total::before { background: linear-gradient(90deg, var(--blue), #60a5fa); }
.kpi-card.k-saca::before  { background: linear-gradient(90deg, var(--orange), #ff8a50); }
.kpi-card.k-nao::before   { background: linear-gradient(90deg, var(--purple), #b79bfa); }
.kpi-card.k-pct::before   { background: linear-gradient(90deg, var(--orange), #ff8a50); }
.kpi-card.k-pctn::before  { background: linear-gradient(90deg, var(--muted), #dcdce0); }
.kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: .7px; color: var(--dim); margin-bottom: 9px; font-weight: 600; }
.kpi-value { font-size: 32px; font-weight: 800; line-height: 1; font-family: var(--font-mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.k-total .kpi-value { color: var(--blue); }
.k-saca  .kpi-value { color: var(--orange); }
.k-nao   .kpi-value { color: #b79bfa; }
.k-pct   .kpi-value { color: var(--orange); }
.k-pctn  .kpi-value { color: var(--muted); }
.kpi-sub { font-size: 11px; color: var(--faint); margin-top: 7px; }

/* ── Warning banner ── */
.warn-banner {
  margin-top: 12px; background: rgba(245,158,11,.07); border: 1px solid rgba(245,158,11,.3);
  color: var(--yellow); border-radius: var(--radius); padding: 13px 16px; font-size: 12px;
  cursor: pointer; display: flex; align-items: center; gap: 11px;
  transition: background .18s var(--ease), border-color .18s var(--ease);
}
.warn-banner svg { width: 18px; height: 18px; flex-shrink: 0; }
.warn-banner b { font-weight: 700; }
.warn-banner:hover { background: rgba(245,158,11,.12); border-color: rgba(245,158,11,.45); }
.warn-banner.kpi-active { box-shadow: 0 0 0 1px var(--yellow); }

/* ── Tables (shared) ── */
.turno-table-wrap {
  background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow-1);
}
.tbl-scroll-x { overflow-x: auto; }
table.data-tbl { width: 100%; border-collapse: collapse; min-width: 560px; }
table.data-tbl th {
  font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
  color: var(--dim); padding: 11px 15px; text-align: left;
  background: var(--surface2); border-bottom: 1px solid var(--hairline); font-weight: 700;
  white-space: nowrap;
}
table.data-tbl td { padding: 11px 15px; border-bottom: 1px solid var(--hairline); vertical-align: middle; font-size: 12.5px; }
table.data-tbl tr:last-child td { border-bottom: none; }
table.data-tbl tbody tr[data-clickable] { cursor: pointer; transition: background .16s var(--ease); }
table.data-tbl tbody tr[data-clickable]:hover td { background: rgba(255,255,255,.025); }
table.data-tbl tbody tr.row-active td { background: var(--orange-soft); box-shadow: inset 3px 0 0 var(--orange); }
table.data-tbl tr.row-total td { font-weight: 700; background: rgba(255,255,255,.02); }
.pct-cell { font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pct-bar-wrap { display:inline-block; width:64px; height:5px; background:var(--surface2); border-radius:3px; overflow:hidden; margin-left:9px; vertical-align:middle; }
.pct-bar { height:100%; background: linear-gradient(90deg, var(--orange), #ff8a50); border-radius: 3px; transition: width .4s var(--ease); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ── Evolution chart ── */
.evo-legend { display:flex; gap:18px; padding: 2px 2px 12px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.evo-legend span { display:inline-flex; align-items:center; gap:7px; }
.evo-legend i { width:10px; height:10px; border-radius:3px; display:inline-block; }
.evo-chart-card {
  background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius);
  padding: 16px 14px 8px; box-shadow: var(--shadow-1);
}
.evo-chart-wrap { position: relative; height: 260px; }
.evo-empty { text-align: center; padding: 40px 20px; color: var(--faint); font-size: 12.5px; }

/* ── Matrix (heatmap) ── */
.matrix-cell { cursor: pointer; border-radius: 8px; padding: 6px 10px !important; text-align: center; font-family: var(--font-mono); font-weight: 600; transition: box-shadow .16s var(--ease), transform .12s var(--ease); }
.matrix-cell:hover { box-shadow: inset 0 0 0 1px var(--border2); }
.matrix-cell:active { transform: scale(.96); }
.matrix-cell.active { box-shadow: inset 0 0 0 2px var(--orange) !important; }
.matrix-cell.empty-cell { color: var(--faint); font-weight: 400; cursor: default; }
.matrix-legend { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--faint); margin-top: 10px; }
.matrix-legend-bar { flex: 1; max-width: 180px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(250,76,0,.06), rgba(250,76,0,.9)); }

/* ── Validation panel ── */
.val-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
.val-card {
  background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 15px 17px;
  box-shadow: var(--shadow-1); transition: border-color .18s var(--ease);
}
.val-card .vtitle { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--dim); margin-bottom: 7px; font-weight: 600; }
.val-card .vval { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 7px; }
.val-card .vval svg { width: 17px; height: 17px; flex-shrink: 0; }
.val-card.ok { border-color: rgba(34,197,94,.25); }
.val-card.ok .vval { color: var(--green); }
.val-card.err { border-color: rgba(239,68,68,.35); }
.val-card.err .vval { color: var(--red); }
.val-card .vsub { font-size: 10.5px; color: var(--faint); margin-top: 5px; font-family: var(--font-mono); }

/* ── All TOs table ── */
.tbl-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 11px; flex-wrap: wrap; }
.tbl-toolbar .search-wrap { flex: 1; min-width: 220px; }
.tbl-toolbar .search-input { width: 100%; }
.export-btn {
  background: var(--surface2); border: 1px solid var(--hairline); color: var(--muted);
  padding: 8px 16px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px; font-weight: 600;
  transition: color .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease);
}
.export-btn svg { width: 14px; height: 14px; }
.export-btn:hover { color: var(--text); border-color: var(--border2); background: var(--surface-hover); }
.tbl-scroll { max-height: 540px; overflow: auto; background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); box-shadow: var(--shadow-1); }
.tbl-scroll table.data-tbl th { position: sticky; top: 0; z-index: 1; }
.pill { display:inline-flex; align-items:center; padding: 3px 10px; border-radius: 20px; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
.pill-saca { background: var(--orange-soft); color: var(--orange); border: 1px solid rgba(250,76,0,.3); }
.pill-nao  { background: rgba(139,92,246,.14); color: #b79bfa; border: 1px solid rgba(139,92,246,.3); }
.pill-sem  { background: rgba(245,158,11,.14); color: var(--yellow); border: 1px solid rgba(245,158,11,.3); }
.turno-pill { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 8px; font-family: var(--font-mono); }
.turno-pill.t1 { background: rgba(59,130,246,.14); color: #7fb2ff; }
.turno-pill.t2 { background: rgba(139,92,246,.14); color: #b79bfa; }
.turno-pill.t3 { background: var(--orange-soft); color: var(--orange); }
.tbl-count { font-size: 11px; color: var(--faint); margin-top: 7px; text-align: right; font-family: var(--font-mono); }

/* ── Empty / skeleton states ── */
.empty { text-align: center; padding: 80px 20px; color: var(--muted); }
.empty svg { width: 42px; height: 42px; color: var(--faint); margin-bottom: 14px; }
.empty h2 { font-size: 17px; margin-bottom: 8px; color: var(--text); font-weight: 700; }
.empty code {
  display: inline-block; background: var(--surface); border: 1px solid var(--hairline);
  padding: 12px 20px; border-radius: var(--radius-sm); font-size: 12px; margin-top: 16px;
  text-align: left; line-height: 1.9; font-family: var(--font-mono); color: var(--muted);
}

.skeleton-row { display: grid; grid-template-columns: repeat(5,1fr); gap: 14px; padding: 22px 24px; max-width: 1680px; margin: 0 auto; }
.skel-card { height: 108px; border-radius: var(--radius); background: linear-gradient(100deg, var(--surface) 30%, var(--surface2) 50%, var(--surface) 70%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { 0% { background-position: 160% 0; } 100% { background-position: -60% 0; } }
@media (prefers-reduced-motion: reduce) { .skel-card { animation: none; opacity: .6; } }

/* ── Responsive ── */
@media (max-width: 1180px) {
  .kpi-row { grid-template-columns: repeat(3,1fr); }
  .skeleton-row { grid-template-columns: repeat(3,1fr); }
}
@media (max-width: 760px) {
  .header { padding: 12px 16px; gap: 10px; }
  .header-title p { display: none; }
  .filter-bar { padding: 10px 16px; top: 61px; }
  .content { padding: 16px 14px 40px; }
  .kpi-row { grid-template-columns: repeat(2,1fr); gap: 10px; }
  .skeleton-row { grid-template-columns: repeat(2,1fr); padding: 16px 14px; }
  .val-grid { grid-template-columns: repeat(2,1fr); }
  .kpi-value { font-size: 26px; }
  .filter-summary { width: 100%; text-align: left; margin-left: 0; order: 10; }
  .date-input, .search-input { font-size: 16px; } /* evita zoom automatico no iOS */
  .tbl-toolbar .search-wrap { flex-basis: 100%; }
}
@media (max-width: 420px) {
  .kpi-row { grid-template-columns: 1fr 1fr; }
  .val-grid { grid-template-columns: 1fr; }
}
</style>
