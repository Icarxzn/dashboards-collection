name: Daily FIFO Report

on:
  schedule:
    # Executa todos os dias às 08:00 (horário UTC, ajuste conforme seu fuso)
    # Para 8h no horário de Brasília (UTC-3), use 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:  # Permite executar manualmente

jobs:
  send-report:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: report-fifo-seatalk   # bootseatalk.py, requirements.txt e credencial.json ficam aqui

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnss3 \
          libnspr4 \
          libatk1.0-0 \
          libatk-bridge2.0-0 \
          libcups2 \
          libdrm2 \
          libdbus-1-3 \
          libxkbcommon0 \
          libatspi2.0-0 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libgbm1 \
          libpango-1.0-0 \
          libcairo2 \
          libasound2
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
    
    - name: Create credentials file
      run: |
        echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credencial.json
    
    - name: Run report script
      env:
        SEATALK_WEBHOOK_URL: ${{ secrets.SEATALK_WEBHOOK_URL }}
      run: |
        python bootseatalk.py
    
    - name: Clean up credentials
      if: always()
      run: |
        rm -f credencial.json
