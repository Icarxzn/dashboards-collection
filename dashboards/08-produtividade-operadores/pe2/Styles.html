<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* rolagem sem barra visível */
html, body, * { scrollbar-width: none; -ms-overflow-style: none; }
::-webkit-scrollbar { display: none; width: 0; height: 0; }

:root {
  --bg: #0c0d10;
  --side: #111216;
  --surface: #17181d;
  --surface2: #202128;
  --border: rgba(255,255,255,.07);
  --border2: rgba(255,255,255,.14);
  --text: #ececf1;
  --muted: #8b8d9a;
  --orange: #ee4d2d;
  --orange2: #ff8a3d;
  --amber: #ffb547;
  --accent: #ee4d2d;
  --grad: linear-gradient(135deg, #ee4d2d, #ff8a3d);
  --ok: #22c55e; --mid: #facc15; --bad: #ef4444;   /* semáforo padrão */
  --meta: #ececf1;
  --zero: #33353f;
  --surface-b: #131418;
  --track: rgba(255,255,255,.07);
  --hover: rgba(255,255,255,.04);
  --tag-bg: #26272f;
  --erro-txt: #fecdd3;
  --radius: 14px;
  --shadow: 0 8px 24px rgba(0,0,0,.45);
}

/* ── Modo claro ── */
[data-theme="light"] {
  --bg: #f5f3f1;
  --side: #ffffff;
  --surface: #ffffff;
  --surface-b: #fbfaf9;
  --surface2: #f1eeeb;
  --border: rgba(40,30,20,.08);
  --border2: rgba(40,30,20,.16);
  --text: #1f1c1a;
  --muted: #6e6862;
  --ok: #16a34a; --mid: #ca8a04; --bad: #dc2626;
  --meta: #1f1c1a;
  --zero: #d6d0ca;
  --track: rgba(40,30,20,.08);
  --hover: rgba(40,30,20,.04);
  --tag-bg: #ffffff;
  --erro-txt: #9f1239;
  --shadow: 0 6px 18px rgba(40,30,20,.08);
}

html, body { background: var(--bg); }
body {
  color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; min-height: 100vh;
  background: radial-gradient(1200px 600px at 85% -10%, rgba(238,77,45,.10), transparent 60%),
              radial-gradient(900px 500px at 10% 110%, rgba(255,138,61,.05), transparent 60%), var(--bg);
}

.app { display: grid; grid-template-columns: 220px 1fr; height: 100vh; }

/* ── Menu lateral ── */
.side {
  background: var(--side); border-right: 1px solid var(--border); padding: 22px 14px;
  display: flex; flex-direction: column; gap: 26px; position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.logo {
  width: 40px; height: 40px; border-radius: 12px; background: var(--grad);
  display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0;
  box-shadow: 0 6px 18px rgba(238,77,45,.45);
}
.brand-txt b { display: block; font-size: 14px; }
.brand-txt small { color: var(--muted); font-size: 11px; letter-spacing: .5px; }
.nav { display: flex; flex-direction: column; gap: 6px; }
.nav-btn {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; border: none;
  background: none; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; text-align: left;
  transition: background .15s, color .15s;
}
.nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav-btn:hover { color: var(--text); background: var(--hover); }
.nav-btn.active { color: #fff; background: var(--grad); box-shadow: 0 6px 18px rgba(238,77,45,.35); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 6px; font-size: 11px; color: var(--muted); }
.live { display: flex; align-items: center; gap: 7px; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.live-dot.on { background: var(--ok); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.janela { font-family: monospace; }

/* ── Área principal ── */
.main { padding: 22px 26px 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0; height: 100vh; overflow: auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { font-size: 20px; font-weight: 700; }
.top p { font-size: 12px; color: var(--muted); margin-top: 2px; }
.top-right { display: flex; align-items: center; gap: 12px; }
.turno-sel {
  display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--border2);
}
.ts-lbl { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; padding: 0 8px 0 10px; }
.turno-sel button {
  position: relative; border: none; background: none; color: var(--muted); cursor: pointer;
  padding: 8px 18px; border-radius: 10px; font-size: 14px; font-weight: 800; line-height: 1.1;
  display: flex; flex-direction: column; align-items: center; transition: background .15s, color .15s;
}
.turno-sel button small { font-size: 10px; font-weight: 600; opacity: .8; }
.turno-sel button:hover { color: var(--text); background: var(--hover); }
.turno-sel button.active { background: var(--grad); color: #fff; box-shadow: 0 4px 14px rgba(238,77,45,.35); }
.turno-sel button.atual::after {     /* pontinho no turno que está rodando agora */
  content: ''; position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
}
.agora { font-size: 11px; color: var(--muted); font-family: monospace; }
.st-btn {
  display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; border: none;
  background: var(--grad); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;
  box-shadow: 0 6px 16px rgba(238,77,45,.3); transition: transform .15s, box-shadow .15s;
}
.st-btn svg { width: 16px; height: 16px; }
.st-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(238,77,45,.4); }

/* ── Janela do Seatalk ── */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
.modal[hidden] { display: none; }
.modal-box {
  background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; width: min(720px, 100%);
  max-height: 90vh; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow);
}
.modal-head { display: flex; align-items: center; justify-content: space-between; }
.modal-head h3 { font-size: 16px; }
.modal-x { background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; line-height: 1; }
.modal-txt { font-size: 13px; color: var(--muted); line-height: 1.5; }
.modal-txt b { color: var(--text); }
.modal-input { width: 100%; margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 13px; outline: none; }
.modal-input:focus { border-color: var(--orange); }
.modal-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 700; margin-bottom: 6px; }
.modal-pre { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-family: monospace; font-size: 12px; line-height: 1.55; white-space: pre-wrap; margin-bottom: 10px; }
.modal-img { width: 100%; border-radius: 10px; border: 1px solid var(--border); display: block; }
.modal-msg { font-size: 13px; min-height: 18px; }
.modal-msg.ok { color: var(--ok); } .modal-msg.erro { color: var(--bad); }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; }
.btn-sec, .btn-pri { height: 38px; padding: 0 18px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn-sec { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); }
.btn-pri { background: var(--grad); border: none; color: #fff; }
.btn-pri:disabled { opacity: .5; cursor: default; }

.theme-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border2); background: var(--surface);
  cursor: pointer; font-size: 17px; line-height: 1; transition: border-color .15s, transform .15s;
}
.theme-btn:hover { transform: translateY(-1px); border-color: var(--orange); }
body { transition: background-color .2s, color .2s; }
[data-theme="light"] body {
  background: radial-gradient(1200px 600px at 85% -10%, rgba(238,77,45,.12), transparent 60%),
              radial-gradient(900px 500px at 10% 110%, rgba(255,138,61,.10), transparent 60%), var(--bg);
}
.erro { background: rgba(251,113,133,.12); border: 1px solid var(--bad); color: var(--erro-txt); padding: 10px 14px; border-radius: 10px; }
.aba { display: flex; flex-direction: column; gap: 18px; }
#aba-geral { flex: 1; min-height: 560px; }   /* visão geral ocupa a altura que sobra da tela */
.aba[hidden] { display: none; }

.card {
  background: linear-gradient(160deg, var(--surface), var(--surface-b));
  border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
}
.card-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
.count { color: var(--muted); font-weight: 600; margin-left: 4px; }

/* ── Linha de cima: anéis + mini cartões ── */
.row-top { display: grid; grid-template-columns: repeat(3, 1fr) 1.15fr; gap: 18px; }
.spark-col .ring-card { flex: none; }
.ring-card { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; padding: 22px 14px; }
.ring { width: 150px; height: 150px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-val { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-val b { font-size: 32px; font-weight: 700; font-family: monospace; }
.ring-val small { font-size: 11px; color: var(--muted); }
.ring-lbl { font-size: 13px; font-weight: 600; margin-top: 8px; }
.ring-sub { font-size: 11px; color: var(--muted); font-family: monospace; }

.mini-col { display: flex; flex-direction: column; gap: 18px; }
.mini { padding: 14px 16px; flex: 1; }
.mini h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 700; margin-bottom: 10px; }
.hbar { display: grid; grid-template-columns: 92px 1fr 62px; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12px; }
.hbar:last-child { margin-bottom: 0; }
.hbar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar .trk { height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; }
.hbar .trk i { display: block; height: 100%; border-radius: 4px; background: var(--grad); }
.hbar b { text-align: right; font-family: monospace; font-size: 12px; }

/* ── Linha de baixo: cartões com área + gráfico ── */
.row-bottom { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: stretch; flex: 1; min-height: 0; }
.spark-col { display: flex; flex-direction: column; gap: 18px; }
.spark-card { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.spark-head { display: flex; align-items: center; gap: 14px; }
.badge {
  width: 46px; height: 46px; border-radius: 50%; background: var(--grad); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: #fff;
  box-shadow: 0 6px 16px rgba(238,77,45,.4);
}
.badge.b2 { background: linear-gradient(135deg, #ff8a3d, #ffb547); font-size: 14px; }
.spark-head b { display: block; font-size: 28px; font-family: monospace; font-weight: 700; line-height: 1.1; }
.spark-head small { color: var(--muted); font-size: 11px; }
/* o SVG fica "solto" (absolute) dentro da área: lê o tamanho do espaço sem empurrá-lo -> sem crescer sem parar */
.spark { flex: 1; min-height: 70px; position: relative; }
.spark svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.spark-foot { font-size: 11px; color: var(--muted); margin-top: auto; }
.spark-foot b { color: var(--text); font-family: monospace; }

.chart-card { display: flex; flex-direction: column; }
.ph-resumo { margin-left: auto; font-size: 12px; color: var(--muted); }
.ph-resumo b { color: var(--text); font-family: monospace; font-size: 14px; margin: 0 2px; }
.ph-resumo .sep { margin: 0 8px; color: var(--border2); }
.ph-chart { flex: 1; min-height: 300px; position: relative; }
.ph-chart svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.ph-chart text, .spark text { font-family: monospace; }
.ph-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 6px; }
.ph-legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.dot.bar { background: var(--grad); }
.leg-sep { margin-left: 8px; font-weight: 700; }
.dot.ok { background: var(--ok); } .dot.mid { background: var(--mid); } .dot.bad { background: var(--bad); }
.ph-legend .mark { display: inline-block; width: 18px; height: 2.5px; background: var(--meta); margin-right: 6px; vertical-align: 3px; }

/* ── Chips / toolbar ── */
.chips { display: flex; gap: 4px; }
.chip {
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  padding: 5px 13px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.chip.active { background: var(--grad); border-color: transparent; color: #fff; }
.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-left: auto; }
.check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--orange); }
.search-wrap {
  display: flex; align-items: center; gap: 8px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 10px; padding: 7px 11px; color: var(--muted);
}
.search-wrap input { background: none; border: none; outline: none; color: var(--text); font-size: 12px; width: 220px; }

/* ── Tabela ── */
.table-wrap { overflow: auto; max-height: calc(100vh - 210px); border: 1px solid var(--border); border-radius: 10px; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  position: sticky; top: 0; background: var(--surface2); z-index: 2;
  font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px;
  padding: 10px 8px; text-align: center; cursor: pointer; white-space: nowrap; user-select: none;
  border-bottom: 1px solid var(--border);
}
.tbl th.l, .tbl td.l { text-align: left; }
.tbl th.sorted { color: var(--text); }
.tbl td { padding: 8px; border-bottom: 1px solid var(--border); text-align: center; white-space: nowrap; }
.tbl tbody tr:hover td { background: var(--hover); }
.tbl td.rank { color: var(--muted); width: 36px; }
.tbl td.nome { font-weight: 600; }
.tbl td.nome small { display: block; color: var(--muted); font-weight: 500; font-size: 11px; }
.tbl td.tot { font-weight: 800; color: var(--orange2); }
.tbl td.num, .tbl td.hc { font-family: monospace; }
.tbl td.hc { font-size: 12px; min-width: 52px; }
.tbl td.zero { color: var(--zero); }
/* célula da hora pela meta de 500/h: verde ≥ 500 · amarelo 400–499 · vermelho < 400 */
.tbl td.c-ok  { background: rgba(52,211,153,.16); color: var(--ok); font-weight: 700; }
.tbl td.c-mid { background: rgba(251,191,36,.15); color: var(--mid); font-weight: 700; }
.tbl td.c-bad { background: rgba(251,113,133,.12); color: var(--bad); }
.tbl td.t-ok { color: var(--ok); font-weight: 700; } .tbl td.t-mid { color: var(--mid); font-weight: 700; } .tbl td.t-bad { color: var(--bad); font-weight: 700; }
.tbl tfoot td {
  position: sticky; bottom: 0; background: var(--surface2); font-weight: 800;
  border-top: 1px solid var(--border); border-bottom: none;
}
.nota { font-size: 11px; color: var(--muted); margin-top: 10px; }
.nota b { color: var(--text); }
.vazio { padding: 24px; text-align: center; color: var(--muted); }

@media (max-width: 1280px) {
  .st-btn span { display: none; }
  .row-top { grid-template-columns: repeat(3, 1fr); }
  .mini-col { grid-column: 1 / -1; flex-direction: row; }
  .row-bottom { grid-template-columns: 1fr; }
  .spark-col { flex-direction: row; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; align-items: center; padding: 10px 14px; gap: 12px; }
  .brand-txt, .side-foot { display: none; }
  .nav { flex-direction: row; }
  .main { padding: 16px; }
  .row-top { grid-template-columns: 1fr; }
  .mini-col, .spark-col { flex-direction: column; }
  .search-wrap input { width: 140px; }
}
</style>
