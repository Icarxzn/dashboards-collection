<script>
// ═══════════════════════════════════════════════════════════════
//  Produtividade por Operador — lógica da tela
// ═══════════════════════════════════════════════════════════════
const POLL_MS = 15000;               // consulta o servidor (que responde do cache)
const TURNOS = ['T1', 'T2', 'T3'];   // T1 06–14 · T2 14–22 · T3 22–06

// Modo claro / escuro (lembra a escolha neste navegador)
(function () {
  let salvo = 'dark';
  try { salvo = localStorage.getItem('prodTheme') || 'dark'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', salvo);
  quandoPronto(() => { document.getElementById('themeBtn').textContent = salvo === 'light' ? '🌙' : '☀️'; });
})();
function toggleTheme() {
  const html = document.documentElement;
  const prox = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', prox);
  document.getElementById('themeBtn').textContent = prox === 'light' ? '🌙' : '☀️';
  try { localStorage.setItem('prodTheme', prox); } catch (e) {}
}

function quandoPronto(fn) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
  else fn();
}

let DATA = null;
let ultimoCarimbo = null;
const estado = { turno: '', busca: '', soAtivos: true, sort: 'total', dir: -1 };

function gs(fn, ...args) {
  return new Promise((ok, err) => {
    google.script.run.withSuccessHandler(ok).withFailureHandler(err)[fn](...args);
  });
}

const fmt = n => Math.round(n).toLocaleString('pt-BR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MINUSC = new Set(['de', 'da', 'do', 'das', 'dos', 'e']);
function nomeBonito(s) {
  return String(s).toLowerCase().split(/\s+/).filter(Boolean)
    .map((p, i) => (i > 0 && MINUSC.has(p)) ? p : p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
}
function turnoDaHora(hhmm) {
  const h = parseInt(hhmm, 10);
  return h >= 6 && h < 14 ? 'T1' : h >= 14 && h < 22 ? 'T2' : 'T3';
}
const corTurno = t => 'var(--' + t.toLowerCase() + ')';

// ── Carga ─────────────────────────────────────────────────────
async function carregar() {
  try {
    const json = await gs('getProdutividade');
    const d = JSON.parse(json);
    if (d.error) throw new Error(d.error);
    document.getElementById('erro').hidden = true;
    document.getElementById('liveDot').classList.add('on');
    if (d.fetchedAt !== ultimoCarimbo) {
      ultimoCarimbo = d.fetchedAt;
      DATA = preparar(d);
      renderTudo();
    }
    const dt = new Date(d.fetchedAt);
    document.getElementById('lastUpdated').textContent =
      'Atualizado ' + dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch (e) {
    document.getElementById('liveDot').classList.remove('on');
    const el = document.getElementById('erro');
    el.textContent = 'Erro ao carregar: ' + (e && e.message ? e.message : e);
    el.hidden = false;
  }
}

function preparar(d) {
  const turnoH = d.horas.map(turnoDaHora);
  d.turnoH = turnoH;
  d.ops.forEach(o => {
    o.nomeFmt = nomeBonito(o.nome);
    o.horasAtivas = o.h.filter(v => v > 0).length;
    o.uph = o.horasAtivas ? o.total / o.horasAtivas : 0;
    o.horasMeta = o.h.filter(v => v >= META_OP_HORA).length;
    const porT = { T1: 0, T2: 0, T3: 0 };
    o.h.forEach((v, k) => { porT[turnoH[k]] += v; });
    o.turno = o.total > 0 ? TURNOS.reduce((a, t) => porT[t] > porT[a] ? t : a, 'T1') : '';
    o.porT = porT;
  });
  d.maxCel = Math.max(1, ...d.ops.map(o => Math.max(0, ...o.h)));
  d.maxTot = Math.max(1, ...d.ops.map(o => o.total));
  return d;
}

function renderTudo() {
  if (!estado.chartTurno) estado.chartTurno = turnoDaHora(DATA.agora || '06:00');   // abre no turno atual
  renderKpis();
  renderChart();
  renderTabela();
  requestAnimationFrame(() => { renderKpis(); renderChart(); });   // 2ª passada com o layout já montado
}

// ── Visão geral: anéis, mini cartões e áreas ─────────────────
function renderKpis() {
  const d = DATA;
  const ativos = d.ops.filter(o => o.total > 0);
  const horasOp = ativos.reduce((a, o) => a + o.horasAtivas, 0);
  const somaAtivos = ativos.reduce((a, o) => a + o.total, 0);
  const uph = horasOp ? somaAtivos / horasOp : 0;
  const tAtual = turnoDaHora(d.agora || '06:00');
  const tSel = estado.chartTurno || tAtual;
  document.getElementById('turnoAtual').textContent = 'Agora ' + (d.agora || '') + ' · ' + tAtual;
  document.querySelectorAll('#selTurno button').forEach(b => {
    b.classList.toggle('active', b.dataset.t === tSel);
    b.classList.toggle('atual', b.dataset.t === tAtual);
    b.title = { T1: '06:00 – 13:59', T2: '14:00 – 21:59', T3: '22:00 – 05:59' }[b.dataset.t] + (b.dataset.t === tAtual ? ' · turno atual' : '');
  });
  const hs = d.horas;
  document.getElementById('metaTag').textContent = hs.length ? 'Janela ' + hs[0] + ' – ' + hs[hs.length - 1] : '—';

  // Anel 1: % da meta do turno escolhido (meta até agora)
  const rt = calcTurno(tSel);
  const pT = rt.meta ? rt.prod / rt.meta : 0;
  anel('ringMeta', pT, rt.meta ? pct1(pT) : '—', tSel);
  document.getElementById('ringMetaLbl').textContent = 'da meta do ' + tSel;
  document.getElementById('ringMetaSub').textContent = rt.meta ? fmt(rt.prod) + ' de ' + fmt(rt.meta) : 'sem meta cadastrada';

  // Área 1: produção por hora
  document.getElementById('sTotal').textContent = fmt(d.geral.total);
  sparkline('sparkProd', d.geral.h, ['#ee4d2d', '#ff8a3d']);
  let iPico = -1;
  d.geral.h.forEach((v, k) => { if (v > 0 && (iPico < 0 || v > d.geral.h[iPico])) iPico = k; });
  document.getElementById('sPico').innerHTML = iPico >= 0
    ? 'Hora pico <b>' + d.horas[iPico] + '</b> · <b>' + fmt(d.geral.h[iPico]) + '</b> unidades' : 'Sem produção';

  // Área 2: operadores ativos por hora
  const opsHora = d.horas.map((_, k) => d.ops.filter(o => o.h[k] > 0).length);
  document.getElementById('sOps').textContent = fmt(ativos.length);
  document.getElementById('sOpsSub').textContent = 'operadores com produção · ' + fmt(d.ops.length) + ' na lista';
  sparkline('sparkOps', opsHora, ['#ff8a3d', '#ffb547']);
  document.getElementById('sMedia').innerHTML = 'Média <b>' + (ativos.length ? fmt(somaAtivos / ativos.length) : '—') +
    '</b> por operador · até <b>' + Math.max(0, ...opsHora) + '</b> operadores na mesma hora';
}

function anel(id, frac, valor, sub) {
  const r = 62, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac || 0));
  document.getElementById(id).innerHTML =
    '<svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="' + r + '" fill="none" style="stroke:var(--track)" stroke-width="12"/>' +
    '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="url(#gRing)" stroke-width="12" stroke-linecap="round" ' +
    'stroke-dasharray="' + (c * f).toFixed(1) + ' ' + c.toFixed(1) + '"/></svg>' +
    '<div class="ring-val"><b>' + valor + '</b><small>' + (sub || '') + '</small></div>';
}

function hbar(rotulo, v, max) {
  return '<div class="hbar"><span title="' + esc(rotulo) + '">' + esc(rotulo) + '</span>' +
    '<div class="trk"><i style="width:' + (v / max * 100).toFixed(1) + '%"></i></div><b>' + fmt(v) + '</b></div>';
}

function sparkline(id, vals, cores) {
  const box = document.getElementById(id);
  const W = Math.max(200, box.clientWidth), H = Math.max(60, box.clientHeight);
  const max = Math.max(1, ...vals), n = vals.length;
  if (n < 2) { box.innerHTML = ''; return; }
  const x = i => i / (n - 1) * W, y = v => H - 6 - (H - 14) * v / max;
  let dPath = 'M' + x(0) + ',' + y(vals[0]);
  for (let i = 0; i < n - 1; i++) {     // curva suave entre os pontos (não passa do valor de nenhum deles)
    const xm = (x(i) + x(i + 1)) / 2;
    dPath += ' C' + xm + ',' + y(vals[i]) + ' ' + xm + ',' + y(vals[i + 1]) + ' ' + x(i + 1) + ',' + y(vals[i + 1]);
  }
  const gid = 'g' + id;
  box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + cores[0] + '" stop-opacity=".55"/>' +
    '<stop offset="1" stop-color="' + cores[1] + '" stop-opacity="0"/></linearGradient>' +
    '<linearGradient id="' + gid + 'l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="' + cores[0] + '"/><stop offset="1" stop-color="' + cores[1] + '"/></linearGradient></defs>' +
    '<path d="' + dPath + ' L' + W + ',' + H + ' L0,' + H + ' Z" fill="url(#' + gid + ')"/>' +
    '<path d="' + dPath + '" fill="none" stroke="url(#' + gid + 'l)" stroke-width="2.5"/></svg>';
}

// ── Produção por hora × meta ─────────────────────────────────
// Turnos do gráfico: T1 06:00–13:59 · T2 14:00–21:59 · T3 22:00–05:59
const HORAS_TURNO = {
  T1: [6, 7, 8, 9, 10, 11, 12, 13],
  T2: [14, 15, 16, 17, 18, 19, 20, 21],
  T3: [22, 23, 0, 1, 2, 3, 4, 5],
};
const LIMIAR_MELHORAR = 0.8;   // ≥ 100% bateu · ≥ 80% dá pra melhorar · abaixo baixa performance
const META_OP_HORA = 500;      // meta por operador por hora (UPH)
const stOp = v => v >= META_OP_HORA ? 'ok' : v >= META_OP_HORA * LIMIAR_MELHORAR ? 'mid' : 'bad';
const posDia = h => (h - 6 + 24) % 24;          // posição da hora no dia operacional (06h = 0)
const faixa = h => String(h).padStart(2, '0') + '-' + String((h + 1) % 24).padStart(2, '0');

function calcTurno(t) {
  const d = DATA;
  const real = {};
  d.horas.forEach((hr, k) => { real[parseInt(hr, 10)] = d.geral.h[k]; });
  const [ah, am] = (d.agora || '00:00').split(':').map(Number);
  const agoraPos = posDia(ah);
  const pts = HORAS_TURNO[t].map(h => {
    const r = h in real && posDia(h) <= agoraPos ? real[h] : null;
    const m = d.meta && d.meta[h] != null ? d.meta[h] : null;
    // meta "até agora": hora passada inteira, hora atual proporcional aos minutos, futuras não contam
    const frac = posDia(h) < agoraPos ? 1 : posDia(h) === agoraPos ? am / 60 : 0;
    const emAndamento = posDia(h) === agoraPos;
    // hora em andamento: compara com a meta proporcional; nos primeiros 10 min fica neutra (ainda não diz nada)
    const p = r == null || !m ? null : emAndamento ? (am < 10 ? null : r / (m * frac)) : r / m;
    const st = p == null ? 'na' : p >= 1 ? 'ok' : p >= LIMIAR_MELHORAR ? 'mid' : 'bad';
    return { h: h, r: r, m: m, p: p, st: st, agora: emAndamento, mAteAgora: (m || 0) * frac };
  });
  const comDado = pts.filter(x => x.r != null);
  return { pts: pts, comDado: comDado, prod: comDado.reduce((a, x) => a + x.r, 0), meta: pts.reduce((a, x) => a + x.mAteAgora, 0) };
}

// exp = {W, H}: desenha num tamanho fixo e devolve o SVG (usado na imagem do Seatalk) sem mexer na tela
function renderChart(exp) {
  const t = estado.chartTurno;
  const { pts, comDado, prod, meta } = calcTurno(t);
  const pctT = meta ? prod / meta : null;
  const stT = pctT == null ? '' : pctT >= 1 ? 'ok' : pctT >= LIMIAR_MELHORAR ? 'mid' : 'bad';
  if (!exp) document.getElementById('phResumo').innerHTML = comDado.length
    ? 'Produzido <b>' + fmt(prod) + '</b><span class="sep">|</span>Meta até agora <b>' + (meta ? fmt(meta) : '—') + '</b>' +
      (pctT != null ? '<span class="sep">|</span><b style="color:var(--' + stT + ')">' + pct1(pctT) + '</b> da meta' : '')
    : 'Sem produção no ' + t;

  // Gráfico (SVG): barra = realizado, traço = meta da hora
  const box = exp ? null : document.getElementById('chart');
  // na tela: ocupa o espaço livre do cartão (o SVG não influencia esse tamanho); na exportação: tamanho fixo
  const W = exp ? exp.W : Math.max(520, box.clientWidth);
  const H = exp ? exp.H : Math.max(300, box.clientHeight);
  const pl = 56, pr = 8, pt = 40, pb = 56;
  const n = pts.length, slot = (W - pl - pr) / n, bw = Math.min(84, slot * 0.52);
  const fsBar = Math.max(12.5, Math.min(16, bw / 4.3));          // número da barra cabe na largura da barra
  ESCALA_META = Math.max(0.8, Math.min(1, slot / 110));         // etiqueta da meta acompanha a largura
  const vmax = Math.max(1, ...pts.map(x => Math.max(x.r || 0, x.m || 0))) * 1.12;
  const y = v => pt + (H - pt - pb) * (1 - v / vmax);
  const cx = i => pl + slot * i + slot / 2;
  const cor = { ok: 'var(--ok)', mid: 'var(--mid)', bad: 'var(--bad)', na: 'var(--muted)' };
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Produção por hora do ' + t + ' comparada à meta">' +
    // semáforo padrão em degradê: verde = bateu a meta · amarelo = 80–99% · vermelho = abaixo de 80% · cinza = sem meta
    '<defs>' + [['ok', '#4ade80', '#16a34a'], ['mid', '#fde047', '#eab308'], ['bad', '#f87171', '#dc2626'], ['na', '#9ca3af', '#6b7280']]
      .map(g => '<linearGradient id="gBar-' + g[0] + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + g[1] + '"/><stop offset="1" stop-color="' + g[2] + '"/></linearGradient>').join('') + '</defs>';
  for (let g = 0; g <= 4; g++) {
    const v = vmax / 4 * g;
    s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '" style="stroke:var(--border)"' + (g ? ' stroke-dasharray="2 4"' : '') + '/>' +
      '<text x="' + (pl - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="12" style="fill:var(--muted)">' + fmtK(v) + '</text>';
  }
  pts.forEach((x, i) => {
    const c = cx(i);
    if (x.r != null) {
      const yt = Math.min(y(x.r), H - pb - 2);
      s += '<rect x="' + (c - bw / 2) + '" y="' + yt + '" width="' + bw + '" height="' + (H - pb - yt) + '" rx="6" fill="url(#gBar-' + x.st + ')" opacity="' + (x.agora ? '.5' : '1') + '">' +
        '<title>' + faixa(x.h) + ' · ' + fmt(x.r) + (x.m ? ' de ' + fmt(x.m) + ' (' + pct1(x.p) + ')' : '') + '</title></rect>';
      const dentro = (H - pb - yt) > fsBar * 2.2;   // barra alta: número dentro do topo da barra; baixa: logo acima
      let ylab = dentro ? yt + fsBar * 1.45 : yt - 10;
      // se o número cair na etiqueta/ponto da meta, desce para logo abaixo da linha
      if (x.m != null && ylab > y(x.m) - 38 && ylab < y(x.m) + 14) {
        const abaixo = y(x.m) + 30;
        if (abaixo < H - pb - 6) ylab = abaixo;
      }
      s += '<text x="' + c + '" y="' + ylab + '" text-anchor="middle" font-size="' + fsBar.toFixed(1) + '" font-weight="700" style="fill:' + (!dentro ? 'var(--text)' : x.st === 'mid' ? '#2a2105' : '#ffffff') + '">' + fmt(x.r) + '</text>';
    }
    const base = H - pb;
    s += '<text x="' + c + '" y="' + (base + 22) + '" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--text)">' + String(x.h).padStart(2, '0') + 'h</text>' +
      '<text x="' + c + '" y="' + (base + 43) + '" text-anchor="middle" font-size="15" font-weight="700" style="fill:' + cor[x.st] + '">' + (x.p != null ? pct1(x.p) : x.agora && x.r != null ? 'agora' : '—') + '</text>';
  });
  // Linha da meta: curva ligando a meta de cada hora, com um ponto e o valor em cima de cada hora
  const mp = pts.map((x, i) => x.m != null ? [cx(i), y(x.m), x] : null).filter(Boolean);
  if (mp.length > 1) {
    // curva arredondada: controles na metade do caminho, na altura de cada ponto -> sem ondas além dos pontos
    let dPath = 'M' + mp[0][0] + ',' + mp[0][1];
    for (let i = 0; i < mp.length - 1; i++) {
      const xm = (mp[i][0] + mp[i + 1][0]) / 2;
      dPath += ' C' + xm + ',' + mp[i][1] + ' ' + xm + ',' + mp[i + 1][1] + ' ' + mp[i + 1][0] + ',' + mp[i + 1][1];
    }
    s += '<path d="' + dPath + '" fill="none" style="stroke:var(--meta)" stroke-width="7" stroke-opacity=".12" stroke-linecap="round"/>' +
         '<path d="' + dPath + '" fill="none" style="stroke:var(--meta)" stroke-width="2.5" stroke-linecap="round"/>';
  }
  mp.forEach(p => {
    s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="5" style="fill:var(--meta);stroke:var(--surface)" stroke-width="2"><title>Meta ' + faixa(p[2].h) + ': ' + fmt(p[2].m) + '</title></circle>' +
      // valor da meta em cima do ponto, numa etiqueta escura (lê bem mesmo sobre a barra)
      etiquetaMeta(p[0], p[1] - 22, fmt(p[2].m));
  });
  if (exp) return s + '</svg>';
  box.innerHTML = s + '</svg>';
}

let ESCALA_META = 1;
function etiquetaMeta(x, y, txt) {
  const f = 13 * ESCALA_META, w = txt.length * f * 0.62 + 12, h = f + 7;
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h + '" rx="6" style="fill:var(--tag-bg);stroke:var(--border2)"/>' +
    '<text x="' + x + '" y="' + (y + f * 0.35) + '" text-anchor="middle" font-size="' + f.toFixed(1) + '" font-weight="700" style="fill:var(--meta)">' + txt + '</text>';
}

const pct1 = p => (p * 100).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + '%';
const fmtK = v => v >= 1000 ? (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 'k' : fmt(v);

// ── Tabela ────────────────────────────────────────────────────
function filtrados() {
  const b = estado.busca.trim().toLowerCase();
  return DATA.ops.filter(o =>
    (!estado.soAtivos || o.total > 0) &&
    (!estado.turno || o.turno === estado.turno) &&
    (!b || o.nome.toLowerCase().includes(b) || o.id.toLowerCase().includes(b)));
}

function ordenar(lista) {
  const s = estado.sort, dir = estado.dir;
  const val = o => s === 'nome' ? o.nomeFmt : s === 'turno' ? o.turno :
    s.startsWith('h') ? o.h[Number(s.slice(1))] : o[s];
  return lista.slice().sort((a, b) => {
    const va = val(a), vb = val(b);
    if (typeof va === 'string') return va.localeCompare(vb, 'pt-BR') * dir;
    return (va - vb) * dir || b.total - a.total;
  });
}

function renderTabela() {
  const d = DATA;
  const lista = ordenar(filtrados());
  const th = (key, label, cls) => '<th class="' + (cls || '') + (estado.sort === key ? ' sorted' : '') +
    '" onclick="ordenarPor(\'' + key + '\')">' + label + (estado.sort === key ? (estado.dir > 0 ? ' ▲' : ' ▼') : '') + '</th>';
  document.getElementById('thead').innerHTML = '<tr><th>#</th>' +
    th('nome', 'Operador', 'l') + th('total', 'Total') + th('uph', 'UPH') + th('horasMeta', 'Na meta') + th('horasAtivas', 'Horas') +
    d.horas.map((hr, k) => th('h' + k, hr.slice(0, 2) + 'h')).join('') + '</tr>';

  document.getElementById('countOps').textContent = '(' + lista.length + ')';
  if (!lista.length) {
    document.getElementById('tbody').innerHTML = '<tr><td class="vazio" colspan="' + (6 + d.horas.length) + '">Nenhum operador encontrado</td></tr>';
    document.getElementById('tfoot').innerHTML = '';
    return;
  }

  document.getElementById('tbody').innerHTML = lista.map((o, i) => {
    const cels = o.h.map(v => {
      if (!v) return '<td class="hc zero">·</td>';
      return '<td class="hc c-' + stOp(v) + '" title="' + Math.round(v / META_OP_HORA * 100) + '% da meta de ' + META_OP_HORA + '/h">' + fmt(v) + '</td>';
    }).join('');
    return '<tr><td class="rank">' + (i + 1) + '</td>' +
      '<td class="l nome">' + esc(o.nomeFmt) + '<small>' + esc(o.id) + '</small></td>' +
      '<td class="tot num">' + fmt(o.total) + '</td>' +
      '<td class="num t-' + (o.uph ? stOp(o.uph) : '') + '">' + (o.uph ? fmt(o.uph) : '—') + '</td>' +
      '<td class="num">' + o.horasMeta + '/' + o.horasAtivas + '</td>' +
      '<td class="num">' + o.horasAtivas + '</td>' + cels + '</tr>';
  }).join('');

  const somaH = d.horas.map((_, k) => lista.reduce((a, o) => a + o.h[k], 0));
  const tot = lista.reduce((a, o) => a + o.total, 0);
  const horasOp = lista.reduce((a, o) => a + o.horasAtivas, 0);
  document.getElementById('tfoot').innerHTML = '<tr><td></td><td class="l">Total (' + lista.length + ')</td>' +
    '<td class="tot num">' + fmt(tot) + '</td><td class="num">' + (horasOp ? fmt(tot / horasOp) : '—') + '</td><td class="num">' + fmt(lista.reduce((a, o) => a + o.horasMeta, 0)) + '/' + fmt(horasOp) + '</td><td class="num">' + fmt(horasOp) + '</td>' +
    somaH.map(v => '<td class="hc">' + (v ? fmt(v) : '·') + '</td>').join('') + '</tr>';
}

function trocarAba(aba) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.aba === aba));
  document.querySelectorAll('.aba').forEach(el => { el.hidden = el.id !== 'aba-' + aba; });
  try { localStorage.setItem('prodAba', aba); } catch (e) {}
  if (aba === 'geral' && DATA) { renderKpis(); renderChart(); }   // gráficos medem a largura ao desenhar
}

function ordenarPor(key) {
  if (estado.sort === key) estado.dir = -estado.dir;
  else { estado.sort = key; estado.dir = (key === 'nome' || key === 'turno') ? 1 : -1; }
  renderTabela();
}

// ── Enviar ao Seatalk ─────────────────────────────────────────
// Envia só a IMAGEM do gráfico do turno escolhido; o servidor repassa ao webhook do grupo.
let ST = { imagem: '' };

/** Converte o gráfico da tela (SVG) em PNG, com título e resumo, nas cores do tema atual. */
function gerarImagemSeatalk() {
  return new Promise(resolve => {
    // gráfico desenhado num formato compacto só para a imagem: no Seatalk fica grande e legível
    const vb = { width: 820, height: 480 };
    let xml = renderChart({ W: vb.width, H: vb.height });
    if (!xml) return resolve('');
    const cs = getComputedStyle(document.documentElement);
    xml = xml.replace(/var\((--[\w-]+)\)/g, (_, v) => (cs.getPropertyValue(v) || '#888').trim());
    if (!/xmlns=/.test(xml)) xml = xml.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    xml = xml.replace('<svg', '<svg font-family="Consolas, Menlo, monospace"');
    const esc = 2.5, topo = 78, pad = 18;
    const cv = document.createElement('canvas');
    cv.width = (vb.width + pad * 2) * esc; cv.height = (vb.height + topo + pad) * esc;
    const g = cv.getContext('2d');
    g.scale(esc, esc);
    g.fillStyle = cs.getPropertyValue('--surface').trim() || '#17181d';
    g.fillRect(0, 0, vb.width + pad * 2, vb.height + topo + pad);
    const { prod, meta } = calcTurno(estado.chartTurno);
    const unidade = document.title.split('·').pop().trim();
    g.fillStyle = cs.getPropertyValue('--text').trim();
    g.font = 'bold 21px Segoe UI, Arial, sans-serif';
    g.fillText('Produtividade ' + unidade + ' · Produção por hora × meta · ' + estado.chartTurno, pad, 34);
    g.fillStyle = cs.getPropertyValue('--muted').trim();
    g.font = '14px Segoe UI, Arial, sans-serif';
    g.fillText('Atualizado ' + (DATA.agora || '') + ' · ' + (DATA.diaOp || '') +
      '   ·   Produzido ' + fmt(prod) + '   ·   Meta até agora ' + (meta ? fmt(meta) : '—') +
      (meta ? '   ·   ' + pct1(prod / meta) + ' da meta' : ''), pad, 58);
    const img = new Image();
    img.onload = () => { g.drawImage(img, pad, topo, vb.width, vb.height); resolve(cv.toDataURL('image/png')); };
    img.onerror = () => resolve('');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  });
}

function stMsg(txt, tipo) {
  const el = document.getElementById('stMsg');
  el.textContent = txt || ''; el.className = 'modal-msg' + (tipo ? ' ' + tipo : '');
}

async function abrirSeatalk() {
  if (!DATA) return;
  document.getElementById('stModal').hidden = false;
  document.getElementById('stPrevia').hidden = true;
  const btn = document.getElementById('stEnviar');
  btn.disabled = true; btn.textContent = 'Enviar';
  stMsg('Gerando a imagem…');
  ST.imagem = await gerarImagemSeatalk();
  if (!ST.imagem) return stMsg('Não consegui gerar a imagem do gráfico.', 'erro');
  document.getElementById('stImg').src = ST.imagem;
  document.getElementById('stPrevia').hidden = false;
  btn.disabled = false;
  stMsg('Confira e clique em Enviar. A imagem vai para o grupo do Seatalk.');
}

function fecharSeatalk() { document.getElementById('stModal').hidden = true; }

async function confirmarSeatalk() {
  const btn = document.getElementById('stEnviar');
  btn.disabled = true;
  try {
    stMsg('Enviando…');
    await gs('enviarSeatalk', ST.imagem);
    stMsg('✅ Enviado ao Seatalk!', 'ok');
    btn.textContent = 'Enviado';
    setTimeout(fecharSeatalk, 1800);
  } catch (e) {
    stMsg('Não enviado: ' + (e.message || e), 'erro');
    btn.disabled = false;
  }
}

// ── Controles ─────────────────────────────────────────────────
quandoPronto(() => {
  document.querySelectorAll('#chipsTurno .chip').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('#chipsTurno .chip').forEach(b => b.classList.toggle('active', b === btn));
    estado.turno = btn.dataset.t;
    if (DATA) renderTabela();
  }));
  document.querySelectorAll('#selTurno button').forEach(btn => btn.addEventListener('click', () => {
    estado.chartTurno = btn.dataset.t;      // vale para o anel "% da meta" e para o gráfico
    if (DATA) { renderKpis(); renderChart(); }
  }));
  try { const a = localStorage.getItem('prodAba'); if (a === 'ops') trocarAba('ops'); } catch (e) {}
  // Redesenha os gráficos quando o espaço deles muda de tamanho (carga da página, menu, janela, zoom)
  let tmr, ultimaLarg = 0;
  const redesenhar = () => { clearTimeout(tmr); tmr = setTimeout(() => { if (DATA) { renderKpis(); renderChart(); } }, 120); };
  if (window.ResizeObserver) {
    new ResizeObserver(() => {
      const el = document.getElementById('chart'), tam = el.clientWidth + 'x' + el.clientHeight;
      if (el.clientWidth && tam !== ultimaLarg) { ultimaLarg = tam; redesenhar(); }
    }).observe(document.getElementById('chart'));
  }
  window.addEventListener('resize', redesenhar);
  document.getElementById('busca').addEventListener('input', e => { estado.busca = e.target.value; if (DATA) renderTabela(); });
  document.getElementById('chkAtivos').addEventListener('change', e => { estado.soAtivos = e.target.checked; if (DATA) renderTabela(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharSeatalk(); });
  carregar();
  setInterval(carregar, POLL_MS);
});
</script>
