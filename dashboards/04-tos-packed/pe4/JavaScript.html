<script>
// ── Server (google.script.run -> Code.gs) ──────────────────────────────
function gs(fn, ...args) {
  return new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
}

// ── Helpers ────────────────────────────────────────────────────────────
function fmtDur(s) {
  if (!s || s <= 0) return '—';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h > 0 ? `${h}h${String(m).padStart(2,'0')}m` : `${m}m`;
}
function durClass(s) {
  if (s > 7200) return 'crit';
  if (s > 1800) return 'warn';
  return '';
}
function fmtTime(ts) {
  if (!ts) return '—';
  return new Date(ts * 1000).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function fmtDateTime(ts) {
  if (!ts) return '—';
  return new Date(ts * 1000).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function fmtWeight(g) {
  const kg = g / 1000;
  return kg >= 1000 ? `${(kg / 1000).toFixed(1)}t` : `${kg.toFixed(1)}kg`;
}
function cleanOp(s) {
  return (s || '—').replace(/\[Ops\d+\]/i, '').replace(/@shopee\.com/i, '').trim() || '—';
}
function packClass(name) {
  if (!name) return 'pack-other';
  const n = name.toLowerCase();
  if (n === 'saca')    return 'pack-saca';
  if (n === 'scuttle') return 'pack-scuttle';
  return 'pack-other';
}

// ── TO Detail Modal (dados da própria aba Packed) ──────────────────────
function findTO(to_number) {
  for (const g of groups) {
    const to = g.tos.find(t => t.to_number === to_number);
    if (to) return to;
  }
  return null;
}

function openToDetailModal(to_number) {
  document.getElementById('toDetailModal').style.display = 'flex';
  const to = findTO(to_number);
  if (!to) { renderToDetailError(to_number, 'TO não encontrada na planilha (pode já ter saído da lista).'); return; }
  renderToDetailResult(to_number, to);
}

function closeToDetailModal() {
  document.getElementById('toDetailModal').style.display = 'none';
}

function toDetailHeader(to_number, sub) {
  return `<div class="to-modal-header">
    <div>
      <div class="to-modal-title">${to_number}</div>
      ${sub ? `<div class="to-modal-sub">${sub}</div>` : ''}
    </div>
    <button class="to-modal-close" onclick="closeToDetailModal()">✕</button>
  </div>`;
}

function renderToDetailError(to_number, error) {
  document.getElementById('toDetailModalBox').innerHTML = `
    ${toDetailHeader(to_number)}
    <div class="to-modal-body">
      <div class="to-modal-empty">
        <div class="emoji">❌</div>
        ${error || 'erro desconhecido'}
      </div>
    </div>`;
}

function renderToDetailResult(to_number, data) {
  const now = Math.floor(Date.now() / 1000);
  const procSec = (data.complete_time || 0) - (data.ctime || 0);
  const waitSec = data.complete_time ? now - data.complete_time : 0;
  const ruas = stagingMap ? (stagingMap[data.dest_station_name || data.receiver] || []) : null;
  const linhas = [
    ['Operador',          cleanOp(data.operator)],
    ['Criada',            fmtDateTime(data.ctime)],
    ['Concluída (Packed)', fmtDateTime(data.complete_time)],
    ['T. Processamento',  fmtDur(procSec)],
    ['T. Pack',           `<span class="dur ${durClass(waitSec)}">${fmtDur(waitSec)}</span>`],
    ['Estação atual',     data.current_station_name || '—'],
    ['Destino',           data.dest_station_name || data.receiver || '—'],
    ['Direção',           data.display_direction || '—'],
    ['LH Trip',           data.lh_trip_number || '—'],
    ['Staging Area',      data.staging_area_id && data.staging_area_id !== '-' ? data.staging_area_id : 'sem endereçamento'],
    ['Ruas Disp.',        ruas === null ? '…' : ruas.length ? ruas.join(', ') : '<span style="color:var(--red);font-weight:600">CHEIO</span>'],
  ];
  const rows = linhas.map(([k, v]) => `<tr>
      <td style="font-size:11px;color:var(--muted);width:40%">${k}</td>
      <td style="font-size:12px;font-weight:600">${v}</td>
    </tr>`).join('');

  document.getElementById('toDetailModalBox').innerHTML = `
    ${toDetailHeader(to_number, `${data.sender || '—'} → ${data.receiver || '—'}`)}
    <div class="to-modal-body">
      <div class="to-modal-kpis">
        <div class="to-mkpi"><div class="to-mkpi-label">Pacotes</div><div class="to-mkpi-val" style="color:var(--purple)">${data.quantity ?? 0}</div></div>
        <div class="to-mkpi"><div class="to-mkpi-label">Peso</div><div class="to-mkpi-val" style="color:var(--yellow)">${fmtWeight(data.weight || 0)}</div></div>
        <div class="to-mkpi"><div class="to-mkpi-label">Tipo</div><div class="to-mkpi-val">${data.pack_name || '—'}</div></div>
        <div class="to-mkpi"><div class="to-mkpi-label">Status</div><div class="to-mkpi-val" style="color:var(--green)">${data.status || '—'}</div></div>
      </div>
      <div class="to-modal-table-wrap">
        <table class="to-modal-table"><tbody>${rows}</tbody></table>
      </div>
    </div>`;
}

// ── All-TOs table helpers ───────────────────────────────────────────────
function getSortVal(to, key, now) {
  switch (key) {
    case 'to_number':     return to.to_number || '';
    case 'operator':      return cleanOp(to.operator);
    case 'pack_name':     return to.pack_name || '';
    case 'quantity':      return to.quantity || 0;
    case 'weight':        return to.weight || 0;
    case 'complete_time': return to.complete_time || 0;
    case 'tproc':         return (to.complete_time || 0) - to.ctime;
    case 'tpack':         return to.complete_time ? now - to.complete_time : 0;
    case 'fanout':        return to._fanout || '';
    case 'ruas':          return stagingMap ? (stagingMap[to._fanout] || []).length : 0;
    default:              return 0;
  }
}

async function loadStagingMap() {
  try {
    const data = JSON.parse(await gs('getStageOut'));
    if (data.error) return;
    const list = data.list || [];
    const map = {};
    list.forEach(r => {
      const m = (r.to_destination || '').match(/^\[\d+\](.*)/);
      const name = (m ? m[1] : r.to_destination || '').trim();
      if (!name) return;
      const pct = parseFloat((r.occupancy_percentage || '0').replace('%', '').trim()) || 0;
      if (pct >= 100) return;
      if (!map[name]) map[name] = [];
      if (r.staging_area_name) map[name].push(r.staging_area_name);
    });
    stagingMap = map;
    if (document.getElementById('allTOsBody')) filterAllTOs();
  } catch (e) { console.error('[StagingMap] error:', e); }
}

function sortAllTOs(key) {
  allTOsSortAsc = allTOsSortKey === key ? !allTOsSortAsc : false;
  allTOsSortKey = key;
  filterAllTOs();
}

function filterAllTOs() {
  const q = (document.getElementById('allToSearch')?.value || '').trim().toLowerCase();
  const tbody = document.getElementById('allTOsBody');
  if (!tbody) return;
  const now = Math.floor(Date.now() / 1000);

  let filtered = allTOsData.filter(to =>
    !q || [to.to_number, to._fanout, cleanOp(to.operator), to.pack_name || '']
      .some(v => (v || '').toLowerCase().includes(q))
  );

  filtered.sort((a, b) => {
    const va = getSortVal(a, allTOsSortKey, now);
    const vb = getSortVal(b, allTOsSortKey, now);
    const cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
    return allTOsSortAsc ? cmp : -cmp;
  });

  let count = 0;
  tbody.innerHTML = filtered.map(to => {
    count++;
    const packSec = (to.complete_time || 0) - to.ctime;
    const waitSec = to.complete_time ? now - to.complete_time : 0;
    const ruas = stagingMap ? (stagingMap[to._fanout] || []) : null;
    const ruasCell = ruas === null
      ? `<span style="color:var(--muted);font-size:10px">…</span>`
      : ruas.length === 0
      ? `<span style="color:var(--red);font-size:10px;font-weight:600">CHEIO</span>`
      : `<span style="font-size:10px;font-family:monospace;color:var(--teal);line-height:1.6">${ruas.join(', ')}</span>`;
    return `<tr>
      <td class="row-idx">${count}</td>
      <td><span class="to-num to-num-clickable" onclick="openToDetailModal('${to.to_number}')" title="Ver detalhes desta TO">${to.to_number}</span></td>
      <td class="op-name">${cleanOp(to.operator)}</td>
      <td><span class="pack-pill ${packClass(to.pack_name)}">${to.pack_name || '—'}</span></td>
      <td style="text-align:right;font-family:monospace">${to.quantity || 0}</td>
      <td style="font-family:monospace;font-size:11px">${fmtWeight(to.weight || 0)}</td>
      <td style="font-family:monospace;font-size:11px;color:var(--muted)">${fmtTime(to.complete_time)}</td>
      <td style="font-family:monospace;font-size:11px">${fmtDur(packSec)}</td>
      <td><span class="dur ${durClass(waitSec)}">${fmtDur(waitSec)}</span></td>
      <td style="font-size:11px;color:var(--blue)">${to._fanout || '—'}</td>
      <td>${ruasCell}</td>
    </tr>`;
  }).join('');

  const el = document.getElementById('allTOsCount');
  if (el) el.textContent = `${filtered.length} de ${allTOsData.length} TOs`;

  document.querySelectorAll('.tos-all-table th[data-sk]').forEach(th => {
    const sk = th.dataset.sk;
    if (!sk) return;
    const base = th.dataset.label;
    th.textContent = sk === allTOsSortKey ? base + (allTOsSortAsc ? ' ▲' : ' ▼') : base;
  });
}

function exportAllTOs() {
  const now = Math.floor(Date.now() / 1000);
  const header = ['#','TO Number','Operador','Tipo','Pacotes','Peso (g)','Concluído','T.Proc (s)','T.Pack (s)','Fanout','Ruas Disponíveis'];
  const rows = allTOsData.map((to, i) => [
    i + 1, to.to_number, cleanOp(to.operator), to.pack_name || '',
    to.quantity || 0, to.weight || 0, fmtTime(to.complete_time),
    (to.complete_time || 0) - to.ctime,
    to.complete_time ? now - to.complete_time : 0,
    to._fanout || '',
    stagingMap ? (stagingMap[to._fanout] || []).join(' | ') || 'CHEIO' : '',
  ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
  const blob = new Blob(['﻿' + [header.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tos_packed_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// ── State ──────────────────────────────────────────────────────────────
let groups     = [];
let sortKey    = 'duracao';
let sortAsc    = false;
let lastAt     = null;
let allTOsData    = [];
let allTOsSortKey = 'tpack';
let allTOsSortAsc = false;
let stagingMap    = null; // { destName: ['OUT-92', ...] } — ruas com ocupação < 100%
let reportFarolFilter = null; // 'crit' | 'urgente' | 'atencao' | 'ok' | null — filtra a tela inteira do Report

// ── Group by destination ───────────────────────────────────────────────
function buildGroups(list) {
  const map = {};
  list.forEach(to => {
    const id   = to.dest_station_id;
    const name = to.dest_station_name || to.receiver || '—';
    if (!map[id]) map[id] = { id, name, tos: [] };
    map[id].tos.push(to);
  });
  return Object.values(map).map(g => ({
    ...g,
    totPacotes: g.tos.reduce((s, t) => s + (t.quantity || 0), 0),
    totPeso:    g.tos.reduce((s, t) => s + (t.weight   || 0), 0),
    maxDur:     Math.max(...g.tos.map(t => t.complete_time ? Math.floor(Date.now()/1000) - t.complete_time : 0), 0),
  }));
}

// ── Sort / filter ──────────────────────────────────────────────────────
function sortedGroups(g) {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let filtered = q
    ? g.filter(d => d.name.toLowerCase().includes(q) ||
                    String(d.id).includes(q) ||
                    d.tos.some(t => t.to_number.toLowerCase().includes(q)))
    : g.slice();
  const keyMap = { tos: 'tos', pacotes: 'totPacotes', peso: 'totPeso', duracao: 'maxDur' };
  const key = keyMap[sortKey] || 'maxDur';
  filtered.sort((a, b) => {
    const av = key === 'tos' ? a.tos.length : a[key];
    const bv = key === 'tos' ? b.tos.length : b[key];
    return sortAsc ? av - bv : bv - av;
  });
  return filtered;
}

// ── Render card ────────────────────────────────────────────────────────
function renderCard(g, expanded) {
  const now = Math.floor(Date.now() / 1000);
  const toRows = g.tos
    .sort((a, b) => (now - (b.complete_time||now)) - (now - (a.complete_time||now)))
    .map(to => {
      const packSec = (to.complete_time || 0) - to.ctime;
      const waitSec = to.complete_time ? now - to.complete_time : 0;
      const dc = durClass(waitSec);
      return `<tr>
        <td><span class="to-num to-num-clickable" onclick="event.stopPropagation();openToDetailModal('${to.to_number}')" title="Ver detalhes desta TO">${to.to_number}</span></td>
        <td><span class="op-name">${cleanOp(to.operator)}</span></td>
        <td><span class="pack-pill ${packClass(to.pack_name)}">${to.pack_name || '—'}</span></td>
        <td style="text-align:center;font-family:monospace">${to.quantity || 0}</td>
        <td style="font-family:monospace;font-size:11px">${fmtWeight(to.weight || 0)}</td>
        <td style="font-family:monospace;font-size:11px;color:var(--muted)">${fmtTime(to.complete_time)}</td>
        <td style="font-family:monospace;font-size:11px">${fmtDur(packSec)}</td>
        <td><span class="dur ${dc}">${fmtDur(waitSec)}</span></td>
      </tr>`;
    }).join('');

  return `
    <div class="dest-card${expanded ? ' expanded' : ''}" data-id="${g.id}">
      <div class="dest-header">
        <span class="dest-id">${g.id}</span>
        <span class="dest-name" title="${g.name}">${g.name}</span>
        <div class="dest-badges">
          <span class="badge badge-blue">${g.tos.length} TO${g.tos.length !== 1 ? 's' : ''}</span>
          <span class="badge badge-purple">${g.totPacotes} pac.</span>
          <span class="badge badge-green">${fmtWeight(g.totPeso)}</span>
        </div>
        <span class="chevron">&#x25BC;</span>
      </div>
      <div class="tos-wrap">
        <table class="tos-table">
          <thead>
            <tr>
              <th>TO Number</th><th>Operador</th><th>Tipo</th>
              <th>Pacotes</th><th>Peso</th><th>Conclu&iacute;do</th><th>Tempo de Processamento</th><th>Tempo Pack</th>
            </tr>
          </thead>
          <tbody>${toRows}</tbody>
        </table>
      </div>
    </div>`;
}

// ── Full render ────────────────────────────────────────────────────────
const expandedIds = new Set();

function render() {
  const list      = sortedGroups(groups);
  const container = document.getElementById('destList');
  document.getElementById('countInfo').textContent = `${list.length} destinos`;

  if (!list.length) {
    container.innerHTML = '<div class="empty"><p>Nenhum destino encontrado.</p></div>';
    return;
  }

  container.innerHTML = list.map(g => renderCard(g, expandedIds.has(String(g.id)))).join('');

  container.querySelectorAll('.dest-header').forEach(hdr => {
    hdr.addEventListener('click', () => {
      const card = hdr.closest('.dest-card');
      const id   = card.dataset.id;
      if (expandedIds.has(id)) expandedIds.delete(id);
      else expandedIds.add(id);
      card.classList.toggle('expanded');
    });
  });
}

// ── Update stats ───────────────────────────────────────────────────────
function updateStats(data) {
  const list = data.list || [];
  document.getElementById('sDest').textContent    = groups.length;
  document.getElementById('sTOs').textContent     = list.length;
  document.getElementById('sPacotes').textContent = list.reduce((s, t) => s + (t.quantity || 0), 0);

  const pesoKg = list.reduce((s, t) => s + (t.weight || 0), 0) / 1000;
  document.getElementById('sPeso').textContent =
    pesoKg >= 1000 ? `${(pesoKg / 1000).toFixed(1)}t` : `${pesoKg.toFixed(0)}`;

  const t  = new Date(data.fetchedAt);
  const ts = t.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('lastUpdated').textContent = ts;
  document.getElementById('liveDot').className       = 'live-dot on';
  document.getElementById('metaTag').textContent     = `packed · ${list.length} TOs · ${ts}`;
}

// ── Render Report ──────────────────────────────────────────────────────
function renderReport() {
  const reportWrap = document.getElementById('reportWrap');
  const allTOs = groups.flatMap(g => g.tos);
  const now = Math.floor(Date.now() / 1000);

  if (!allTOs.length) {
    reportWrap.innerHTML = `<div class="empty"><h2>&#x23F3; Sem dados</h2><p>Nenhuma TO encontrada para o relat&oacute;rio.</p></div>`;
    return;
  }

  // Timestamp bar
  const nowDate = new Date();
  const hh = String(nowDate.getHours()).padStart(2, '0');
  const mm = String(nowDate.getMinutes()).padStart(2, '0');
  const dd = String(nowDate.getDate()).padStart(2, '0');
  const mo = String(nowDate.getMonth() + 1).padStart(2, '0');
  const yyyy = nowDate.getFullYear();
  const tsStr = `${hh}:${mm} · ${dd}/${mo}/${yyyy}`;

  // Farol buckets
  const farolLevels = [
    { key: 'crit',    label: 'CRÍTICO',  dotClass: 'crit-dot',    lblClass: 'crit-label',    valClass: 'crit-val',    rowClass: 'farol-crit-row',    cond: s => s > 21600 },
    { key: 'urgente', label: 'URGENTE',  dotClass: 'urgente-dot', lblClass: 'urgente-label', valClass: 'urgente-val', rowClass: 'farol-urgente-row', cond: s => s > 14400 && s <= 21600 },
    { key: 'atencao', label: 'ATENÇÃO',  dotClass: 'atencao-dot', lblClass: 'atencao-label', valClass: 'atencao-val', rowClass: '',                  cond: s => s > 7200  && s <= 14400 },
    { key: 'ok',      label: 'OK',       dotClass: 'ok-dot',      lblClass: 'ok-label',      valClass: 'ok-val',      rowClass: '',                  cond: s => s <= 7200 },
  ];
  function farolKeyOf(to) {
    const waitSec = to.complete_time ? now - to.complete_time : 0;
    const level = farolLevels.find(l => l.cond(waitSec));
    return level ? level.key : null;
  }

  // Contagens do farol sempre sobre o TOTAL (nao filtrado) — e o "menu" de filtro
  const totalTOs0 = allTOs.length;
  const farolCounts = {};
  farolLevels.forEach(l => { farolCounts[l.key] = 0; });
  allTOs.forEach(to => { const k = farolKeyOf(to); if (k) farolCounts[k]++; });
  const hasCrit = farolCounts['crit'] > 0;

  // Clicar numa linha do farol filtra a tela inteira do Report por aquele nivel
  const farolRows = farolLevels.map(l => {
    const cnt = farolCounts[l.key];
    const pct = totalTOs0 > 0 ? (cnt / totalTOs0 * 100).toFixed(1) + '%' : '0.0%';
    const active = reportFarolFilter === l.key;
    return `<tr class="${l.rowClass}${active ? ' farol-row-active' : ''}" onclick="toggleFarolFilter('${l.key}')" title="Clique para filtrar por ${l.label}">
      <td>
        <div class="farol-level ${l.lblClass}">
          <span class="farol-dot ${l.dotClass}"></span>
          ${l.label}
        </div>
      </td>
      <td style="color:var(--muted);font-size:12px">
        ${l.key === 'crit'    ? 'Aguardando h&aacute; mais de 6h' :
          l.key === 'urgente' ? 'Aguardando entre 4h e 6h' :
          l.key === 'atencao' ? 'Aguardando entre 2h e 4h' :
                                'Aguardando menos de 2h'}
      </td>
      <td><span class="farol-count ${l.valClass}">${cnt}</span></td>
      <td><span class="farol-pct">${pct}</span></td>
    </tr>`;
  }).join('');

  // A partir daqui, tudo (KPIs, top10, turnos, curva, tabela) reflete o farol selecionado
  const visibleTOs = reportFarolFilter ? allTOs.filter(to => farolKeyOf(to) === reportFarolFilter) : allTOs;

  // KPI values (sobre o conjunto visivel/filtrado)
  const totalTOs     = visibleTOs.length;
  const totalPacotes = visibleTOs.reduce((s, t) => s + (t.quantity || 0), 0);
  const totalScuttle = visibleTOs.filter(t => (t.pack_name || '').toLowerCase() === 'scuttle').length;
  const totalSacas   = visibleTOs.filter(t => (t.pack_name || '').toLowerCase() === 'saca').length;

  function regroupByDest(list) {
    const map = {};
    list.forEach(to => {
      const id   = to.dest_station_id;
      const name = to.dest_station_name || to.receiver || '—';
      if (!map[id]) map[id] = { id, name, tos: [] };
      map[id].tos.push(to);
    });
    return Object.values(map).map(g => ({
      ...g,
      totPacotes: g.tos.reduce((s, t) => s + (t.quantity || 0), 0),
      totPeso:    g.tos.reduce((s, t) => s + (t.weight   || 0), 0),
    }));
  }

  // Top 10 destinations by max waitSec (sobre o conjunto visivel/filtrado)
  const groupsWithWait = regroupByDest(visibleTOs).map(g => {
    const tosWait = g.tos.map(to => to.complete_time ? now - to.complete_time : 0);
    const maxWait = Math.max(...tosWait, 0);
    const avgWait = tosWait.length ? Math.round(tosWait.reduce((a, b) => a + b, 0) / tosWait.length) : 0;
    return { ...g, maxWait, avgWait };
  });
  groupsWithWait.sort((a, b) => b.maxWait - a.maxWait);
  const top10 = groupsWithWait.slice(0, 10);

  const top10Rows = top10.map((g, i) => {
    const rank = i + 1;
    const rankClass = rank <= 3 ? `rank-${rank}` : '';
    const avgDc = durClass(g.avgWait);
    const maxDc = durClass(g.maxWait);
    const rowCls = g.maxWait > 21600 ? 'row-crit' : g.maxWait > 7200 ? 'row-warn' : '';
    return `<tr class="${rowCls}">
      <td><div class="top10-rank ${rankClass}">${rank}</div></td>
      <td style="font-weight:600;font-size:13px">${g.name}</td>
      <td style="font-family:monospace;font-weight:700">${g.tos.length}</td>
      <td style="font-family:monospace">${g.totPacotes}</td>
      <td><span class="dur ${avgDc}" style="font-size:12px">${fmtDur(g.avgWait)}</span></td>
      <td><span class="dur ${maxDc}" style="font-size:12px">${fmtDur(g.maxWait)}</span></td>
    </tr>`;
  }).join('');

  // Turno classification (complete_time hour)
  const turnos = {
    T1: { tos: 0, pac: 0, label: 'T1', time: '06:00 – 13:59', cls: 't1' },
    T2: { tos: 0, pac: 0, label: 'T2', time: '14:00 – 21:59', cls: 't2' },
    T3: { tos: 0, pac: 0, label: 'T3', time: '22:00 – 05:59', cls: 't3' },
  };
  visibleTOs.forEach(to => {
    if (!to.complete_time) return;
    const h = new Date(to.complete_time * 1000).getHours();
    const key = (h >= 6 && h < 14) ? 'T1' : (h >= 14 && h < 22) ? 'T2' : 'T3';
    turnos[key].tos++;
    turnos[key].pac += (to.quantity || 0);
  });
  const turnoCards = ['T1', 'T2', 'T3'].map(k => {
    const t = turnos[k];
    const pct = totalTOs > 0 ? (t.tos / totalTOs * 100) : 0;
    return `<div class="turno-card ${t.cls}">
      <div class="turno-label ${t.cls}">${t.label}</div>
      <div class="turno-time">${t.time}</div>
      <div class="turno-stat">${t.tos}</div>
      <div class="turno-meta">TOs &nbsp;&middot;&nbsp; ${pct.toFixed(1)}% do total</div>
      <div class="turno-bar-wrap"><div class="turno-bar ${t.cls}" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="turno-pac">${t.pac.toLocaleString('pt-BR')} pacotes</div>
    </div>`;
  }).join('');

  // Hourly curve
  const hourCounts = Array(24).fill(0);
  const hourPacs   = Array(24).fill(0);
  visibleTOs.forEach(to => {
    if (!to.complete_time) return;
    const h = new Date(to.complete_time * 1000).getHours();
    hourCounts[h]++;
    hourPacs[h] += (to.quantity || 0);
  });
  const maxHourCount = Math.max(...hourCounts, 1);
  const peakHour = hourCounts.indexOf(Math.max(...hourCounts));
  const MAX_BAR_H = 120;
  const hourBars = hourCounts.map((cnt, h) => {
    const isPeak = h === peakHour && cnt > 0;
    const barH   = Math.max(3, Math.round(cnt / maxHourCount * MAX_BAR_H));
    const lbl    = String(h).padStart(2, '0');
    return `<div class="hour-col">
      <div class="hour-bar-val">${cnt > 0 ? cnt : ''}</div>
      <div class="hour-bar${isPeak ? ' peak' : ''}" style="height:${barH}px"></div>
      <div class="hour-lbl">${lbl}h</div>
    </div>`;
  }).join('');

  reportWrap.innerHTML = `
    <!-- Timestamp bar -->
    <div class="report-ts-bar">
      <span class="ts-label">Gerado em:</span>
      <span>${tsStr}</span>
      <span class="report-ts-badge">${totalTOs} TOs</span>
    </div>

    <!-- KPI cards -->
    <div class="report-kpis">
      <div class="kpi-card kpi-blue">
        <div class="kpi-label">Total de TOs</div>
        <div class="kpi-value">${totalTOs}</div>
        <div class="kpi-sub">ordens sem staging</div>
      </div>
      <div class="kpi-card kpi-purple">
        <div class="kpi-label">Total de Pacotes</div>
        <div class="kpi-value">${totalPacotes}</div>
        <div class="kpi-sub">volumes totais</div>
      </div>
      <div class="kpi-card kpi-yellow">
        <div class="kpi-label">Total Shuttle / Scuttle</div>
        <div class="kpi-value">${totalScuttle}</div>
        <div class="kpi-sub">tipo scuttle</div>
      </div>
      <div class="kpi-card kpi-green">
        <div class="kpi-label">Total Sacas</div>
        <div class="kpi-value">${totalSacas}</div>
        <div class="kpi-sub">tipo saca</div>
      </div>
    </div>

    <!-- Farol section -->
    <div class="report-section">
      <div class="report-section-title" style="display:flex;align-items:center;justify-content:space-between">
        <span>Farol de TOs Aguardando Endere&ccedil;amento &mdash; clique numa linha para filtrar a tela</span>
        ${reportFarolFilter ? `<button onclick="toggleFarolFilter('${reportFarolFilter}')" style="background:rgba(59,130,246,.12);border:1px solid var(--blue);color:var(--blue);padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap">
          Filtrando: ${farolLevels.find(l => l.key === reportFarolFilter).label} &#x2715;
        </button>` : ''}
      </div>
      <div class="farol-wrap${hasCrit ? ' has-crit' : ''}">
        <table class="farol-table">
          <thead>
            <tr>
              <th>Farol</th>
              <th>Mensagem</th>
              <th>N&ordm; de TOs</th>
              <th>% do Total</th>
            </tr>
          </thead>
          <tbody>${farolRows}</tbody>
        </table>
      </div>
    </div>

    <!-- Top 10 section -->
    <div class="report-section">
      <div class="report-section-title">Top 10 Destinos &mdash; Maior Tempo de Packed</div>
      <div class="top10-wrap">
        <table class="top10-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Destino</th>
              <th>TOs</th>
              <th>Pacotes</th>
              <th>Tempo M&eacute;dio</th>
              <th>TO Mais Antiga</th>
            </tr>
          </thead>
          <tbody>${top10Rows}</tbody>
        </table>
      </div>
    </div>

    <!-- Turno section -->
    <div class="report-section">
      <div class="report-section-title">Responsabilidade por Turno</div>
      <div class="turno-cards">${turnoCards}</div>
    </div>

    <!-- Hourly curve -->
    <div class="report-section">
      <div class="report-section-title">Curva de TO's Packed por Hora</div>
      <div class="hour-chart">${hourBars}</div>
    </div>

    <!-- All TOs table -->
    <div class="report-section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="report-section-title" style="margin-bottom:0">Todas as TOs &mdash; ${totalTOs} registros</div>
        <button onclick="exportAllTOs()" style="background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:8px;font-size:12px;cursor:pointer"
          onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">&#x2B07; CSV</button>
      </div>
      <div style="margin-bottom:10px">
        <input type="text" id="allToSearch" placeholder="Buscar por TO, operador, fanout, tipo&hellip;"
          oninput="filterAllTOs()"
          style="width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:12px;outline:none;box-sizing:border-box">
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;max-height:560px;overflow-y:auto">
        <table class="tos-all-table">
          <thead>
            <tr>
              <th data-sk="" data-label="#">#</th>
              <th data-sk="to_number"     data-label="TO Number"        onclick="sortAllTOs('to_number')">TO Number</th>
              <th data-sk="operator"      data-label="Operador"         onclick="sortAllTOs('operator')">Operador</th>
              <th data-sk="pack_name"     data-label="Tipo"             onclick="sortAllTOs('pack_name')">Tipo</th>
              <th data-sk="quantity"      data-label="Pacotes"          onclick="sortAllTOs('quantity')" style="text-align:right">Pacotes</th>
              <th data-sk="weight"        data-label="Peso"             onclick="sortAllTOs('weight')">Peso</th>
              <th data-sk="complete_time" data-label="Conclu&#237;do"   onclick="sortAllTOs('complete_time')">Conclu&#237;do</th>
              <th data-sk="tproc"         data-label="T. Processamento" onclick="sortAllTOs('tproc')">T. Processamento</th>
              <th data-sk="tpack"         data-label="T. Pack"          onclick="sortAllTOs('tpack')">T. Pack ▼</th>
              <th data-sk="fanout"        data-label="Fanout"           onclick="sortAllTOs('fanout')">Fanout</th>
              <th data-sk="ruas"          data-label="Ruas Disp."       onclick="sortAllTOs('ruas')">Ruas Disp.</th>
            </tr>
          </thead>
          <tbody id="allTOsBody"></tbody>
        </table>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;text-align:right" id="allTOsCount">${totalTOs} TOs</div>
    </div>
  `;

  // Populate the global data store and fill the tbody (respeita o filtro de farol ativo)
  allTOsData = visibleTOs.map(to => ({ ...to, _fanout: to.dest_station_name || to.receiver || '—' }));
  allTOsData.sort((a, b) => {
    const wa = a.complete_time ? now - a.complete_time : 0;
    const wb = b.complete_time ? now - b.complete_time : 0;
    return wb - wa;
  });
  filterAllTOs();
}

// Clicar numa linha do farol filtra a tela inteira do Report; clicar de novo limpa o filtro
function toggleFarolFilter(key) {
  reportFarolFilter = reportFarolFilter === key ? null : key;
  renderReport();
}

// ── Load data ──────────────────────────────────────────────────────────
// TOs "Packed sem staging" há mais de MAX_AGE_HOURS provavelmente já foram
// endereçadas/despachadas na vida real, mas o endpoint general_to/outbound/search
// do SPX não atualizou staging_area_id (inconsistência do lado do SPX, não do sync).
// Para não poluir a lista e os KPIs com esses registros órfãos, elas somem depois desse prazo.
const MAX_AGE_HOURS = 36;

// A tela só é re-renderizada a cada RENDER_THROTTLE_MS — o total pode saltar bastante
// entre atualizações da planilha; sem esse "cache", a tela fica piscando/mudando a cada 15s.
const RENDER_THROTTLE_MS = 5 * 60 * 1000; // 5 minutos
let lastRenderAt = 0;

async function loadData() {
  try {
    const data = JSON.parse(await gs('getTosPacked'));
    if (data.error) {
      document.getElementById('destList').innerHTML = `<div class="empty"><h2>Erro na planilha</h2><p>${data.error}</p></div>`;
      return;
    }
    if (data.fetchedAt === lastAt) return;
    lastAt = data.fetchedAt;
    // Continua buscando a cada 15s (vem do cache), mas só aplica na
    // tela a cada 5 minutos — exceto no primeiro carregamento, que deve aparecer na hora.
    const isFirstLoad = lastRenderAt === 0;
    if (isFirstLoad || Date.now() - lastRenderAt >= RENDER_THROTTLE_MS) {
      applyData(data);
    }
  } catch (e) { console.warn('[packed]', e.message || e); }
}

// Uma TO cujo "sender" (estação de origem do empacotamento) é diferente da
// "current_station_name" (onde ela está fisicamente agora) já saiu de lá — analisado com
// dados reais (657 casos): nenhuma tinha idade < 6h de verdade (o único caso abaixo disso
// era um artefato de encoding corrompido no nome da estação, não uma TO genuinamente fresca).
// Ou seja, não são reempacotadas de fato na estação atual — são sobra de uma etapa anterior
// cujo staging_area_id nunca foi atualizado no lado do SPX. Margem de 2h de segurança contra
// inconsistências passageiras de sincronização ou encoding.
const TRANSBORDO_GRACE_SEC = 2 * 60 * 60;
function jaSaiuDaEstacao(to, nowSec) {
  if (!to.sender || !to.current_station_name || to.sender === to.current_station_name) return false;
  const ageSec = to.complete_time ? nowSec - to.complete_time : Infinity;
  return ageSec > TRANSBORDO_GRACE_SEC;
}

function applyData(data) {
  lastRenderAt = Date.now();
  const nowSec = Math.floor(Date.now() / 1000);
  const maxAgeSec = MAX_AGE_HOURS * 3600;
  // So mostra TOs Packed que ainda NAO tem Staging Area atribuida, nao estao "orfas"
  // (muito antigas) e ainda estao na mesma estacao onde foram empacotadas
  const filtered = (data.list || []).filter(to => {
    const semStaging = !to.staging_area_id || to.staging_area_id === '-' || to.staging_area_id === '';
    const orfa = to.complete_time && (nowSec - to.complete_time) > maxAgeSec;
    return semStaging && !orfa && !jaSaiuDaEstacao(to, nowSec);
  });
  groups = buildGroups(filtered);
  updateStats({ ...data, list: filtered });
  render();
  renderReport();
}

// ── Sort buttons ───────────────────────────────────────────────────────
document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const s = btn.dataset.sort;
    if (sortKey === s) sortAsc = !sortAsc;
    else { sortKey = s; sortAsc = false; }
    document.querySelectorAll('.sort-btn').forEach(b => {
      b.classList.remove('active');
      b.querySelector('.arrow').textContent = '↕';
    });
    btn.classList.add('active');
    btn.querySelector('.arrow').textContent = sortAsc ? '↑' : '↓';
    render();
  });
});

document.getElementById('search').addEventListener('input', render);

// ── Tab switching ──────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(tc => {
      tc.style.display = tc.id === target ? '' : 'none';
    });
    if (target === 'reportTab') { renderReport(); loadStagingMap(); }
  });
});

// ── Theme toggle ───────────────────────────────────────────────────────
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('tos-theme'); } catch (e) {}
  if (saved === 'light') {
    document.documentElement.classList.add('light');
    document.getElementById('themeToggle').textContent = '🌙';
  }
})();

document.getElementById('themeToggle').addEventListener('click', () => {
  const isLight = document.documentElement.classList.toggle('light');
  document.getElementById('themeToggle').textContent = isLight ? '🌙' : '☀️';
  try { localStorage.setItem('tos-theme', isLight ? 'light' : 'dark'); } catch (e) {}
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeToDetailModal(); });

loadData();
loadStagingMap();
setInterval(loadData,       15000);
setInterval(loadStagingMap, 30000);
</script>
