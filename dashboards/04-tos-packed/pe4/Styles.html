<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* rolagem sem barra visível (página, tabelas e modal) */
html, body, * { scrollbar-width: none; -ms-overflow-style: none; }
::-webkit-scrollbar { display: none; width: 0; height: 0; }

:root {
  --bg: #0d0f14;
  --surface: #161920;
  --surface2: #1e2130;
  --border: #2a2d3e;
  --border2: #353849;
  --text: #e2e8f0;
  --muted: #6b7280;
  --orange: #ee4d2d;
  --green: #22c55e;
  --yellow: #f59e0b;
  --red: #ef4444;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --teal: #14b8a6;
  --accent: #22c55e;
  --radius: 10px;
}

html.light {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface2: #f8fafc;
  --border: #e2e8f0;
  --border2: #cbd5e1;
  --text: #1e293b;
  --muted: #64748b;
}

html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  min-height: 100vh;
}

/* ── Header ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 100;
}
.header-icon {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.header-title h1 { font-size: 15px; font-weight: 700; }
.header-title p  { font-size: 11px; color: var(--muted); }
.header-right    { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.live-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.live-dot   { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.live-dot.on { background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.meta-tag {
  font-size: 11px; color: var(--muted);
  background: var(--surface2); padding: 3px 8px; border-radius: 20px;
  border: 1px solid var(--border);
}

/* ── Tab bar ── */
.tab-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex; align-items: center; gap: 0;
  position: sticky; top: 65px; z-index: 99;
}
.tab-btn {
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 13px; font-weight: 600;
  padding: 12px 18px; border-bottom: 2px solid transparent;
  transition: all .15s; display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.theme-toggle {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); padding: 5px 10px; border-radius: 8px;
  font-size: 14px; cursor: pointer; transition: all .15s;
}
.theme-toggle:hover { border-color: var(--border2); color: var(--text); }

/* ── Stats ── */
.stats {
  display: grid; grid-template-columns: repeat(4,1fr);
  gap: 12px; padding: 16px 24px;
}
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; }
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 4px; }
.stat-value { font-size: 28px; font-weight: 700; line-height: 1; }
.stat-sub   { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* ── Toolbar ── */
.toolbar { padding: 0 24px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search-wrap { position: relative; flex: 1; min-width: 200px; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search-wrap input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 7px 12px 7px 34px; border-radius: 8px;
  font-size: 12px; outline: none; transition: border-color .15s;
}
.search-wrap input:focus { border-color: var(--accent); }
.sort-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.sort-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
  display: flex; align-items: center; gap: 5px; transition: all .15s; white-space: nowrap;
}
.sort-btn:hover { border-color: var(--border2); color: var(--text); }
.sort-btn.active { background: rgba(34,197,94,.12); border-color: var(--accent); color: var(--accent); }
.sort-btn .arrow { font-size: 9px; }
.count-info { font-size: 11px; color: var(--muted); margin-left: auto; }

/* ── List ── */
.dest-list { padding: 0 24px 24px; display: flex; flex-direction: column; gap: 6px; }

/* ── Destination card ── */
.dest-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color .15s; }
.dest-card:hover { border-color: var(--border2); }
.dest-card.expanded { border-color: var(--accent); }

.dest-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; user-select: none; }
.dest-id {
  background: var(--accent); color: #000;
  font-size: 10px; font-weight: 700;
  padding: 3px 8px; border-radius: 6px;
  min-width: 44px; text-align: center; flex-shrink: 0;
}
.dest-name { font-weight: 600; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dest-badges { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap;
}
.badge-blue   { background: rgba(59,130,246,.12);  color: #60a5fa; border: 1px solid rgba(59,130,246,.2); }
.badge-purple { background: rgba(139,92,246,.12); color: #a78bfa; border: 1px solid rgba(139,92,246,.2); }
.badge-yellow { background: rgba(245,158,11,.12); color: #fbbf24; border: 1px solid rgba(245,158,11,.2); }
.badge-green  { background: rgba(34,197,94,.12);  color: #4ade80; border: 1px solid rgba(34,197,94,.2); }

.chevron { color: var(--muted); font-size: 14px; transition: transform .2s; flex-shrink: 0; margin-left: 4px; }
.dest-card.expanded .chevron { transform: rotate(180deg); }

/* ── TOs table ── */
.tos-wrap { display: none; border-top: 1px solid var(--border); padding: 0 16px 12px; }
.dest-card.expanded .tos-wrap { display: block; }

.tos-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.tos-table th {
  font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
  color: var(--muted); padding: 6px 10px; text-align: left;
  border-bottom: 1px solid var(--border); font-weight: 500;
}
.tos-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,45,62,.6); vertical-align: middle; }
.tos-table tr:last-child td { border-bottom: none; }
.tos-table tr:hover td { background: rgba(255,255,255,.02); }

.to-num { font-family: monospace; font-weight: 700; font-size: 11px; color: var(--text); letter-spacing: .3px; }
.op-name { font-size: 11px; color: var(--muted); }
.pack-pill {
  display: inline-block; padding: 1px 7px; border-radius: 10px;
  font-size: 10px; font-weight: 600;
}
.pack-saca    { background: rgba(59,130,246,.15); color: #60a5fa; border: 1px solid rgba(59,130,246,.25); }
.pack-scuttle { background: rgba(245,158,11,.15); color: #fbbf24; border: 1px solid rgba(245,158,11,.25); }
.pack-other   { background: rgba(139,92,246,.15); color: #a78bfa; border: 1px solid rgba(139,92,246,.25); }
.dur { font-family: monospace; font-size: 11px; }
.dur.warn { color: var(--yellow); }
.dur.crit { color: var(--red); }

/* ── Empty ── */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
.empty code {
  display: inline-block; background: var(--surface); border: 1px solid var(--border);
  padding: 10px 18px; border-radius: 8px; font-size: 12px; margin-top: 14px;
  text-align: left; line-height: 1.8;
}

/* ── Report Tab ── */
.report-wrap { padding: 20px 24px 40px; }

.report-ts-bar {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 20px; font-size: 12px; color: var(--muted);
}
.report-ts-bar .ts-label { font-weight: 600; color: var(--text); }
.report-ts-badge {
  background: var(--surface2); border: 1px solid var(--border);
  padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
  color: var(--blue);
}

.report-kpis {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 28px;
}
.kpi-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 22px; position: relative; overflow: hidden;
}
.kpi-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.kpi-card.kpi-blue::before   { background: var(--blue); }
.kpi-card.kpi-purple::before { background: var(--purple); }
.kpi-card.kpi-yellow::before { background: var(--yellow); }
.kpi-card.kpi-green::before  { background: var(--green); }
.kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin-bottom: 8px; }
.kpi-value { font-size: 40px; font-weight: 800; line-height: 1; }
.kpi-card.kpi-blue   .kpi-value { color: var(--blue); }
.kpi-card.kpi-purple .kpi-value { color: var(--purple); }
.kpi-card.kpi-yellow .kpi-value { color: var(--yellow); }
.kpi-card.kpi-green  .kpi-value { color: var(--green); }
.kpi-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }

.report-section { margin-bottom: 28px; }
.report-section-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  color: var(--muted); margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* ── Farol ── */
.farol-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  transition: box-shadow .3s, border-color .3s;
}
.farol-wrap.has-crit {
  border-color: rgba(239,68,68,.5);
  box-shadow: 0 0 20px rgba(239,68,68,.15), 0 0 40px rgba(239,68,68,.06);
}
.farol-table { width: 100%; border-collapse: collapse; }
.farol-table th {
  font-size: 10px; text-transform: uppercase; letter-spacing: .6px;
  color: var(--muted); padding: 10px 16px; text-align: left;
  background: var(--surface2); border-bottom: 1px solid var(--border); font-weight: 500;
}
.farol-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.farol-table tr:last-child td { border-bottom: none; }
.farol-dot {
  width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0;
}
.farol-dot.crit-dot   { background: var(--red); animation: pulseDot 1.2s ease-in-out infinite; }
.farol-dot.urgente-dot { background: #f97316; }
.farol-dot.atencao-dot { background: var(--yellow); }
.farol-dot.ok-dot      { background: var(--green); }
@keyframes pulseDot { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.35);opacity:.7} }

.farol-level {
  display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px;
}
.farol-level.crit-label   { color: var(--red); }
.farol-level.urgente-label { color: #f97316; }
.farol-level.atencao-label { color: var(--yellow); }
.farol-level.ok-label      { color: var(--green); }
.farol-count { font-size: 22px; font-weight: 800; font-family: monospace; }
.farol-count.crit-val   { color: var(--red); }
.farol-count.urgente-val { color: #f97316; }
.farol-count.atencao-val { color: var(--yellow); }
.farol-count.ok-val      { color: var(--green); }
.farol-pct { font-size: 12px; color: var(--muted); font-family: monospace; }
.farol-table tr.farol-crit-row { background: rgba(239,68,68,.04); }
.farol-table tr.farol-urgente-row { background: rgba(249,115,22,.03); }
.farol-table tbody tr { cursor: pointer; transition: background .15s; }
.farol-table tbody tr:hover td { background: rgba(255,255,255,.04); }
.farol-table tbody tr.farol-row-active td { background: rgba(59,130,246,.1); box-shadow: inset 3px 0 0 var(--blue); }

/* ── Top 10 table ── */
.top10-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.top10-table { width: 100%; border-collapse: collapse; }
.top10-table th {
  font-size: 10px; text-transform: uppercase; letter-spacing: .6px;
  color: var(--muted); padding: 10px 14px; text-align: left;
  background: var(--surface2); border-bottom: 1px solid var(--border); font-weight: 500;
}
.top10-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 12px; }
.top10-table tr:last-child td { border-bottom: none; }
.top10-table tr:hover td { background: rgba(255,255,255,.015); }
.top10-table tr.row-warn td { background: rgba(245,158,11,.04); }
.top10-table tr.row-crit td { background: rgba(239,68,68,.05); }
.top10-rank {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--muted);
}
.top10-rank.rank-1 { background: rgba(245,158,11,.15); color: #fbbf24; border-color: rgba(245,158,11,.3); }
.top10-rank.rank-2 { background: rgba(148,163,184,.1); color: #94a3b8; border-color: rgba(148,163,184,.25); }
.top10-rank.rank-3 { background: rgba(180,120,60,.12); color: #cd853f; border-color: rgba(180,120,60,.25); }

/* ── Turno cards ── */
.turno-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.turno-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; position: relative; overflow: hidden;
}
.turno-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
}
.turno-card.t1::before { background: #3b82f6; }
.turno-card.t2::before { background: #f59e0b; }
.turno-card.t3::before { background: #8b5cf6; }
.turno-label { font-size: 18px; font-weight: 800; margin-bottom: 2px; }
.turno-label.t1 { color: #3b82f6; }
.turno-label.t2 { color: #f59e0b; }
.turno-label.t3 { color: #8b5cf6; }
.turno-time { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
.turno-stat { font-size: 26px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
.turno-meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.turno-bar-wrap { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
.turno-bar { height: 100%; border-radius: 2px; }
.turno-bar.t1 { background: #3b82f6; }
.turno-bar.t2 { background: #f59e0b; }
.turno-bar.t3 { background: #8b5cf6; }
.turno-pac { font-size: 11px; color: var(--muted); }

/* ── Hourly chart ── */
.hour-chart {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 12px 8px;
  display: flex; align-items: flex-end; gap: 3px; height: 180px;
  overflow: hidden;
}
.hour-col {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end; min-width: 0;
}
.hour-bar-val { font-size: 9px; color: var(--muted); margin-bottom: 3px; text-align: center; }
.hour-bar {
  width: 100%; border-radius: 3px 3px 0 0;
  min-height: 3px; background: rgba(59,130,246,.5);
}
.hour-bar.peak { background: #f59e0b; }
.hour-lbl { font-size: 9px; color: var(--muted); margin-top: 4px; text-align: center; }

/* ── Print ── */
@media print {
  .tab-bar, .toolbar, .header-right { display: none; }
  .tab-content { display: block !important; }
  #dashTab { display: none !important; }
}

@media (max-width: 700px) {
  .stats { grid-template-columns: repeat(2,1fr); }
  .report-kpis { grid-template-columns: repeat(2,1fr); }
  .dest-badges .badge:nth-child(n+3) { display: none; }
  .header-right .meta-tag { display: none; }
}

/* ── All TOs table ── */
.tos-all-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.tos-all-table th {
  font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
  color: var(--muted); padding: 8px 12px; text-align: left;
  background: var(--surface2); border-bottom: 1px solid var(--border);
  font-weight: 500; white-space: nowrap; position: sticky; top: 0; z-index: 1;
}
.tos-all-table td { padding: 6px 12px; border-bottom: 1px solid rgba(42,45,62,.5); vertical-align: middle; }
.tos-all-table tr:last-child td { border-bottom: none; }
.tos-all-table tbody tr:hover td { background: rgba(255,255,255,.025); }
.tos-all-table .row-idx { color: var(--muted); font-size: 11px; min-width: 28px; }
.tos-all-table th[data-sk]:not([data-sk=""]) { cursor: pointer; user-select: none; }
.tos-all-table th[data-sk]:not([data-sk=""]):hover { color: var(--text); }

/* ── TO Number clicável ── */
.to-num-clickable { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
.to-num-clickable:hover { color: var(--accent); }

/* ── TO Detail Modal ── */
.to-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 9000; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(3px); }
.to-modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 760px; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.to-modal-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 18px 20px 14px; border-bottom: 1px solid var(--border); gap: 12px; }
.to-modal-title { font-family: monospace; font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: .3px; }
.to-modal-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
.to-modal-close { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); width: 30px; height: 30px; border-radius: 8px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; }
.to-modal-close:hover { color: var(--text); border-color: var(--border2); }
.to-modal-body { padding: 16px 20px 20px; }
.to-modal-empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.to-modal-empty .emoji { font-size: 30px; margin-bottom: 10px; }
.to-modal-kpis { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 16px; }
.to-mkpi { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.to-mkpi-label { font-size: 9px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin-bottom: 3px; }
.to-mkpi-val { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.to-modal-table-wrap { max-height: 380px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
.to-modal-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.to-modal-table th { position: sticky; top: 0; background: var(--surface2); padding: 8px 10px; text-align: left; text-transform: uppercase; font-size: 9px; letter-spacing: .4px; color: var(--muted); border-bottom: 1px solid var(--border); }
.to-modal-table td { padding: 6px 10px; border-bottom: 1px solid rgba(42,45,62,.5); vertical-align: middle; }
.to-modal-table tr:last-child td { border-bottom: none; }
.to-modal-retry { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 16px; border-radius: 8px; font-size: 12px; cursor: pointer; margin-top: 14px; }
.to-modal-retry:hover { border-color: var(--border2); }
@media (max-width: 700px) { .to-modal-kpis { grid-template-columns: repeat(2,1fr); } }
</style>
