<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* rolagem sem barra visível (página, tabelas e modal) */
html, body, * { scrollbar-width: none; -ms-overflow-style: none; }
::-webkit-scrollbar { display: none; width: 0; height: 0; }
html { background: #0d0f14; }

:root {
  --bg:      #0d0f14;
  --surface: #161920;
  --surface2:#1e2130;
  --border:  #2a2d3e;
  --border2: #353849;
  --text:    #e2e8f0;
  --muted:   #6b7280;
  --orange:  #ee4d2d;
  --orange2: #ff6b4a;
  --green:   #22c55e;
  --yellow:  #f59e0b;
  --red:     #ef4444;
  --blue:    #3b82f6;
  --purple:  #8b5cf6;
  --teal:    #14b8a6;
  --radius:  10px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  min-height: 100vh;
}

/* ── Header ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-icon {
  width: 36px; height: 36px;
  background: var(--orange);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: #fff;
}
.header-title h1 { font-size: 15px; font-weight: 700; }
.header-title p  { font-size: 11px; color: var(--muted); }
.header-right    { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.live-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--muted);
}
.live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
}
.live-dot.on { background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.meta-tag {
  font-size: 11px; color: var(--muted);
  background: var(--surface2); padding: 3px 9px; border-radius: 20px;
  border: 1px solid var(--border);
}
.sheet-badge {
  font-size: 11px;
  background: var(--surface2); padding: 3px 9px; border-radius: 20px;
  border: 1px solid var(--border);
  color: var(--muted);
  display: flex; align-items: center; gap: 5px;
  transition: color .2s, border-color .2s;
}
.sheet-badge-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
  transition: background .2s;
}
.sheet-badge.ok .sheet-badge-dot   { background: var(--teal); }
.sheet-badge.ok                    { color: var(--teal); border-color: rgba(20,184,166,.3); }
.sheet-badge.err .sheet-badge-dot  { background: var(--red); }
.sheet-badge.err                   { color: var(--red); border-color: rgba(239,68,68,.3); }

/* ── Tab bar ── */
.tab-bar {
  display: flex; gap: 4px;
  padding: 12px 24px 0;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky; top: 65px; z-index: 90;
}
.tab-btn {
  background: none; border: none; color: var(--muted);
  padding: 8px 16px; font-size: 13px; font-weight: 600;
  cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -1px; transition: color .15s, border-color .15s;
  white-space: nowrap; text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--orange); border-bottom-color: var(--orange); }

/* ── Stats ── */
.stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  padding: 16px 24px 12px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
}
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 4px; }
.stat-value { font-size: 28px; font-weight: 700; line-height: 1; }
.stat-sub   { font-size: 11px; color: var(--muted); margin-top: 4px; }
.stat-value.loading { opacity: .3; }

/* ── Toolbar ── */
.toolbar {
  padding: 0 24px 12px;
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.search-wrap {
  position: relative; flex: 1; min-width: 200px;
}
.search-wrap svg {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}
.search-wrap input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 12px 7px 34px;
  border-radius: 8px;
  font-size: 12px;
  outline: none;
  transition: border-color .15s;
}
.search-wrap input:focus { border-color: var(--orange); }
.sort-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.sort-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  transition: all .15s;
  white-space: nowrap;
}
.sort-btn:hover { border-color: var(--border2); color: var(--text); }
.sort-btn.active { background: rgba(238,77,45,.12); border-color: var(--orange); color: var(--orange); }
.sort-btn .arrow { font-size: 9px; }
.count-info { font-size: 11px; color: var(--muted); margin-left: auto; }

/* ── List ── */
.dest-list {
  padding: 0 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* ── Destination card ── */
.dest-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color .15s;
}
.dest-card:hover     { border-color: var(--border2); }
.dest-card.expanded  { border-color: var(--orange); }

.dest-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  cursor: pointer;
  user-select: none;
}
.dest-id {
  background: var(--orange);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  min-width: 44px;
  text-align: center;
  flex-shrink: 0;
}
.dest-name {
  font-weight: 600;
  font-size: 13px;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dest-badges {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-blue   { background: rgba(59,130,246,.12);  color: #60a5fa;  border: 1px solid rgba(59,130,246,.22); }
.badge-purple { background: rgba(139,92,246,.12);  color: #a78bfa;  border: 1px solid rgba(139,92,246,.22); }
.badge-green  { background: rgba(34,197,94,.12);   color: #4ade80;  border: 1px solid rgba(34,197,94,.22); }
.badge-orange { background: rgba(238,77,45,.12);   color: #fb923c;  border: 1px solid rgba(238,77,45,.22); }
.badge-red    { background: rgba(239,68,68,.12);   color: #f87171;  border: 1px solid rgba(239,68,68,.22); }
.badge-yellow { background: rgba(245,158,11,.12);  color: #fbbf24;  border: 1px solid rgba(245,158,11,.22); }
.badge-teal   { background: rgba(20,184,166,.12);  color: #2dd4bf;  border: 1px solid rgba(20,184,166,.22); }

.occ-badge { min-width: 68px; justify-content: center; }

.chevron {
  color: var(--muted);
  display: flex; align-items: center;
  transition: transform .2s;
  flex-shrink: 0;
  margin-left: 2px;
}
.dest-card.expanded .chevron { transform: rotate(180deg); }

/* ── Ruas table ── */
.ruas-wrap {
  display: none;
  border-top: 1px solid var(--border);
  padding: 0 14px 12px;
}
.dest-card.expanded .ruas-wrap { display: block; }

.ruas-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
.ruas-table th {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--muted);
  padding: 6px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  font-weight: 500;
}
.ruas-table td {
  padding: 7px 10px;
  border-bottom: 1px solid rgba(42,45,62,.6);
  vertical-align: middle;
}
.ruas-table tr:last-child td { border-bottom: none; }
.ruas-table tr:hover td { background: rgba(255,255,255,.02); }

.rua-name { font-family: monospace; font-weight: 700; font-size: 12px; color: var(--text); }

/* Sacas bar */
.sacas-bar { display: flex; align-items: center; gap: 7px; }
.sacas-bg  { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; min-width: 40px; }
.sacas-fill{ height: 100%; border-radius: 3px; background: var(--teal); }
.sacas-num { font-family: monospace; font-size: 11px; color: var(--teal); min-width: 28px; text-align: right; }
.sacas-na  { font-size: 11px; color: var(--muted); }

/* Occ mini-bar */
.mini-bar { display: flex; align-items: center; gap: 7px; }
.mini-bg  { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; min-width: 50px; }
.mini-fill{ height: 100%; border-radius: 3px; }
.mini-pct { font-family: monospace; font-size: 11px; width: 42px; text-align: right; }

.status-pill {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
}
.s1 { background: rgba(59,130,246,.12); color: #60a5fa; }
.s3 { background: rgba(245,158,11,.12); color: #fbbf24; }
.s2 { background: rgba(239,68,68,.12);  color: #f87171; }

.dur { font-family: monospace; font-size: 11px; }
.dur.warn { color: var(--yellow); }
.dur.crit { color: var(--red); }

/* Sheet data unavailable hint */
.sheet-hint {
  font-size: 10px;
  color: var(--muted);
  padding: 4px 0 2px 10px;
  font-style: italic;
}

/* ── Empty ── */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
.empty code {
  display: inline-block;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 12px;
  margin-top: 14px;
  text-align: left;
  line-height: 1.8;
}

@media (max-width: 900px) {
  .stats { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 700px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .dest-badges .badge:nth-child(n+4) { display: none; }
  .header-right .meta-tag,
  .header-right .sheet-badge { display: none; }
}

/* ── Rua clicável ── */
.ruas-table tbody tr { cursor: pointer; }
.ruas-table tbody tr:hover td { background: rgba(255,255,255,.03); }

/* ── Rua Detail Modal ── */
.to-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 9000; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(3px); }
.to-modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 760px; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.to-modal-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 18px 20px 14px; border-bottom: 1px solid var(--border); gap: 12px; }
.to-modal-title { font-family: monospace; font-size: 16px; font-weight: 700; color: var(--orange2); letter-spacing: .3px; }
.to-modal-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
.to-modal-close { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); width: 30px; height: 30px; border-radius: 8px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; }
.to-modal-close:hover { color: var(--text); border-color: var(--border2); }
.to-modal-body { padding: 16px 20px 20px; }
.to-modal-empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.to-modal-empty .emoji { font-size: 30px; margin-bottom: 10px; }
.to-modal-kpis { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 16px; }
.to-mkpi { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.to-mkpi-label { font-size: 9px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin-bottom: 3px; }
.to-mkpi-val { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.to-modal-table-wrap { max-height: 380px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
.to-modal-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.to-modal-table th { position: sticky; top: 0; background: var(--surface2); padding: 8px 10px; text-align: left; text-transform: uppercase; font-size: 9px; letter-spacing: .4px; color: var(--muted); border-bottom: 1px solid var(--border); }
.to-modal-table td { padding: 6px 10px; border-bottom: 1px solid rgba(42,45,62,.5); vertical-align: middle; }
.to-modal-table tr:last-child td { border-bottom: none; }
.to-modal-retry { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 16px; border-radius: 8px; font-size: 12px; cursor: pointer; margin-top: 14px; }
.to-modal-retry:hover { border-color: var(--border2); }
.item-type-pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; }
.item-type-to   { background: rgba(59,130,246,.14);  color: #60a5fa; }
.item-type-cage { background: rgba(139,92,246,.14); color: #a78bfa; }
@media (max-width: 700px) { .to-modal-kpis { grid-template-columns: repeat(2,1fr); } }

/* ── Report ── */
.rp-wrap { position: relative; padding: 16px 24px 24px; }
.rp-slide-tos { margin-top: 24px; }
.rp-slide-tos .rp-table-wrap { max-height: 70vh; }
.rp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.rp-title { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: var(--muted); }
.rp-csv { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 5px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
.rp-csv:hover { color: var(--text); border-color: var(--border2); }
.rp-search { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-size: 12px; outline: none; margin-bottom: 10px; }
.rp-search:focus { border-color: var(--orange); }
.rp-table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; background: var(--surface); }
.rp-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.rp-table th { position: sticky; top: 0; z-index: 1; background: var(--surface2); text-align: left; padding: 10px 14px; font-size: 9px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; }
.rp-table th:hover { color: var(--text); }
.rp-table th.num, .rp-table td.num { text-align: right; }
.rp-table td { padding: 8px 14px; border-bottom: 1px solid rgba(42,45,62,.6); white-space: nowrap; color: var(--muted); }
.rp-table tr:hover td { background: rgba(255,255,255,.02); }
.rp-table td.num { color: var(--text); font-family: monospace; font-weight: 700; }
.rp-to   { font-family: monospace; font-weight: 700; color: var(--text) !important; text-decoration: underline; text-underline-offset: 2px; }
.rp-mono { font-family: monospace; }
.rp-peso { font-family: monospace; font-weight: 700; color: var(--text) !important; }
.rp-fan  { color: #60a5fa !important; }
.rp-dur      { font-family: monospace; }
.rp-dur.warn { color: var(--yellow); }
.rp-dur.crit { color: var(--red); }
.rp-empty { text-align: center; padding: 40px !important; }
.tipo-pill { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; border: 1px solid; margin-right: 4px; }
.tipo-scuttle { background: rgba(245,158,11,.12); color: #fbbf24; border-color: rgba(245,158,11,.35); }
.tipo-vol     { background: rgba(139,92,246,.14); color: #a78bfa; border-color: rgba(139,92,246,.35); }
.tipo-saca    { background: rgba(59,130,246,.14); color: #60a5fa; border-color: rgba(59,130,246,.35); }
.tipo-outro   { background: rgba(20,184,166,.12); color: #2dd4bf; border-color: rgba(20,184,166,.35); }

/* Resumo */
.rp-gen { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.rp-gen b { color: var(--text); }
.rp-chip { font-size: 11px; font-weight: 600; color: #60a5fa; background: rgba(59,130,246,.14); border: 1px solid rgba(59,130,246,.35); padding: 2px 10px; border-radius: 20px; }
.rp-chip-filter { cursor: pointer; color: var(--orange2); background: rgba(238,77,45,.12); border-color: rgba(238,77,45,.4); }
.rp-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
.rp-kpi { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--c); border-radius: var(--radius); padding: 18px 22px; }
.rp-kpi-label { font-size: 10px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.rp-kpi-val { font-size: 38px; font-weight: 800; line-height: 1; color: var(--c); }
.rp-kpi-sub { font-size: 11px; color: var(--muted); margin-top: 8px; }
.rp-sec { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--border); margin: 0 0 12px; }
.rp-sec + .rp-table-wrap, .rp-sec + .rp-turnos { margin-bottom: 24px; }
.rp-static th { cursor: default; }
.rp-static td { padding: 14px; }
.rp-farol-wrap { border-color: rgba(239,68,68,.6); box-shadow: 0 0 18px rgba(239,68,68,.12); }
.rp-farol-row { cursor: pointer; }
.rp-farol-row.sel td { background: rgba(255,255,255,.05); }
.rp-farol-name { font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.rp-farol-name::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.rp-farol-n { font-size: 19px; font-weight: 800; }
.rp-rank { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface2); border: 1px solid var(--border2); }
.rp-rank.r1 { color: #fbbf24; border-color: rgba(245,158,11,.6); background: rgba(245,158,11,.12); }
.rp-rank.r2 { color: #cbd5e1; border-color: rgba(203,213,225,.45); }
.rp-rank.r3 { color: #fb923c; border-color: rgba(238,77,45,.5); background: rgba(238,77,45,.1); }
.rp-dest { font-weight: 700; color: var(--text) !important; }
.rp-turnos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.rp-turno { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--c); border-radius: var(--radius); padding: 16px 20px; }
.rp-turno-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.rp-turno-name { font-size: 22px; font-weight: 800; color: var(--c); }
.rp-turno-hora { font-size: 11px; color: var(--muted); }
.rp-turno-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.rp-turno-ops { font-size: 11px; color: var(--muted); }
.rp-turno-ops li { list-style: none; display: flex; justify-content: space-between; padding: 4px 0; border-top: 1px solid rgba(42,45,62,.6); }
.rp-turno-ops b { color: var(--text); font-family: monospace; }
.rp-turno-grid div { background: var(--surface2); border-radius: 8px; padding: 8px 10px; }
.rp-turno-grid span { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
.rp-turno-grid b { font-size: 16px; }
@media (max-width: 900px) { .rp-kpis { grid-template-columns: repeat(2, 1fr); } .rp-turnos { grid-template-columns: 1fr; } }

/* ── Report Stage Out (sr-*) ── */
.sr-wrap { padding: 16px 24px 32px; }
.sr-sec { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--border); margin: 0 0 12px; }
.sr-sec .sr-sec-info { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--text); }
.sr-sec .sr-sec-alert { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--red); }
