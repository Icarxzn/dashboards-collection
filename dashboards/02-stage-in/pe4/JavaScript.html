<script>
// ── Server (google.script.run -> Code.gs) ──────────────────────────────
function gs(fn, ...args) {
  return new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
}

// ── Theme ──────────────────────────────────────────────────────────────
(function () {
  let saved = 'dark';
  try { saved = localStorage.getItem('siTheme') || 'dark'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').textContent = saved === 'light' ? '🌙' : '☀️';
})();

function toggleTheme() {
  const html    = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  const next    = isLight ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  document.getElementById('themeBtn').textContent = next === 'light' ? '🌙' : '☀️';
  try { localStorage.setItem('siTheme', next); } catch (e) {}
}

// ── Helpers ────────────────────────────────────────────────────────────
function fmtDur(s) {
  if (!s || s <= 0) return '—';
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (d > 0) return `${d}d ${h}h`;
  return h > 0 ? `${h}h${String(m).padStart(2,'0')}m` : `${m}m`;
}
function agingClass(s) {
  if (!s || s <= 0) return 'aging-ok';
  const h = s / 3600;
  if (h < 4)  return 'aging-ok';
  if (h < 7)  return 'aging-warn';
  if (h < 13) return 'aging-hot';
  return 'aging-crit';
}
function parseOcc(s)  { return parseFloat(String(s || '0').replace(/\s*%/, '')) || 0; }
function occClass(p)  { return p < 60 ? 'occ-low' : p < 85 ? 'occ-mid' : 'occ-high'; }
function zoneKey(name) {
  if (!name) return 'other';
  const n = name.toLowerCase();
  if (n.includes('linear'))   return 'linear';
  if (n.includes('volumoso')) return 'volumoso';
  if (n.includes('cop'))      return 'cop';
  return 'other';
}
function zoneCardClass(name) { return 'zc-' + zoneKey(name); }
function zonePillClass(name) { return 'zone-' + zoneKey(name); }
function zoneShort(name)     { return (name || '').replace('ZONA ', '').trim() || '—'; }
// Normaliza nome de zona para comparação entre planilhas que usam grafias
// diferentes (ex: "ZONA LMH" no staging vs "LMH" na planilha de perfil).
function normZoneName(name)  { return (name || '').replace(/^ZONA\s+/i, '').trim().toUpperCase(); }
function cleanOp(s) {
  return (s || '—').replace(/\[ops\d+\]/i,'').replace(/@shopee\.com\.br/i,'').replace(/@shopee\.com/i,'').trim() || '—';
}

// ── Area label (sub-classification within zone) ────────────────────────
function getAreaLabel(a) {
  const name = (a.area_name || '').trim();
  const zone = (a.staging_group_name || '').toLowerCase();
  // COP → mostra a própria zona como área
  if (zone.includes('cop')) return { label: 'COP', color: '#f59e0b', bg: 'rgba(245,158,11,.15)' };

  // LMH → mostra a própria zona como área
  if (zone.includes('lmh')) return { label: 'LMH', color: '#8b5cf6', bg: 'rgba(139,92,246,.15)' };

  if (!zone.includes('volumoso')) return null;
  // Ruas com V no final: IN-01V … IN-35V
  const m = name.match(/^IN-(\d+)V$/i);
  if (m) {
    const n = parseInt(m[1]);
    if (n >= 1  && n <= 16) return { label: 'Buffer Termoplástica', color: '#22c55e',  bg: 'rgba(34,197,94,.15)'  };
    if (n >= 17 && n <= 35) return { label: 'HS VOLUMOSO',     color: '#3b82f6',  bg: 'rgba(59,130,246,.15)' };
  }
  // LN- → Buffer Linear
  if (/^LN-/i.test(name)) return { label: 'Buffer Linear', color: '#14b8a6', bg: 'rgba(20,184,166,.15)' };
  // VOLUMOSO sem V → Buffer LMH
  return { label: 'Buffer LMH', color: '#8b5cf6', bg: 'rgba(139,92,246,.15)' };
}

// Gaiolas (código CG...) aparecem na mesma lista de TOs da Consulta e têm pacotes, mas o to_quantity
// da aba Stage IN NÃO as conta. Para o SPP bater (pacotes ÷ unidades), o divisor é TOs + gaiolas da rua.
const ehGaiola = t => /^CG/i.test(t?.to || '');
function gaiolasDaRua(areaName) {
  return (reportData?.byAreaTOs?.[areaName] || []).filter(ehGaiola).length;
}
function tosSpp(a) { return (a.to_quantity || 0) + gaiolasDaRua(a.area_name); }

function getReportZone(stagingName) {
  if (!reportData) return null;
  return reportData.byZone[(stagingName || '').trim()] || null;
}

// ── Zone cell colors ───────────────────────────────────────────────────
const ZONE_RGBA = {
  linear:   [59,  130, 246],
  volumoso: [34,  197, 94],
  cop:      [245, 158, 11],
  other:    [139, 92,  246],
};

// ── State ──────────────────────────────────────────────────────────────
let allAreas       = [];
let reportData     = null;
let profileData    = null;   // sem aba de perfil de pacote nesta planilha
let activeZone     = 'all';
let sortCol        = 'staging_duration_time'; // default: aging mais antigo
let sortAsc        = false;                    // false = decrescente (maior aging primeiro)
let lastAt         = null;
let lastReportAt   = null;
let tableSearch    = '';
let tableZoneFilter = '';
let expandedAreas  = new Set();
let currentPage    = 1;
let pageSize       = 10;

// ── Histogram bins ─────────────────────────────────────────────────────
const BINS = [
  { label: '0–4h',   min: 0,       max: 14400   },
  { label: '4–7h',   min: 14400,   max: 25200   },
  { label: '7–10h',  min: 25200,   max: 36000   },
  { label: '10–13h', min: 36000,   max: 46800   },
  { label: '13–16h', min: 46800,   max: 57600   },
  { label: '16–21h', min: 57600,   max: 75600   },
  { label: '21–25h', min: 75600,   max: 90000   },
  { label: '1–2d',   min: 90000,   max: 172800  },
  { label: '2–3d',   min: 172800,  max: 259200  },
  { label: '3–4d',   min: 259200,  max: 345600  },
  { label: '>4d',    min: 345600,  max: Infinity },
];

const VOL_BINS = [
  { label: '0–4h',   min: 0,       max: 14400   },
  { label: '4–7h',   min: 14400,   max: 25200   },
  { label: '7–10h',  min: 25200,   max: 36000   },
  { label: '10–13h', min: 36000,   max: 46800   },
  { label: '13–16h', min: 46800,   max: 57600   },
  { label: '16–21h', min: 57600,   max: 75600   },
  { label: '21–24h', min: 75600,   max: 86400   },
  { label: '1–2d',   min: 86400,   max: 172800  },
  { label: '2–3d',   min: 172800,  max: 259200  },
  { label: '3–4d',   min: 259200,  max: 345600  },
  { label: '>4d',    min: 345600,  max: Infinity },
];

// ── Zone tabs ──────────────────────────────────────────────────────────
function buildZoneTabs() {
  const zoneMap = {};
  allAreas.forEach(a => {
    const z = (a.staging_group_name || 'OUTRAS').trim();
    zoneMap[z] = (zoneMap[z] || 0) + (a.to_quantity || 0);
  });

  const tabs = [];
  let totalCount = 0;
  Object.entries(zoneMap).sort((a, b) => b[1] - a[1]).forEach(([z, tos]) => {
    const rd    = getReportZone(z);
    const count = rd ? rd.pacotes : tos;
    totalCount += count;
    tabs.push({ key: z, label: zoneShort(z), count });
  });
  tabs.unshift({ key: 'all', label: 'Todas', count: totalCount });
  tabs.push({ key: '__op__', label: '📺 Operacional', count: null });

  const container = document.getElementById('zoneTabs');
  container.innerHTML = tabs.map(t => {
    const isAction = t.key === '__op__';
    return `<button class="zone-tab${t.key === activeZone ? ' active' : ''}${isAction ? ' tab-op-btn' : ''}" data-zone="${t.key}">
      ${t.label}${!isAction ? `<span class="tab-count">${t.count.toLocaleString('pt-BR')}</span>` : ''}
    </button>`;
  }).join('');
  container.querySelectorAll('.zone-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const prevZone = activeZone;
      activeZone = btn.dataset.zone;
      currentPage = 1;
      if (!btn.dataset.zone.toLowerCase().includes('volumoso')) expandedAreas.clear();
      // Limpa filtro sppband ao sair da aba TODAS, e filtros volumoso ao sair de volumoso
      if (prevZone !== activeZone) {
        if (activeVolFilter.type === 'sppband' && activeZone !== 'all') {
          activeVolFilter = { type: null, value: null };
          document.getElementById('pctFilterBanner').style.display = 'none';
        }
        if (['pct','distrib','turno','aging'].includes(activeVolFilter.type) && !activeZone.toLowerCase().includes('volumoso')) {
          activeVolFilter = { type: null, value: null };
          document.getElementById('pctFilterBanner').style.display = 'none';
          ['statLt20','statEq20','statGt20'].forEach(id =>
            document.getElementById(id)?.classList.remove('pct-active'));
        }
      }
      render();
    });
  });
}

// ── KPIs ────────────────────────────────────────────────────────────────
function updateStats(areas) {
  const active   = areas.filter(a => a.to_quantity > 0);
  const totalTOs = active.reduce((s, a) => s + a.to_quantity, 0);
  const maxArea  = active.reduce((b, a) => (!b || a.staging_duration_time > b.staging_duration_time) ? a : b, null);
  const avgAging = active.length ? active.reduce((s, a) => s + a.staging_duration_time, 0) / active.length : 0;

  document.getElementById('sTOs').textContent         = totalTOs;
  document.getElementById('sRuas').textContent        = active.length;
  document.getElementById('sMaxAging').textContent    = maxArea ? fmtDur(maxArea.staging_duration_time) : '—';
  document.getElementById('sMaxAgingRua').textContent = maxArea ? maxArea.area_name : '—';
  document.getElementById('sAvgAging').textContent    = avgAging ? fmtDur(Math.round(avgAging)) : '—';

  if (reportData) {
    const zoneFilter = activeZone !== 'all' ? activeZone : null;
    const totalPac = zoneFilter
      ? (getReportZone(zoneFilter)?.pacotes || 0)
      : Object.values(reportData.byZone).reduce((s, v) => s + v.pacotes, 0);
    document.getElementById('sTotalPacotes').textContent = totalPac.toLocaleString('pt-BR');

    const totalGaiolas = active.reduce((s, a) => s + gaiolasDaRua(a.area_name), 0);
    const totalUnid    = totalTOs + totalGaiolas;
    const avgTO = totalUnid > 0 ? Math.round(totalPac / totalUnid) : null;
    document.getElementById('sAvgTO').textContent    = avgTO !== null ? avgTO.toLocaleString('pt-BR') : '—';
    document.getElementById('sAvgTOSub').textContent = avgTO !== null ? `${totalPac.toLocaleString('pt-BR')} pkgs ÷ ${totalTOs} TOs${totalGaiolas ? ` + ${totalGaiolas} gaiolas` : ''}` : 'pacotes / TO';
  }
}

// ── Visão por Zona ─────────────────────────────────────────────────────
function buildZonaSection(areas) {
  const active = areas.filter(a => a.to_quantity > 0);
  if (!active.length) { document.getElementById('zonaSection').style.display = 'none'; return; }
  document.getElementById('zonaSection').style.display = '';

  // Aggregate per zone (from staging API)
  const zones = {};
  active.forEach(a => {
    const z = (a.staging_group_name || 'OUTRAS').trim();
    if (!zones[z]) zones[z] = { name: z, tos: 0, gaiolas: 0, agings: [], cap: 0 };
    zones[z].tos  += a.to_quantity;
    zones[z].gaiolas += gaiolasDaRua(a.area_name);
    zones[z].cap  += a.capacity || 0;
    if (a.staging_duration_time > 0) zones[z].agings.push(a.staging_duration_time);
  });

  // Zone cards — quando aba específica ativa, exibe apenas aquela zona
  const zoneFilter  = activeZone !== 'all' ? activeZone : null;
  const zoneValues  = Object.values(zones).sort((a, b) => {
    const rdA = getReportZone(a.name);
    const rdB = getReportZone(b.name);
    return (rdB ? rdB.pacotes : b.tos) - (rdA ? rdA.pacotes : a.tos);
  }).filter(z => !zoneFilter || z.name === zoneFilter);

  // SPP por rua → max/min por zona
  const zoneSPPRange = {};
  if (reportData?.byArea) {
    const sMap = {};
    active.forEach(a => { sMap[a.area_name] = a.to_quantity; });
    Object.entries(reportData.byArea).forEach(([rua, ad]) => {
      if (!ad.zona) return;
      const tos = sMap[rua] || 0;
      if (tos === 0) return;
      const s = ad.pacotes / (tos + gaiolasDaRua(rua));
      if (!zoneSPPRange[ad.zona]) zoneSPPRange[ad.zona] = [];
      zoneSPPRange[ad.zona].push(s);
    });
  }

  const cardHtml = zoneValues.map(z => {
    const avg  = z.agings.length ? z.agings.reduce((s, v) => s + v, 0) / z.agings.length : 0;
    const pico = z.agings.length ? Math.max(...z.agings) : 0;
    const rd   = getReportZone(z.name);
    const mainVal   = rd ? rd.pacotes.toLocaleString('pt-BR') : z.tos.toLocaleString('pt-BR');
    const mainLabel = rd ? 'pacotes' : 'TOs';
    const tosLine   = rd ? `<span>${z.tos} TOs${z.gaiolas ? ` + ${z.gaiolas} CG` : ''}</span>` : '';
    const spp       = (rd && z.tos > 0) ? Math.round(rd.pacotes / (z.tos + z.gaiolas)) : null;
    const sppLine   = spp !== null ? `<span>SPP: <strong>${spp}</strong></span>` : '';
    const sppVals   = zoneSPPRange[z.name] || [];
    const sppMax    = sppVals.length ? Math.round(Math.max(...sppVals)) : null;
    const sppMin    = sppVals.length ? Math.round(Math.min(...sppVals)) : null;
    const sppMaxLine = sppMax !== null ? `<span>max <strong>${sppMax}</strong></span>` : '';
    const sppMinLine = sppMin !== null ? `<span>min <strong>${sppMin}</strong></span>` : '';
    return `
      <div class="zone-card ${zoneCardClass(z.name)}">
        <div class="zone-card-label">${zoneShort(z.name)}</div>
        <div class="zone-card-value">${mainVal}</div>
        <div class="zone-card-meta">
          <span>${mainLabel}</span>${tosLine}${sppLine}${sppMaxLine}${sppMinLine}
          ${avg  ? `<span>avg <strong>${fmtDur(Math.round(avg))}</strong></span>` : ''}
          ${pico ? `<span>pico <strong>${fmtDur(pico)}</strong></span>` : ''}
        </div>
      </div>`;
  }).join('');
  document.getElementById('zoneCards').innerHTML = cardHtml;

  // Cross-tab: itera diretamente do reportData.byArea para não perder nenhum pacote.
  // Usa staging_duration_time da aba Stage IN para o bin; fallback = max aging_h dos TOs da rua.
  // Zonas vêm do campo `zona` do byArea (Consulta), não da aba Stage IN.
  const stagingMap = {};
  allAreas.forEach(a => { stagingMap[a.area_name] = a; });

  // Coleta zonas do report (byArea.zona) para as colunas do cross-tab
  const reportZoneSet = new Set();
  if (reportData?.byArea) {
    Object.values(reportData.byArea).forEach(ad => { if (ad.zona) reportZoneSet.add(ad.zona); });
  }
  // Mantém zonas da aba Stage IN sem dados de report (para exibir TOs)
  Object.keys(zones).forEach(z => { if (!getReportZone(z)) reportZoneSet.add(z); });

  // Filtra colunas do cross-tab pela zona ativa (se não for "Todas")
  let zoneNames = [...reportZoneSet].sort();
  if (zoneFilter) zoneNames = zoneNames.filter(z => z === zoneFilter || z.toLowerCase().includes(zoneFilter.toLowerCase().replace('zona ', '')));
  const counts = BINS.map(() => {
    const row = {};
    zoneNames.forEach(z => { row[z] = 0; });
    return row;
  });

  if (reportData?.byArea) {
    Object.entries(reportData.byArea).forEach(([rua, ad]) => {
      const z = ad.zona;
      if (!z) return;
      // Aging: usa staging_duration_time se disponível, senão max aging_h dos TOs da planilha
      const staging = stagingMap[rua];
      let duration  = staging?.staging_duration_time || 0;
      if (!duration) {
        const tos = reportData.byAreaTOs?.[rua] || [];
        duration  = tos.length ? Math.max(...tos.map(t => t.aging_h * 3600)) : 0;
      }
      const idx = BINS.findIndex(b => duration >= b.min && duration < b.max);
      if (idx < 0) return;
      counts[idx][z] = (counts[idx][z] || 0) + ad.pacotes;
    });
  }
  // Ruas sem dados na Consulta: usa TOs como fallback
  active.forEach(a => {
    const z  = (a.staging_group_name || 'OUTRAS').trim();
    if (reportData?.byArea?.[a.area_name] || getReportZone(z)) return; // já contabilizado
    const s   = a.staging_duration_time || 0;
    const idx = BINS.findIndex(b => s >= b.min && s < b.max);
    if (idx < 0) return;
    counts[idx][z] = (counts[idx][z] || 0) + a.to_quantity;
  });

  // SPP por faixa de aging: Sacas Por Prateleira = pacotes / TOs
  // Denominador correto = soma de to_quantity das áreas no bin
  const hasTOData = !!(reportData?.byAreaTOs && Object.keys(reportData.byAreaTOs).length > 0);
  const tosBins   = BINS.map(() => 0); // soma de to_quantity por bin
  if (reportData?.byArea) {
    Object.entries(reportData.byArea).forEach(([rua, areaData]) => {
      const staging = stagingMap[rua];
      let duration  = staging?.staging_duration_time || 0;
      if (!duration && hasTOData) {
        const tos = reportData.byAreaTOs?.[rua] || [];
        duration  = tos.length ? Math.max(...tos.map(t => t.aging_h * 3600)) : 0;
      }
      const idx = BINS.findIndex(b => duration >= b.min && duration < b.max);
      if (idx < 0) return;
      tosBins[idx] += (staging?.to_quantity || areaData?.to_quantity || 0) + gaiolasDaRua(rua); // TOs + gaiolas da área
    });
  }

  const colMax = {};
  zoneNames.forEach(z => { colMax[z] = Math.max(...counts.map(r => r[z] || 0), 1); });

  const colTotals = {};
  zoneNames.forEach(z => {
    colTotals[z] = counts.reduce((s, r) => s + (r[z] || 0), 0);
  });

  const zoneHeaders = zoneNames.map(z => {
    const rgb = ZONE_RGBA[zoneKey(z)] || [139,92,246];
    const rdZ = getReportZone(z);
    const sub = rdZ
      ? `${rdZ.pacotes.toLocaleString('pt-BR')} pcts`
      : `${(colTotals[z]||0).toLocaleString('pt-BR')} TOs`;
    return `<th class="col-zone" style="color:rgb(${rgb.join(',')})">
      ${zoneShort(z)}<span class="sub">(${sub})</span>
    </th>`;
  }).join('');

  const rows = BINS.map((b, i) => {
    const rowTotal = zoneNames.reduce((s, z) => s + (counts[i][z] || 0), 0);
    if (rowTotal === 0) return '';
    const cells = zoneNames.map(z => {
      const v   = counts[i][z] || 0;
      const rgb = ZONE_RGBA[zoneKey(z)] || [139,92,246];
      const bg  = v > 0 ? `background:rgba(${rgb.join(',')},${(v / colMax[z] * 0.55 + 0.06).toFixed(2)})` : '';
      return `<td class="zone-cell">
        <span class="cell-inner ${v === 0 ? 'cell-zero' : ''}" style="${bg}">
          ${v > 0 ? v.toLocaleString('pt-BR') : '—'}
        </span>
      </td>`;
    }).join('');
    const sppCell = hasTOData
      ? `<td class="total-cell">${tosBins[i] > 0 ? Math.round(rowTotal / tosBins[i]) : '—'}</td>`
      : '';
    return `<tr><td class="faixa">${b.label}</td>${cells}<td class="total-cell">${rowTotal.toLocaleString('pt-BR')}</td>${sppCell}</tr>`;
  }).join('');

  const grandTotal  = zoneNames.reduce((s, z) => s + (colTotals[z] || 0), 0);
  const totalCells  = zoneNames.map(z => {
    const rgb = ZONE_RGBA[zoneKey(z)] || [139,92,246];
    return `<td class="zone-cell" style="color:rgb(${rgb.join(',')});font-weight:800;text-align:center">
      ${(colTotals[z]||0).toLocaleString('pt-BR')}
    </td>`;
  }).join('');

  document.getElementById('crosstabTable').innerHTML = `
    <thead><tr><th>Faixa Aging</th>${zoneHeaders}<th class="col-total">Total</th>${hasTOData ? '<th class="col-total">SPP</th>' : ''}</tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr class="row-total"><td class="faixa">Total</td>${totalCells}<td class="total-cell">${grandTotal.toLocaleString('pt-BR')}</td>${hasTOData ? (() => { const gt = tosBins.reduce((s,v) => s+v, 0); return `<td class="total-cell">${gt > 0 ? Math.round(grandTotal / gt) : '—'}</td>`; })() : ''}</tr></tfoot>`;
}

// ── Visão por Perfil de Pacote ──────────────────────────────────────────
const PERFIL_ORDER = [
  { key: 'sem_perfil',  label: 'Sem Perfil',  color: '#6b7280' },
  { key: 'pp',          label: 'PP',          color: '#3b82f6' },
  { key: 'p',           label: 'P',           color: '#22c55e' },
  { key: 'm',           label: 'M',           color: '#f59e0b' },
  { key: 'g',           label: 'G',           color: '#ee4d2d' },
  { key: 'bulky',       label: 'Bulky',       color: '#8b5cf6' },
  { key: 'ultra_bulky', label: 'Ultra Bulky', color: '#ef4444' },
];

function buildPerfilSection() {
  const section = document.getElementById('perfilSection');
  const recsAll = profileData?.byTO ? Object.values(profileData.byTO) : [];
  if (!recsAll.length) { section.style.display = 'none'; return; }
  section.style.display = '';

  // Respeita a aba de zona ativa (mesmo filtro usado na Visão por Zona)
  const zoneFilter = activeZone !== 'all' ? activeZone : null;
  const recs = zoneFilter ? recsAll.filter(r => normZoneName(r.group_name) === normZoneName(zoneFilter)) : recsAll;

  // Zona sem classificação de perfil na planilha de origem (ex: LMH) — mostra aviso em vez de cards zerados
  const noData = zoneFilter && !recs.length;
  document.getElementById('perfilNoData').style.display = noData ? '' : 'none';
  document.getElementById('perfilCards').style.display   = noData ? 'none' : '';
  document.getElementById('perfilCrosstabTable').closest('.crosstab-wrap').style.display = noData ? 'none' : '';
  if (noData) return;

  // KPI cards — perfil geral (ou da zona filtrada)
  const totals = {};
  PERFIL_ORDER.forEach(d => { totals[d.key] = 0; });
  recs.forEach(r => PERFIL_ORDER.forEach(d => { totals[d.key] += (r[d.key] || 0); }));
  const grandTotal = PERFIL_ORDER.reduce((s, d) => s + totals[d.key], 0);

  document.getElementById('perfilCards').innerHTML = PERFIL_ORDER.map(d => {
    const v   = totals[d.key];
    const pct = grandTotal ? (v / grandTotal * 100).toFixed(1) : '0.0';
    return `
      <div class="zone-card" style="border-top-color:${d.color}">
        <div class="zone-card-label" style="color:${d.color}">${d.label}</div>
        <div class="zone-card-value" style="color:${d.color}">${v.toLocaleString('pt-BR')}</div>
        <div class="zone-card-meta"><span>${pct}% do total</span></div>
      </div>`;
  }).join('');

  // Crosstab: linhas = perfil, colunas = zonas
  const zoneNames = [...new Set(recs.map(r => r.group_name).filter(Boolean))].sort();
  const counts = PERFIL_ORDER.map(() => {
    const row = {};
    zoneNames.forEach(z => { row[z] = 0; });
    return row;
  });
  const colTotals = {};
  zoneNames.forEach(z => { colTotals[z] = 0; });
  recs.forEach(r => {
    const z = r.group_name;
    if (!z) return;
    PERFIL_ORDER.forEach((d, i) => {
      const v = r[d.key] || 0;
      counts[i][z]  += v;
      colTotals[z]  += v;
    });
  });
  const colMax = {};
  zoneNames.forEach(z => { colMax[z] = Math.max(...counts.map(row => row[z] || 0), 1); });

  const zoneHeaders = zoneNames.map(z => {
    const rgb = ZONE_RGBA[zoneKey(z)] || [139,92,246];
    return `<th class="col-zone" style="color:rgb(${rgb.join(',')})">
      ${zoneShort(z)}<span class="sub">(${(colTotals[z]||0).toLocaleString('pt-BR')} pcts)</span>
    </th>`;
  }).join('');

  const rows = PERFIL_ORDER.map((d, i) => {
    const rowTotal = zoneNames.reduce((s, z) => s + (counts[i][z] || 0), 0);
    const cells = zoneNames.map(z => {
      const v   = counts[i][z] || 0;
      const rgb = ZONE_RGBA[zoneKey(z)] || [139,92,246];
      const bg  = v > 0 ? `background:rgba(${rgb.join(',')},${(v / colMax[z] * 0.55 + 0.06).toFixed(2)})` : '';
      return `<td class="zone-cell">
        <span class="cell-inner ${v === 0 ? 'cell-zero' : ''}" style="${bg}">
          ${v > 0 ? v.toLocaleString('pt-BR') : '—'}
        </span>
      </td>`;
    }).join('');
    return `<tr><td class="faixa" style="color:${d.color};font-weight:600">${d.label}</td>${cells}<td class="total-cell">${rowTotal.toLocaleString('pt-BR')}</td></tr>`;
  }).join('');

  const totalCells = zoneNames.map(z => {
    const rgb = ZONE_RGBA[zoneKey(z)] || [139,92,246];
    return `<td class="zone-cell" style="color:rgb(${rgb.join(',')});font-weight:800;text-align:center">
      ${(colTotals[z]||0).toLocaleString('pt-BR')}
    </td>`;
  }).join('');

  document.getElementById('perfilCrosstabTable').innerHTML = `
    <thead><tr><th>Perfil</th>${zoneHeaders}<th class="col-total">Total</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr class="row-total"><td class="faixa">Total</td>${totalCells}<td class="total-cell">${grandTotal.toLocaleString('pt-BR')}</td></tr></tfoot>`;
}

// ── Turno Donut ────────────────────────────────────────────────────────
const TURNO_COLORS = { T1: '#3b82f6', T2: '#f59e0b', T3: '#22c55e' };
const TURNO_EXTRA  = ['#8b5cf6','#14b8a6','#ec4899'];

function buildTurnoDonut() {
  if (!reportData?.byTurno) return;

  const R    = 38;
  const C    = 2 * Math.PI * R; // ≈ 238.76
  const turnos = Object.entries(reportData.byTurno).sort((a, b) => b[1].pacotes - a[1].pacotes);
  const total  = turnos.reduce((s, [, v]) => s + v.pacotes, 0);

  let cumulPct = 0;
  const segs = turnos.map(([name, val], i) => {
    const color  = TURNO_COLORS[name] || TURNO_EXTRA[i % TURNO_EXTRA.length];
    const pct    = total > 0 ? val.pacotes / total : 0;
    const dash   = pct * C;
    const gap    = C - dash;
    const offset = C * (0.25 - cumulPct); // 0.25 = start at 12 o'clock
    cumulPct    += pct;
    return { name, val, color, pct, dash, gap, offset };
  });

  // SVG
  const svgInner = `<circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="17"/>` +
    segs.map(s =>
      `<circle cx="50" cy="50" r="${R}" fill="none"
        stroke="${s.color}" stroke-width="17"
        stroke-dasharray="${s.dash.toFixed(3)} ${s.gap.toFixed(3)}"
        stroke-dashoffset="${s.offset.toFixed(3)}"/>`
    ).join('');
  document.getElementById('turnoSvg').innerHTML = svgInner;
  document.getElementById('turnoTotal').textContent = total.toLocaleString('pt-BR');

  // Legend
  document.getElementById('turnoLegend').innerHTML = segs.map(s => `
    <div class="donut-legend-item">
      <div class="donut-swatch" style="background:${s.color}"></div>
      <div>
        <span class="donut-legend-name">${s.name}</span>
        <span class="donut-legend-pct">${(s.pct * 100).toFixed(1)}%</span>
      </div>
      <div class="donut-legend-val">${s.val.pacotes.toLocaleString('pt-BR')}</div>
    </div>`).join('') || '<div style="color:var(--muted);font-size:11px">—</div>';
}

// ── Ocupação por Zona ─────────────────────────────────────────────────
function buildOccByZone(areas) {
  // status 1 = Available, status 2 = Occupied (SPX WFM API)
  const hasStatusField = areas.some(a => 'status' in a);
  const avail = hasStatusField
    ? areas.filter(a => a.status === 1)
    : areas;

  const zones = {};
  avail.forEach(a => {
    const z = (a.staging_group_name || 'OUTRAS').trim();
    if (!zones[z]) zones[z] = { tos: 0, cap: 0 };
    zones[z].tos += a.to_quantity || 0;
    zones[z].cap += a.capacity    || 0;
  });
  const rows = Object.entries(zones)
    .sort((a, b) => b[1].tos - a[1].tos)
    .map(([z, v]) => {
      const pct = v.cap > 0 ? (v.tos / v.cap * 100) : 0;
      const oc  = occClass(pct);
      const rgb = ZONE_RGBA[zoneKey(z)] || [139,92,246];
      return `<div class="occ-row">
        <span class="occ-label" style="color:rgb(${rgb.join(',')})">${zoneShort(z)}</span>
        <div class="occ-track"><div class="occ-fill ${oc}" style="width:${Math.min(pct,100).toFixed(1)}%"></div></div>
        <span class="occ-val">${pct.toFixed(1)}%</span>
      </div>`;
    }).join('');
  document.getElementById('occByZone').innerHTML = rows ||
    '<div style="color:var(--muted);text-align:center;padding:20px">—</div>';
}

// ── Filtered / sorted areas ────────────────────────────────────────────
function filteredAreas() {
  let base = activeZone === 'all' ? allAreas
    : allAreas.filter(a => (a.staging_group_name || 'OUTRAS').trim() === activeZone);

  if (activeVolFilter.type === 'sppband') {
    // Filtro por faixa de SPP da rua (aba TODAS) — opera no nível de área
    if (activeZone === 'all') {
      base = base.filter(a => {
        const pac = reportData?.byArea?.[a.area_name]?.pacotes;
        const tos = tosSpp(a);
        if (pac == null || tos === 0) return false;
        const spp = Math.round(pac / tos);
        const { key } = activeVolFilter.value;
        return key === 'b1' ? spp <= 30
             : key === 'b2' ? spp > 30 && spp <= 70
             : key === 'b3' ? spp > 70 && spp <= 150
             :                spp > 150;
      });
    }
  } else if (activeVolFilter.type) {
    // Filtro global volumoso: mantém só ruas com pelo menos 1 TO correspondente
    base = base.filter(a => {
      const tos = reportData?.byAreaTOs?.[a.area_name];
      return tos?.some(t => matchesVolFilter(t));
    });
  }
  return base;
}

function sortedAreas(areas) {
  return [...areas].sort((a, b) => {
    let av, bv;
    if (sortCol === 'occupy_pct') { av = parseOcc(a.occupy_percentage); bv = parseOcc(b.occupy_percentage); }
    else if (sortCol === 'pacotes') {
      av = reportData?.byArea?.[a.area_name]?.pacotes || 0;
      bv = reportData?.byArea?.[b.area_name]?.pacotes || 0;
    } else if (sortCol === 'spp') {
      const apac = reportData?.byArea?.[a.area_name]?.pacotes; const atos = tosSpp(a);
      const bpac = reportData?.byArea?.[b.area_name]?.pacotes; const btos = tosSpp(b);
      av = (apac != null && atos > 0) ? apac / atos : 0;
      bv = (bpac != null && btos > 0) ? bpac / btos : 0;
    } else if (['area_name','staging_group_name','operator'].includes(sortCol)) {
      av = (a[sortCol] || '').toLowerCase(); bv = (b[sortCol] || '').toLowerCase();
      return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    } else { av = a[sortCol] || 0; bv = b[sortCol] || 0; }
    return sortAsc ? av - bv : bv - av;
  });
}

// ── Expanded TOs sub-table ─────────────────────────────────────────────
function renderTosSub(areaName) {
  const tos = reportData?.byAreaTOs?.[areaName];
  if (!tos?.length) return `<div class="expand-inner" style="color:var(--muted);font-size:12px">Nenhum TO na planilha para esta rua.</div>`;

  // Quando filtro ativo: TOs correspondentes primeiro, depois aging desc
  const sorted = [...tos].sort((a, b) => {
    if (activeVolFilter.type) {
      const aM = matchesVolFilter(a) ? 1 : 0;
      const bM = matchesVolFilter(b) ? 1 : 0;
      if (bM !== aM) return bM - aM;
    }
    return b.aging_h - a.aging_h;
  });

  const rows = sorted.map(t => {
    const isMatch = activeVolFilter.type ? matchesVolFilter(t) : false;
    return `<tr class="${isMatch ? 'to-match' : ''}">
      <td style="font-family:monospace;font-size:11px">${t.to}</td>
      <td style="font-family:monospace;text-align:center">${t.pacotes}</td>
      <td style="font-family:monospace">${fmtDurH(t.aging_h)}</td>
      <td style="color:var(--muted)">${t.hora_end}</td>
      <td>${turnoTag(t.turno)}</td>
      <td>${renderPerfilBadges(t.to)}</td>
    </tr>`;
  }).join('');

  const matchCount = activeVolFilter.type ? sorted.filter(t => matchesVolFilter(t)).length : 0;
  const matchNote  = activeVolFilter.type
    ? `<div style="font-size:10px;color:var(--blue);margin-bottom:6px">🔍 ${matchCount} TO(s) do filtro ativo · destacados e ordenados primeiro</div>`
    : '';

  return `<div class="expand-inner">
    ${matchNote}
    <table class="tos-subtable">
      <thead><tr><th>TO</th><th style="text-align:center">Pacotes</th><th>Aging</th><th>Hora End.</th><th>Turno</th><th>Perfil</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// ── Pagination helper ───────────────────────────────────────────────────
function buildPaginationBar(total, page, size) {
  const bar   = document.getElementById('paginationBar');
  const info  = document.getElementById('pagInfo');
  const pages = document.getElementById('pagPages');
  if (total === 0) { bar.style.display = 'none'; return; }
  bar.style.display = '';

  const totalPages = Math.ceil(total / size);
  const from = (page - 1) * size + 1;
  const to   = Math.min(page * size, total);
  info.textContent = `Mostrando ${from}–${to} de ${total} ruas`;

  // Build page number buttons (max 7 visible: prev ... 1 2 3 ... next)
  let btns = '';
  const mkBtn = (label, p, active = false, disabled = false) =>
    `<button class="pag-btn${active ? ' active' : ''}" data-page="${p}" ${disabled ? 'disabled' : ''}>${label}</button>`;

  btns += mkBtn('‹', page - 1, false, page === 1);   // prev
  if (totalPages <= 7) {
    for (let i = 1; i <= totalPages; i++) btns += mkBtn(i, i, i === page);
  } else {
    btns += mkBtn(1, 1, page === 1);
    if (page > 3) btns += `<span class="pag-ellipsis">…</span>`;
    const start = Math.max(2, page - 1);
    const end   = Math.min(totalPages - 1, page + 1);
    for (let i = start; i <= end; i++) btns += mkBtn(i, i, i === page);
    if (page < totalPages - 2) btns += `<span class="pag-ellipsis">…</span>`;
    btns += mkBtn(totalPages, totalPages, page === totalPages);
  }
  btns += mkBtn('›', page + 1, false, page === totalPages);  // next

  pages.innerHTML = btns;
  pages.querySelectorAll('.pag-btn[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentPage = parseInt(btn.dataset.page);
      buildMainTable(filteredAreas());
    });
  });
}

// ── Main table ──────────────────────────────────────────────────────────
function buildMainTable(areas) {
  if (allAreas.length === 0) {
    document.getElementById('mainTable').style.display      = 'none';
    document.getElementById('emptyMsg').style.display       = '';
    document.getElementById('paginationBar').style.display  = 'none';
    return;
  }
  document.getElementById('mainTable').style.display = '';
  document.getElementById('emptyMsg').style.display  = 'none';

  // Apply table-level filters
  const q = tableSearch.toLowerCase();
  let vis = sortedAreas(areas);
  // Apenas ruas com status Available (status=1) — se o campo existir
  if (vis.some(a => 'status' in a)) vis = vis.filter(a => a.status === 1);
  if (q)             vis = vis.filter(a => a.area_name.toLowerCase().includes(q) || (a.staging_group_name||'').toLowerCase().includes(q) || cleanOp(a.operator).toLowerCase().includes(q));
  if (tableZoneFilter) vis = vis.filter(a => (a.staging_group_name||'').trim() === tableZoneFilter);

  const total = vis.length;
  // Clamp currentPage to valid range after filtering
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;

  document.getElementById('tableCount').textContent = `${total} ruas`;

  // Slice to current page
  const start = (currentPage - 1) * pageSize;
  const page  = vis.slice(start, start + pageSize);

  document.getElementById('mainBody').innerHTML = page.map(a => {
    const occ = parseOcc(a.occupy_percentage);
    const pac = reportData?.byArea?.[a.area_name]?.pacotes;
    const tos = tosSpp(a);
    const spp = (pac != null && tos > 0) ? Math.round(pac / tos) : null;
    const isExp = expandedAreas.has(a.area_name);
    const areaInfo  = getAreaLabel(a);
    const areaCell  = areaInfo
      ? `<span style="display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;color:${areaInfo.color};background:${areaInfo.bg};border:1px solid ${areaInfo.color}33;white-space:nowrap">${areaInfo.label}</span>`
      : `<span style="color:var(--muted);font-size:11px">—</span>`;
    const expandRow = isExp ? `<tr class="expand-row"><td colspan="10">${renderTosSub(a.area_name)}</td></tr>` : '';
    return `<tr class="area-row" data-area="${a.area_name}">
      <td class="area-name"><span class="expand-chevron${isExp?' open':''}">▶</span>${a.area_name}</td>
      <td><span class="zone-pill ${zonePillClass(a.staging_group_name)}">${zoneShort(a.staging_group_name)}</span></td>
      <td>${areaCell}</td>
      <td style="font-family:monospace;text-align:center;font-weight:${tos>0?'700':'400'}">${tos}</td>
      <td style="font-family:monospace;text-align:center;font-weight:600;color:${pac>0?'var(--text)':'var(--muted)'}">${pac!=null?pac.toLocaleString('pt-BR'):'—'}</td>
      <td style="font-family:monospace;text-align:center;color:${spp!=null?'var(--text)':'var(--muted)'}">${spp!=null?spp:'—'}</td>
      <td style="font-family:monospace;text-align:center;color:var(--muted)">${a.capacity||0}</td>
      <td>
        <div class="occ-bar-wrap">
          <div class="occ-bar"><div class="occ-fill2 ${occClass(occ)}" style="width:${Math.min(occ,100).toFixed(1)}%"></div></div>
          <span style="font-size:11px;font-family:monospace">${a.occupy_percentage||'0 %'}</span>
        </div>
      </td>
      <td><span class="aging-val ${agingClass(a.staging_duration_time)}">${fmtDur(a.staging_duration_time)}</span></td>
      <td style="font-size:11px;color:var(--muted)">${cleanOp(a.operator)}</td>
    </tr>${expandRow}`;
  }).join('');

  buildPaginationBar(total, currentPage, pageSize);

  // Expand click
  document.querySelectorAll('.area-row').forEach(row => {
    row.addEventListener('click', () => {
      const name = row.dataset.area;
      if (expandedAreas.has(name)) expandedAreas.delete(name);
      else expandedAreas.add(name);
      buildMainTable(filteredAreas());
    });
  });
}

// ── Filtro global único (single source of truth) ──────────────────────────
// type: 'pct' | 'distrib' | 'turno' | 'aging' | null
// value: 'lt'/'eq'/'gt' | {min,max,label} | 'T1'/'T2'/'T3' | {min,max,label}
let activeVolFilter = { type: null, value: null };

function matchesVolFilter(t) {
  if (!activeVolFilter.type) return true;
  const { type, value } = activeVolFilter;
  if (type === 'pct') {
    return value === 'lt' ? t.pacotes < PCT_THRESHOLD :
           value === 'eq' ? t.pacotes === PCT_THRESHOLD :
                            t.pacotes > PCT_THRESHOLD;
  }
  if (type === 'distrib') {
    return t.pacotes >= value.min && t.pacotes < value.max;
  }
  if (type === 'turno') {
    return (t.turno || '') === value;
  }
  if (type === 'aging') {
    const secs = t.aging_h * 3600;
    return secs >= value.min && secs < value.max;
  }
  return true;
}

function getFilteredVolumosoTOs() {
  const all = getVolumosoTOs();
  return activeVolFilter.type ? all.filter(matchesVolFilter) : all;
}

function filterLabel() {
  const { type, value } = activeVolFilter;
  if (type === 'pct')     return value === 'lt' ? `TOs < ${PCT_THRESHOLD} pacotes` :
                                 value === 'eq' ? `TOs = ${PCT_THRESHOLD} pacotes` :
                                                  `TOs > ${PCT_THRESHOLD} pacotes`;
  if (type === 'distrib') return `Faixa ${value.label} pacotes`;
  if (type === 'turno')   return `Turno ${value}`;
  if (type === 'aging')   return `Aging ${value.label}`;
  if (type === 'sppband') return `SPP ${value.label} pacotes/TO`;
  return '';
}

function setVolFilter(type, value) {
  // Toggle: mesmo clique remove
  const same = activeVolFilter.type === type &&
               JSON.stringify(activeVolFilter.value) === JSON.stringify(value);
  activeVolFilter = same ? { type: null, value: null } : { type, value };

  // Atualiza cards PCT
  ['statLt20','statEq20','statGt20'].forEach(id =>
    document.getElementById(id)?.classList.remove('pct-active'));
  if (activeVolFilter.type === 'pct') {
    const map = { lt:'statLt20', eq:'statEq20', gt:'statGt20' };
    document.getElementById(map[activeVolFilter.value])?.classList.add('pct-active');
  }

  // Banner
  const banner  = document.getElementById('pctFilterBanner');
  const label   = document.getElementById('pctFilterLabel');
  const descEl  = document.getElementById('pctFilterDesc');
  if (activeVolFilter.type) {
    label.textContent = filterLabel();
    if (descEl) descEl.textContent = activeVolFilter.type === 'sppband'
      ? '— mostrando ruas por faixa de SPP'
      : '— mostrando ruas com TOs correspondentes';
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  // Reconstrói tudo
  expandedAreas.clear();
  currentPage = 1;
  if (isVolumoso()) buildVolumoso();
  buildSPPView();
  buildAgingCrit();
  buildMainTable(filteredAreas());
}

// Alias para o onclick inline dos cards PCT
function setPctFilter(v) { setVolFilter('pct', v); }

// Limpa qualquer filtro ativo (botão do banner)
function clearFilter() {
  activeVolFilter = { type: null, value: null };
  ['statLt20','statEq20','statGt20'].forEach(id =>
    document.getElementById(id)?.classList.remove('pct-active'));
  document.getElementById('pctFilterBanner').style.display = 'none';
  expandedAreas.clear();
  currentPage = 1;
  if (isVolumoso()) buildVolumoso();
  buildSPPView();
  buildAgingCrit();
  buildMainTable(filteredAreas());
}

// ── Copiar report Volumoso para SeaTalk ─────────────────────────────────────
function copyVolReport() {
  const tos   = getVolumosoTOs();   // sempre usa todos, sem filtro ativo
  const total = tos.length;
  const gt20  = tos.filter(t => t.pacotes > PCT_THRESHOLD).length;
  const avgH  = total ? tos.reduce((s, t) => s + (t.aging_h || 0), 0) / total : 0;
  const hh    = Math.floor(avgH);
  const mm    = Math.round((avgH - hh) * 60);
  const agingStr = hh > 0 ? `${hh}h ${mm}min` : `${mm}min`;

  const text = [
    `Report SPP Volumoso:`,
    `Total TO's: ${total}`,
    `TO's > ${PCT_THRESHOLD}: ${gt20}`,
    `Aging Médio: ${agingStr}`,
    ``,
    `Link para acompanhamento: ${APP_URL}`,
  ].join('\n');

  const btn  = document.getElementById('btnCopyVolReport');
  const orig = btn.innerHTML;

  const ok = () => {
    btn.innerHTML = '✅ Copiado!';
    btn.style.background = 'rgba(34,197,94,.2)';
    btn.style.borderColor = 'rgba(34,197,94,.4)';
    btn.style.color = '#4ade80';
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.style.background = '';
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 2500);
  };

  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(ok).catch(() => fallback(text, ok));
  } else {
    fallback(text, ok);
  }

  function fallback(t, cb) {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); } catch (_) {}
    document.body.removeChild(ta);
  }
}

// ── Visão SPP · Aba TODAS ──────────────────────────────────────────────
function buildSPPView() {
  const el = document.getElementById('sppView');
  if (!el) return;
  if (activeZone !== 'all') { el.style.display = 'none'; return; }
  el.style.display = '';

  const distribEl = document.getElementById('sppDistrib');
  const zoneEl    = document.getElementById('sppByZone');

  if (!reportData?.byArea) {
    if (distribEl) distribEl.innerHTML = '<div style="color:var(--muted);font-size:12px;text-align:center;padding:16px">Aguardando dados da Consulta...</div>';
    if (zoneEl)    zoneEl.innerHTML    = '';
    return;
  }

  const areas  = allAreas.filter(a => a.to_quantity > 0 || gaiolasDaRua(a.area_name) > 0);

  // Calcula SPP por rua
  const areasSpp = areas.map(a => {
    const pac = reportData.byArea[a.area_name]?.pacotes;
    const tos = tosSpp(a);
    const spp = (pac != null && tos > 0) ? pac / tos : null;
    return { ...a, spp, pac: pac ?? 0, tosSpp: tos };
  }).filter(a => a.spp !== null);

  const bands = [
    { label: `≤ 30`,          key: 'b1', color: 'var(--green)',  min: 0,   max: 30  },
    { label: `> 30 e ≤ 70`,   key: 'b2', color: 'var(--blue)',   min: 31,  max: 70  },
    { label: `> 70 e ≤ 150`,  key: 'b3', color: 'var(--yellow)', min: 71,  max: 150 },
    { label: `> 150`,         key: 'b4', color: 'var(--red)',    min: 151, max: Infinity },
  ];

  const bandData = bands.map(b => {
    const matched = areasSpp.filter(a => {
      const s = Math.round(a.spp);
      return s >= b.min && s <= b.max;
    });
    return {
      ...b,
      count:    matched.length,
      totalPac: matched.reduce((s, a) => s + a.pac, 0),
      areas:    matched,
    };
  });

  const maxCount   = Math.max(...bandData.map(b => b.count), 1);
  const totalAreas = areasSpp.length;

  // Barras de distribuição clicáveis
  if (distribEl) {
    distribEl.innerHTML = bandData.map(b => {
      const pct      = totalAreas ? Math.round(b.count / totalAreas * 100) : 0;
      const barW     = (b.count / maxCount * 100).toFixed(1);
      const isActive = activeVolFilter.type === 'sppband' && activeVolFilter.value?.key === b.key;
      const valStr   = JSON.stringify({ key: b.key, label: b.label }).replace(/"/g, '&quot;');
      const pkgInfo  = b.totalPac > 0 ? `· ${b.totalPac.toLocaleString('pt-BR')} pcts` : '';
      return `<div class="vol-row${isActive ? ' vol-active' : ''}" onclick="setVolFilter('sppband',${valStr})"
        title="${b.count} ruas ${pkgInfo}">
        <span class="vol-label" style="min-width:52px;color:${b.color};font-size:13px;font-weight:700">${b.label}</span>
        <div class="vol-bar-wrap"><div class="vol-bar" style="width:${barW}%;background:${b.color}"></div></div>
        <span class="vol-val">${b.count} ruas <span class="vol-pct">(${pct}%)</span></span>
      </div>`;
    }).join('') || '<div style="color:var(--muted);text-align:center;padding:12px;font-size:12px">Sem dados SPP</div>';
  }

  // SPP médio por zona
  if (zoneEl) {
    const zoneSpp = {};
    areasSpp.forEach(a => {
      const z = (a.staging_group_name || 'OUTRAS').trim();
      if (!zoneSpp[z]) zoneSpp[z] = { tos: 0, pac: 0 };
      zoneSpp[z].tos += a.tosSpp;
      zoneSpp[z].pac += a.pac;
    });

    const zoneRows = Object.entries(zoneSpp)
      .sort((a, b) => (b[1].pac / b[1].tos) - (a[1].pac / a[1].tos))
      .map(([z, v], i, arr) => {
        const sppZ    = v.tos > 0 ? v.pac / v.tos : 0;
        const sppR    = Math.round(sppZ);
        const color   = sppR <= 30  ? 'var(--green)'
                       : sppR <= 70  ? 'var(--blue)'
                       : sppR <= 150 ? 'var(--yellow)'
                       :               'var(--red)';
        const rgb     = ZONE_RGBA[zoneKey(z)] || [139, 92, 246];
        const barPct  = Math.min(sppZ / 200 * 100, 100).toFixed(1);
        const border  = i < arr.length - 1 ? 'border-bottom:1px solid rgba(42,45,62,.35);' : '';
        return `<div style="display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;padding:7px 0;${border}">
          <span style="font-size:11px;font-weight:700;color:rgb(${rgb.join(',')});letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${zoneShort(z)}</span>
          <div style="background:var(--surface2);border-radius:3px;height:7px;overflow:hidden">
            <div style="background:${color};width:${barPct}%;height:100%;border-radius:3px;transition:width .35s ease"></div>
          </div>
          <span style="font-size:13px;font-family:monospace;font-weight:700;color:${color};text-align:right;line-height:1">${sppR}</span>
        </div>`;
      }).join('');

    zoneEl.innerHTML = zoneRows ||
      '<div style="color:var(--muted);text-align:center;padding:12px;font-size:12px">—</div>';
  }
}

function buildVolumoso() {
  // TOs filtrados = fonte de verdade para todos os componentes
  const tos    = getFilteredVolumosoTOs();
  const allTos = getVolumosoTOs(); // total sem filtro (para denominador das barras de distrib)
  const total    = tos.length;
  const totalPac = tos.reduce((s, t) => s + t.pacotes, 0);
  const lt20 = tos.filter(t => t.pacotes < PCT_THRESHOLD).length;
  const eq20 = tos.filter(t => t.pacotes === PCT_THRESHOLD).length;
  const gt20 = tos.filter(t => t.pacotes > PCT_THRESHOLD).length;
  const media = total ? (totalPac / total).toFixed(1) : '0';
  const maior = total ? Math.max(...tos.map(t => t.pacotes)) : 0;

  // KPIs — refletem o filtro ativo
  document.getElementById('lblLt30').textContent  = `TOs < ${PCT_THRESHOLD} pcts`;
  document.getElementById('lblEq30').textContent  = `TOs = ${PCT_THRESHOLD} pcts`;
  document.getElementById('lblGt30').textContent  = `TOs > ${PCT_THRESHOLD} pcts`;
  document.getElementById('vTOs').textContent     = total.toLocaleString('pt-BR');
  document.getElementById('vPacotes').textContent = totalPac.toLocaleString('pt-BR');
  document.getElementById('vLt30').textContent    = lt20.toLocaleString('pt-BR');
  document.getElementById('vEq30').textContent    = eq20.toLocaleString('pt-BR');
  document.getElementById('vGt30').textContent    = gt20.toLocaleString('pt-BR');
  document.getElementById('vMedia').textContent   = media;
  document.getElementById('vMaior').textContent   = maior.toLocaleString('pt-BR');

  // ── Distribuição por faixa de pacotes (clicável → filtro real) ────────
  const distBands = [
    { label: '0–9',   min: 0,  max: 10,     color: 'var(--accent)' },
    { label: '10–19', min: 10, max: 20,     color: 'var(--blue)'   },
    { label: '20–29', min: 20, max: 30,     color: 'var(--yellow)' },
    { label: `30–${PCT_THRESHOLD-1}`,   min: 30, max: PCT_THRESHOLD,   color: 'var(--orange)' },
    { label: `= ${PCT_THRESHOLD}`,      min: PCT_THRESHOLD, max: PCT_THRESHOLD+1,     color: 'var(--purple)' },
    { label: `> ${PCT_THRESHOLD}`,      min: PCT_THRESHOLD+1, max: 999999, color: 'var(--red)'    },
  ];
  // Conta nos TOs originais (sem filtro) para os totais das barras fazerem sentido
  const dCounts = distBands.map(b => allTos.filter(t => t.pacotes >= b.min && t.pacotes < b.max).length);
  const dMax    = Math.max(...dCounts, 1);
  const allTotal = allTos.length;
  document.getElementById('vDistrib').innerHTML = distBands.map((b, i) => {
    const pct     = allTotal ? Math.round(dCounts[i] / allTotal * 100) : 0;
    const barW    = (dCounts[i] / dMax * 100).toFixed(1);
    const isActive = activeVolFilter.type === 'distrib' &&
                     activeVolFilter.value?.label === b.label;
    const val = JSON.stringify({ min: b.min, max: b.max, label: b.label }).replace(/"/g, '&quot;');
    return `<div class="vol-row${isActive?' vol-active':''}" onclick="setVolFilter('distrib',${val})">
      <span class="vol-label">${b.label}</span>
      <div class="vol-bar-wrap"><div class="vol-bar" style="width:${barW}%;background:${b.color}"></div></div>
      <span class="vol-val">${dCounts[i].toLocaleString('pt-BR')} <span class="vol-pct">(${pct}%)</span></span>
    </div>`;
  }).join('');

  // ── Turno Ofensor — sempre restrito aos TOs pesados (> PCT_THRESHOLD pcts), ─
  // independente de qual outro filtro esteja ativo, pois é isso que os torna "ofensores"
  document.getElementById('vTurnoOfensorTitle').textContent   = `Turno Ofensor (TOs > ${PCT_THRESHOLD} pcts)`;
  document.getElementById('vTop5Title').textContent           = `Top 5 TOs com Maior Volume (> ${PCT_THRESHOLD} pcts)`;
  const heavyTos = tos.filter(t => t.pacotes > PCT_THRESHOLD);
  const byTurno = {};
  heavyTos.forEach(t => { const k = t.turno || '?'; byTurno[k] = (byTurno[k] || 0) + 1; });
  const turnoSorted = Object.entries(byTurno).sort((a, b) => b[1] - a[1]);
  const turnoTotal  = heavyTos.length;
  document.getElementById('vTurnoOfensor').innerHTML = turnoSorted.length
    ? turnoSorted.map(([turno, cnt]) => {
        const pct    = turnoTotal ? Math.round(cnt / turnoTotal * 100) : 0;
        const barW   = pct;
        const tColor = turno==='T1' ? 'var(--blue)' : turno==='T2' ? 'var(--yellow)' : turno==='T3' ? 'var(--accent)' : 'var(--muted)';
        const isActive = activeVolFilter.type === 'turno' && activeVolFilter.value === turno;
        return `<div class="vol-turno-row${isActive?' vol-active':''}" onclick="setVolFilter('turno','${turno}')">
          <span class="turno-tag ${turno==='T1'?'t-t1':turno==='T2'?'t-t2':turno==='T3'?'t-t3':'t-other'}">${turno}</span>
          <div class="vol-bar-wrap"><div class="vol-bar" style="width:${barW}%;background:${tColor}"></div></div>
          <span class="vol-val">${cnt} TOs <span class="vol-pct">(${pct}%)</span></span>
        </div>`;
      }).join('')
    : `<div style="color:var(--muted);font-size:12px;text-align:center;padding:20px">Nenhum TO no filtro atual</div>`;

  // ── Top 5 TOs com maior volume (sempre entre os TOs > PCT_THRESHOLD pcts) ──
  const top5 = [...heavyTos].sort((a, b) => b.pacotes - a.pacotes).slice(0, 5);
  document.getElementById('vTop5').innerHTML = top5.length
    ? `<table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="color:var(--muted);font-size:11px">
          <th style="text-align:left;padding:4px 6px">#</th>
          <th style="text-align:left;padding:4px 6px">TO</th>
          <th style="text-align:left;padding:4px 6px">Rua</th>
          <th style="text-align:center;padding:4px 6px">Pacotes</th>
          <th style="text-align:left;padding:4px 6px">Aging</th>
          <th style="text-align:left;padding:4px 6px">Turno</th>
        </tr></thead>
        <tbody>${top5.map((t, i) => `<tr style="border-top:1px solid var(--border)">
          <td style="padding:5px 6px"><span class="rank-num">${i+1}</span></td>
          <td style="padding:5px 6px;font-family:monospace;font-size:11px">${t.to}</td>
          <td style="padding:5px 6px;font-weight:600">${t.rua}</td>
          <td style="padding:5px 6px;text-align:center;font-weight:800;color:var(--red)">${t.pacotes}</td>
          <td style="padding:5px 6px">${fmtDurH(t.aging_h)}</td>
          <td style="padding:5px 6px">${turnoTag(t.turno)}</td>
        </tr>`).join('')}</tbody>
      </table>`
    : `<div style="color:var(--muted);text-align:center;padding:24px;font-size:12px">Nenhum TO no filtro atual</div>`;

  // ── Histograma de Aging (clicável) ─────────────────────────────────────
  const hCounts  = VOL_BINS.map(b => tos.filter(t => { const s = t.aging_h * 3600; return s >= b.min && s < b.max; }).length);
  const hPacotes = VOL_BINS.map(b => tos.filter(t => { const s = t.aging_h * 3600; return s >= b.min && s < b.max; }).reduce((s, t) => s + t.pacotes, 0));
  const hMax    = Math.max(...hCounts, 1);
  const HIST_COLORS = ['#22c55e','#4ade80','#a3e635','#facc15','#fbbf24','#fb923c','#f97316','#ef4444','#dc2626','#b91c1c','#7f1d1d'];
  document.getElementById('vAgingHist').innerHTML =
    `<div style="display:flex;flex-direction:column;gap:7px;padding:4px 0">` +
    VOL_BINS.map((b, i) => {
      const pct    = total ? Math.round(hCounts[i] / total * 100) : 0;
      const barW   = (hCounts[i] / hMax * 100).toFixed(1);
      const color  = HIST_COLORS[i] || '#7f1d1d';
      const inside = parseFloat(barW) > 28;
      const isActive = activeVolFilter.type === 'aging' &&
                       activeVolFilter.value?.label === b.label;
      const val = JSON.stringify({ min: b.min, max: b.max, label: b.label }).replace(/"/g, '&quot;');
      return `<div class="vol-aging-row${isActive?' vol-active':''}"
        style="display:grid;grid-template-columns:72px 1fr 56px 48px;align-items:center;gap:10px"
        onclick="setVolFilter('aging',${val})">
        <span style="font-size:11px;font-weight:700;color:var(--muted);text-align:right;letter-spacing:.3px">${b.label}</span>
        <div style="position:relative;background:var(--surface2);border-radius:8px;height:32px;overflow:hidden">
          <div style="width:${barW}%;background:${color};height:100%;border-radius:8px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:10px">
            ${inside && hCounts[i] > 0 ? `<span style="font-size:13px;font-weight:800;color:rgba(0,0,0,.75);white-space:nowrap">${hCounts[i].toLocaleString('pt-BR')}</span>` : ''}
          </div>
          ${!inside && hCounts[i] > 0 ? `<span style="position:absolute;left:calc(${barW}% + 8px);top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--text);white-space:nowrap">${hCounts[i].toLocaleString('pt-BR')}</span>` : ''}
          ${hCounts[i] === 0 ? `<span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted)">—</span>` : ''}
        </div>
        <span style="font-size:12px;font-weight:600;color:${hCounts[i]>0?color:'var(--muted)'};text-align:right;font-family:monospace">${hCounts[i] > 0 ? (hPacotes[i] / hCounts[i]).toLocaleString('pt-BR', {minimumFractionDigits:1,maximumFractionDigits:1}) : '—'}</span>
        <span style="font-size:12px;font-weight:600;color:${pct>0?color:'var(--muted)'};text-align:right">${pct > 0 ? pct+'%' : '—'}</span>
      </div>`;
    }).join('') + `</div>`;

  buildVolPerfilCards();
}

// ── Perfil de pacote · Zona Volumoso ────────────────────────────────────
function buildVolPerfilCards() {
  const section = document.getElementById('vPerfilSection');
  const recs = (profileData?.byTO ? Object.values(profileData.byTO) : [])
    .filter(r => zoneKey(r.group_name) === 'volumoso');
  if (!recs.length) { section.style.display = 'none'; return; }
  section.style.display = '';

  const totals = {};
  PERFIL_ORDER.forEach(d => { totals[d.key] = 0; });
  recs.forEach(r => PERFIL_ORDER.forEach(d => { totals[d.key] += (r[d.key] || 0); }));
  const grandTotal = PERFIL_ORDER.reduce((s, d) => s + totals[d.key], 0);

  document.getElementById('vPerfilCards').innerHTML = PERFIL_ORDER.map(d => {
    const v   = totals[d.key];
    const pct = grandTotal ? (v / grandTotal * 100).toFixed(1) : '0.0';
    return `
      <div class="zone-card" style="border-top-color:${d.color}">
        <div class="zone-card-label" style="color:${d.color}">${d.label}</div>
        <div class="zone-card-value" style="color:${d.color}">${v.toLocaleString('pt-BR')}</div>
        <div class="zone-card-meta"><span>${pct}% do total</span></div>
      </div>`;
  }).join('');
}

// ── Aging Criticality Panel ───────────────────────────────────────────
function buildAgingCrit() {
  const el = document.getElementById('agingCritSection');
  if (!el) return;

  if (isVolumoso() || !reportData?.byAreaTOs || !Object.keys(reportData.byAreaTOs).length) {
    el.style.display = 'none'; return;
  }

  // Aggregate TOs — filter by active zone when not "all"
  let areaKeys = Object.keys(reportData.byAreaTOs);
  if (activeZone !== 'all') {
    const zoneSet = new Set(
      allAreas.filter(a => (a.staging_group_name || 'OUTRAS').trim() === activeZone)
              .map(a => a.area_name)
    );
    areaKeys = areaKeys.filter(k => zoneSet.has(k));
  }

  const allTOs    = areaKeys.flatMap(k => reportData.byAreaTOs[k] || []);
  const totalPkgs = allTOs.reduce((s, t) => s + t.pacotes, 0);
  if (!allTOs.length || totalPkgs === 0) { el.style.display = 'none'; return; }

  el.style.display = '';

  // Band definitions (aging_h thresholds)
  const BANDS = [
    { key:'b1', label:'0 – 1 dia',   min:0,  max:24,       tip:'Backlog dentro do SLA operacional. Faixa saudável.' },
    { key:'b2', label:'1 – 2 dias',  min:24, max:48,       tip:'Pacotes com 1–2 dias de aging. Requer rotação ativa para evitar envelhecimento.' },
    { key:'b3', label:'2 – 3 dias',  min:48, max:72,       tip:'Próximo ao limite de SLA. Escalar para supervisão imediatamente.' },
    { key:'b4', label:'> 3 dias',    min:72, max:Infinity, tip:'⚠️ VIOLAÇÃO DE SLA. Pacotes com mais de 3 dias em staging. Ação imediata obrigatória.' },
  ];

  const bands = BANDS.map(b => {
    const tos   = allTOs.filter(t => t.aging_h >= b.min && t.aging_h < b.max);
    const pkgs  = tos.reduce((s, t) => s + t.pacotes, 0);
    const pct   = totalPkgs > 0 ? pkgs / totalPkgs * 100 : 0;
    const count = tos.length;

    // Severity: 0-1d is always ok; 1-2d always amber; older bands escalate by % threshold
    let sev, statusLabel;
    if (b.key === 'b1') {
      sev = 'ok'; statusLabel = 'Saudável';
    } else if (b.key === 'b2') {
      sev         = 'warn';            // always amber — condizente com Atenção
      statusLabel = 'Atenção';
    } else if (b.key === 'b3') {
      sev         = pct <= 1 ? 'warn' : pct <= 3 ? 'crit' : 'danger';
      statusLabel = pct <= 1 ? 'Controlado' : pct <= 3 ? 'Crítico' : 'RISCO SLA';
    } else {
      sev         = pct <= 1 ? 'crit' : 'danger';
      statusLabel = pct <= 1 ? 'Crítico' : 'PERIGO';
    }

    const color = sev === 'ok' ? 'var(--green)' : sev === 'warn' ? 'var(--amber)' : 'var(--red)';
    return { ...b, pkgs, pct, count, sev, statusLabel, color };
  });

  // Global alert: any band >= 2d with pct > 3%
  const alertLevel = bands.some(b => b.key === 'b4' && b.pct > 3) ? 'red'
                   : bands.some(b => b.key === 'b3' && b.pct > 3) ? 'amber'
                   : null;
  const alertText  = alertLevel === 'red'
    ? '🚨 RISCO SLA — Backlog acima de 3 dias > 3% do total'
    : alertLevel === 'amber'
    ? '⚠️ AGING CRÍTICO — Acúmulo em 2–3 dias acima do limite'
    : null;

  const maxPkgs = Math.max(...bands.map(b => b.pkgs), 1);

  const rowsHtml = bands.map(b => {
    const barW    = (b.pkgs / maxPkgs * 100).toFixed(1);
    const isActive = activeVolFilter.type === 'aging' && activeVolFilter.value?.label === b.label;
    // Convert hours → seconds for the existing aging filter (uses t.aging_h * 3600)
    const minSec  = b.min * 3600;
    const maxSec  = b.max === Infinity ? 999999999 : b.max * 3600;
    const fVal    = JSON.stringify({ min: minSec, max: maxSec, label: b.label }).replace(/"/g, '&quot;');
    return `<div class="aging-band-row abr-${b.sev}${isActive ? ' abr-active' : ''}"
      title="${b.tip}" style="cursor:pointer"
      onclick="setVolFilter('aging',${fVal})">
      <span class="aging-band-lbl" style="color:${b.color}">${b.label}</span>
      <div>
        <div class="aging-band-pkgs" style="color:${b.color}">${b.pkgs.toLocaleString('pt-BR')}</div>
        <div class="aging-band-sub">${b.count} TO${b.count !== 1 ? 's' : ''}</div>
      </div>
      <div>
        <div class="aging-bar-outer">
          <div class="aging-bar-inner" style="width:${barW}%;background:${b.color}"></div>
        </div>
      </div>
      <span class="aging-pct" style="color:${b.color}">${b.pct.toFixed(1)}%</span>
      <span class="aging-status-tag ast-${b.sev}">${b.statusLabel}</span>
    </div>`;
  }).join('');

  el.innerHTML = `<div class="aging-crit-panel">
    <div class="aging-crit-hdr">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2.5" style="flex-shrink:0">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span class="aging-crit-hdr-title">Criticidade de Aging · Backlog por Tempo em Staging</span>
      <span style="margin-left:8px;font-size:13px;font-weight:700;color:var(--text)">
        ${totalPkgs.toLocaleString('pt-BR')}
        <span style="font-size:10px;color:var(--muted);font-weight:400;margin-left:2px">pacotes</span>
      </span>
      ${alertText
        ? `<span class="aging-alert-pill ${alertLevel}" style="margin-left:auto">${alertText}</span>`
        : `<span style="margin-left:auto;font-size:10px;color:var(--green)">✅ Aging dentro dos limites operacionais</span>`
      }
    </div>
    <div class="aging-col-hdr">
      <span>Faixa</span><span>Pacotes</span><span>Distribuição</span>
      <span style="text-align:right">% Total</span><span style="text-align:center">Status</span>
    </div>
    ${rowsHtml}
  </div>`;
}

// ── Operacional View ─────────────────────────────────────────────────────
const OP_ZONE_COLORS = {
  linear:   { color: '#3b82f6', glow: 'rgba(59,130,246,',  bg: 'rgba(59,130,246,.08)' },
  volumoso: { color: '#22c55e', glow: 'rgba(34,197,94,',   bg: 'rgba(34,197,94,.08)'  },
  cop:      { color: '#f59e0b', glow: 'rgba(245,158,11,',  bg: 'rgba(245,158,11,.08)' },
  lmh:      { color: '#8b5cf6', glow: 'rgba(139,92,246,',  bg: 'rgba(139,92,246,.08)' },
  other:    { color: '#8b5cf6', glow: 'rgba(139,92,246,',  bg: 'rgba(139,92,246,.08)' },
};

function opZoneColor(name) {
  const k = zoneKey(name);
  const n = (name || '').toLowerCase();
  if (n.includes('lmh')) return OP_ZONE_COLORS.lmh;
  return OP_ZONE_COLORS[k] || OP_ZONE_COLORS.other;
}

function buildOperacional() {
  const active = allAreas.filter(a => a.to_quantity > 0 || gaiolasDaRua(a.area_name) > 0);
  if (!active.length) {
    document.getElementById('opGrid').innerHTML =
      '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted);font-size:15px">Nenhuma zona ativa</div>';
    return;
  }

  const zoneMap = {};
  active.forEach(a => {
    const z = (a.staging_group_name || 'OUTRAS').trim();
    if (!zoneMap[z]) zoneMap[z] = { name: z, areas: [] };
    zoneMap[z].areas.push(a);
  });

  const cards = Object.values(zoneMap)
    .sort((a, b) => {
      const mA = Math.max(...a.areas.map(x => x.staging_duration_time || 0));
      const mB = Math.max(...b.areas.map(x => x.staging_duration_time || 0));
      return mB - mA;
    })
    .map(z => {
      const areas      = z.areas;
      const col        = opZoneColor(z.name);
      const totalTOs   = areas.reduce((s, a) => s + (a.to_quantity || 0), 0);
      const ruasAtivas = areas.length;
      // Capacidade total = todas as ruas da zona (inclusive as vazias)
      const allZoneAreas = allAreas.filter(a => (a.staging_group_name || 'OUTRAS').trim() === z.name);
      const totalCap     = allZoneAreas.reduce((s, a) => s + (a.capacity || 0), 0);
      const ocupPct      = totalCap > 0 ? (totalTOs / totalCap * 100) : 0;

      const rz       = getReportZone(z.name);
      const totalPac = rz ? rz.pacotes : areas.reduce((s, a) => {
        const ad = reportData?.byArea?.[a.area_name];
        return s + (ad ? ad.pacotes : 0);
      }, 0);
      const totalUnid = areas.reduce((s, a) => s + tosSpp(a), 0);
      const spp = (totalUnid > 0 && totalPac > 0) ? Math.round(totalPac / totalUnid) : null;

      const agings   = areas.map(a => a.staging_duration_time || 0).filter(v => v > 0);
      const avgAging = agings.length ? agings.reduce((s, v) => s + v, 0) / agings.length : 0;
      const pico     = agings.length ? Math.max(...agings) : 0;

      // Top 10 FIFO: ruas ordenadas por aging desc
      const fifoList = [...areas]
        .filter(a => a.staging_duration_time > 0)
        .sort((a, b) => b.staging_duration_time - a.staging_duration_time)
        .slice(0, 10);

      const isCrit = pico > 86400;
      const isWarn = !isCrit && pico > 25200;

      const occColor = ocupPct >= 85 ? 'var(--red)' : ocupPct >= 60 ? 'var(--yellow)' : 'var(--green)';

      const glowStyle = isCrit
        ? `box-shadow:0 0 0 1px ${col.color}66,0 0 24px ${col.glow}0.15);`
        : isWarn ? `box-shadow:0 0 0 1px rgba(245,158,11,.3);` : '';

      const fifoRows = fifoList.map((a, i) => {
        const ac        = agingClass(a.staging_duration_time);
        const areaInfo  = getAreaLabel(a);
        const areaBadge = areaInfo
          ? `<span class="op-fifo-area" style="background:${areaInfo.bg};color:${areaInfo.color};border:1px solid ${areaInfo.color}44">${areaInfo.label}</span>`
          : '';
        const tos  = a.to_quantity || 0;
        const cap  = a.capacity    || 0;
        const pac  = reportData?.byArea?.[a.area_name]?.pacotes ?? null;
        const unid = tosSpp(a);
        const spp  = (pac != null && unid > 0) ? Math.round(pac / unid) : null;
        const occ  = parseOcc(a.occupy_percentage);
        const occColor = occ >= 85 ? 'var(--red)' : occ >= 60 ? 'var(--yellow)' : 'var(--green)';
        return `<div class="op-fifo-row">
          <span class="op-fifo-rank">${i + 1}</span>
          <div class="op-fifo-info">
            <div class="op-fifo-rua">${a.area_name}${areaBadge}</div>
            <div class="op-fifo-sub">
              <span><strong>${tos}</strong> TOs</span>
              <span><strong>${pac != null ? pac.toLocaleString('pt-BR') : '—'}</strong> pcts</span>
              <span>SPP <strong>${spp != null ? spp : '—'}</strong></span>
              <span>Cap <strong>${cap}</strong></span>
              <span style="color:${occColor};font-weight:700">${occ.toFixed(0)}%</span>
            </div>
          </div>
          <span class="op-fifo-aging aging-val ${ac}">${fmtDur(a.staging_duration_time)}</span>
        </div>`;
      }).join('');

      return `<div class="op-zone-card${isCrit ? ' op-crit' : isWarn ? ' op-warn' : ''}" style="border-top-color:${col.color};${glowStyle}">
        <div class="op-zone-hdr" style="background:${col.bg};border-bottom:1px solid ${col.color}33">
          <span class="op-zone-name" style="color:${col.color}">${zoneShort(z.name)}</span>
          <span class="op-zone-pill" style="background:${col.glow}0.15);color:${col.color};border:1px solid ${col.color}33">
            ${ruasAtivas} rua${ruasAtivas !== 1 ? 's' : ''}
          </span>
        </div>
        <div class="op-kpis-grid">
          <div class="op-kpi">
            <div class="op-kpi-val" style="color:${col.color}">${totalTOs.toLocaleString('pt-BR')}</div>
            <div class="op-kpi-lbl">Total TOs</div>
          </div>
          <div class="op-kpi">
            <div class="op-kpi-val" style="color:var(--purple)">${totalPac > 0 ? totalPac.toLocaleString('pt-BR') : '—'}</div>
            <div class="op-kpi-lbl">Pacotes</div>
          </div>
          <div class="op-kpi">
            <div class="op-kpi-val" style="color:var(--blue)">${spp != null ? spp : '—'}</div>
            <div class="op-kpi-lbl">SPP</div>
          </div>
          <div class="op-kpi">
            <div class="op-kpi-val aging-val ${agingClass(Math.round(avgAging))}">${avgAging > 0 ? fmtDur(Math.round(avgAging)) : '—'}</div>
            <div class="op-kpi-lbl">Aging Médio</div>
          </div>
          <div class="op-kpi">
            <div class="op-kpi-val aging-val ${agingClass(pico)}">${pico > 0 ? fmtDur(pico) : '—'}</div>
            <div class="op-kpi-lbl">Pico Aging</div>
          </div>
          <div class="op-kpi">
            <div class="op-kpi-val" style="color:${occColor}">${ocupPct.toFixed(0)}%</div>
            <div class="op-kpi-lbl">Ocupação</div>
          </div>
        </div>
        <div class="op-occ-wrap">
          <div class="op-occ-track">
            <div class="op-occ-fill" style="width:${Math.min(ocupPct,100).toFixed(1)}%;background:${occColor}"></div>
          </div>
        </div>
        <div class="op-fifo-list">
          <div class="op-fifo-list-hdr">⚡ FIFO — Próximas Ruas</div>
          ${fifoRows || '<div style="padding:10px 14px;color:var(--muted);font-size:12px">Nenhuma rua ativa</div>'}
        </div>
      </div>`;
    }).join('');

  document.getElementById('opGrid').innerHTML = cards;
}

// ── Render ──────────────────────────────────────────────────────────────
function render() {
  const areas = filteredAreas();
  buildZoneTabs();
  const vol  = isVolumoso();
  const op   = activeZone === '__op__';
  document.getElementById('defaultView').style.display     = (!op && !vol) ? '' : 'none';
  document.getElementById('volumosoView').style.display    = vol ? '' : 'none';
  document.getElementById('operacionalView').style.display = op ? '' : 'none';
  document.getElementById('detailSection').style.display   = op ? 'none' : '';
  if (op) {
    buildOperacional();
  } else if (vol) {
    buildVolumoso();
  } else {
    updateStats(areas);
    buildZonaSection(areas);
    buildPerfilSection();
    buildSPPView();
    buildTop5(areas);
    buildOccByZone(areas);
    buildTurnoDonut();
  }
  if (!op) {
    buildAgingCrit();
    buildTableZonePills();
    buildMainTable(areas);
  }
}

// ── Load data (abas Stage IN + Consulta, via cache do servidor) ─────────
async function loadData() {
  try {
    const [stageJson, reportJson] = await Promise.all([
      gs('getStageIn'),
      gs('getReportData').catch(() => null),
    ]);

    const data = JSON.parse(stageJson);
    if (data.error) {
      document.getElementById('emptyMsg').innerHTML = `<h2>Erro na planilha</h2><p>${data.error}</p>`;
      return;
    }

    let rd = null;
    if (reportJson) {
      rd = JSON.parse(reportJson);
      // Só usa o resultado se tiver dados reais (rowCount > 0)
      // Evita sobrescrever dados válidos com resultado vazio durante recálculo da planilha
      if (rd.error || !((rd.rowCount ?? 1) > 0)) rd = null;
    }

    const rdAt = rd ? rd.geradoEm : lastReportAt;
    if (data.fetchedAt === lastAt && rdAt === lastReportAt) return;
    lastAt       = data.fetchedAt;
    lastReportAt = rdAt;
    allAreas     = data.list || [];
    if (rd) reportData = rd;

    const ts = new Date(data.fetchedAt).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('lastUpdated').textContent = ts;
    document.getElementById('liveDot').className       = 'live-dot on';
    document.getElementById('metaTag').textContent     = `inbound · ${allAreas.length} ruas · ${ts}`;

    render();
  } catch (e) { console.warn('[stage-in]', e.message || e); }
}

loadData();
setInterval(loadData, 15000);
</script>
