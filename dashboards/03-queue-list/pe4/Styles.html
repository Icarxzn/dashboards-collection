<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* rolagem sem barra visível (página, tabela e modal) */
html, body, * { scrollbar-width: none; -ms-overflow-style: none; }
::-webkit-scrollbar { display: none; width: 0; height: 0; }

:root {
  --bg: #0d0f14;
  --surface: #161920;
  --surface2: #1e2130;
  --border: #2a2d3e;
  --border2: #353849;
  --text: #e2e8f0;
  --muted: #6b7280;
  --green: #22c55e;
  --yellow: #f59e0b;
  --orange: #ee4d2d;
  --red: #ef4444;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --teal: #14b8a6;
  --accent: #3b82f6;
  --radius: 10px;
  --shadow: 0 2px 8px rgba(0,0,0,.4);
}
[data-theme="light"] {
  --bg: #f1f5f9; --surface: #ffffff; --surface2: #f8fafc;
  --border: #e2e8f0; --border2: #cbd5e1; --text: #0f172a;
  --muted: #64748b; --shadow: 0 2px 8px rgba(0,0,0,.08);
}

html { background: var(--bg); }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; min-height: 100vh; transition: background .2s, color .2s; }

/* ── Header ── */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
.header-icon { width: 34px; height: 34px; background: var(--blue); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.header-title h1 { font-size: 14px; font-weight: 700; }
.header-title p  { font-size: 11px; color: var(--muted); }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.live-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.live-dot.on { background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.meta-tag { font-size: 11px; color: var(--muted); background: var(--surface2); padding: 3px 8px; border-radius: 20px; border: 1px solid var(--border); }
.theme-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 14px; color: var(--muted); transition: all .15s; line-height: 1; }
.theme-btn:hover { border-color: var(--border2); color: var(--text); }

/* ── Status tabs ── */
.zone-tabs { padding: 0 24px; display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--surface); }
.zone-tab { background: transparent; border: none; color: var(--muted); padding: 9px 14px; font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; display: flex; align-items: center; gap: 5px; }
.zone-tab:hover { color: var(--text); }
.zone-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
.zone-tab.active.t-pending  { color: var(--yellow);  border-bottom-color: var(--yellow); }
.zone-tab.active.t-assigned { color: var(--purple);  border-bottom-color: var(--purple); }
.zone-tab.active.t-occupied { color: var(--green);   border-bottom-color: var(--green); }
.zone-tab.active.t-hold     { color: var(--orange);  border-bottom-color: var(--orange); }
.tab-count { background: var(--surface2); color: var(--muted); font-size: 10px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--border); }
.zone-tab.active .tab-count { background: rgba(59,130,246,.12); color: var(--blue); border-color: rgba(59,130,246,.25); }

/* ── KPIs ── */
.stats { display: grid; grid-template-columns: repeat(7,1fr); gap: 10px; padding: 14px 24px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; }
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 4px; }
.stat-value { font-size: 24px; font-weight: 700; line-height: 1; }
.stat-sub   { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* ── Table toolbar ── */
.table-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 24px 10px; }
.search-wrap { position: relative; min-width: 220px; max-width: 320px; }
.search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search-input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 7px 10px 7px 30px; border-radius: 8px; font-size: 12px; outline: none; transition: border-color .15s; }
.search-input:focus { border-color: var(--blue); }
.table-count { font-size: 12px; color: var(--muted); margin-left: auto; }
.wait-sort-btn { display: flex; align-items: center; gap: 5px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 5px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; }
.wait-sort-btn:hover { border-color: var(--border2); color: var(--text); }
.wait-sort-btn.desc { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.25); color: var(--red); }
.wait-sort-btn.asc  { background: rgba(34,197,94,.08);  border-color: rgba(34,197,94,.25);  color: var(--green); }

/* ── Main table ── */
.table-wrap { padding: 0 24px 32px; }
table.main-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
table.main-table th { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); font-weight: 500; cursor: pointer; user-select: none; white-space: normal; word-break: break-word; vertical-align: bottom; }
table.main-table th:hover { color: var(--text); }
table.main-table th.sorted { color: var(--blue); }
table.main-table td { padding: 8px 10px; border-bottom: 1px solid rgba(42,45,62,.4); vertical-align: middle; white-space: normal; word-break: break-word; }
/* larguras fixas das 14 colunas */
table.main-table th:nth-child(1),  table.main-table td:nth-child(1)  { width: 5%;  }  /* Placa */
table.main-table th:nth-child(2),  table.main-table td:nth-child(2)  { width: 8%;  }  /* Veículo */
table.main-table th:nth-child(3),  table.main-table td:nth-child(3)  { width: 9%;  }  /* LH # */
table.main-table th:nth-child(4),  table.main-table td:nth-child(4)  { width: 8%;  }  /* Origem */
table.main-table th:nth-child(5),  table.main-table td:nth-child(5)  { width: 5%;  }  /* ETA */
table.main-table th:nth-child(6),  table.main-table td:nth-child(6)  { width: 6%;  }  /* T. desde Chegada */
table.main-table th:nth-child(7),  table.main-table td:nth-child(7)  { width: 6%;  }  /* T. Espera */
table.main-table th:nth-child(8),  table.main-table td:nth-child(8)  { width: 6%;  }  /* T. em Espera */
table.main-table th:nth-child(9),  table.main-table td:nth-child(9)  { width: 6%; text-align:right; }  /* Pacotes */
table.main-table th:nth-child(10), table.main-table td:nth-child(10) { width: 12%; }  /* Motorista */
table.main-table th:nth-child(11), table.main-table td:nth-child(11) { width: 7%;  }  /* Doca Atrib. */
table.main-table th:nth-child(12), table.main-table td:nth-child(12) { width: 8%;  }  /* Doca Ocup. */
table.main-table th:nth-child(13), table.main-table td:nth-child(13) { width: 7%;  }  /* Status LH */
table.main-table th:nth-child(14), table.main-table td:nth-child(14) { width: 7%;  }  /* Status Queue */
[data-theme="light"] table.main-table td { border-bottom-color: rgba(226,232,240,.8); }
table.main-table tr:hover td { background: rgba(255,255,255,.03); }
table.main-table tr:last-child td { border-bottom: none; }

/* Status pills */
.st-pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.st-pending  { background: rgba(245,158,11,.12); color: var(--yellow); border: 1px solid rgba(245,158,11,.25); }
.st-assigned { background: rgba(139,92,246,.12); color: var(--purple); border: 1px solid rgba(139,92,246,.25); }
.st-occupied { background: rgba(34,197,94,.12);  color: var(--green);  border: 1px solid rgba(34,197,94,.25); }
.st-hold     { background: rgba(238,77,45,.12);  color: var(--orange); border: 1px solid rgba(238,77,45,.25); }

/* Tag pills */
.tag-yes  { display: inline-block; background: rgba(34,197,94,.12); color: var(--green);  border: 1px solid rgba(34,197,94,.25);  padding: 2px 7px; border-radius: 12px; font-size: 10px; font-weight: 700; }
.tag-no   { display: inline-block; background: var(--surface2);     color: var(--muted);  border: 1px solid var(--border);         padding: 2px 7px; border-radius: 12px; font-size: 10px; }
.tag-prio { display: inline-block; background: rgba(245,158,11,.12); color: var(--yellow); border: 1px solid rgba(245,158,11,.25); padding: 2px 7px; border-radius: 12px; font-size: 10px; font-weight: 700; }
.geo-ok   { color: var(--green);  font-size: 11px; font-weight: 600; }
.geo-out  { color: var(--muted);  font-size: 11px; }

/* Wait time */
.wait-ok   { color: var(--green);  font-family: monospace; }
.wait-mid  { color: var(--yellow); font-family: monospace; }
.wait-high { color: var(--orange); font-family: monospace; font-weight: 700; }
.wait-crit { color: var(--red);    font-family: monospace; font-weight: 700; }

/* ── Pagination ── */
.pagination-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 12px 24px; border-top: 1px solid var(--border); }
.pag-info { font-size: 12px; color: var(--muted); }
.pag-pages { display: flex; align-items: center; gap: 4px; }
.pag-btn { min-width: 32px; height: 32px; padding: 0 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; }
.pag-btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.pag-btn:disabled { opacity: .35; cursor: default; }
.pag-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.pag-ellipsis { font-size: 12px; color: var(--muted); padding: 0 4px; }
.pag-size { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.pag-size select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 7px; font-size: 12px; cursor: pointer; outline: none; }
.pag-size select:focus { border-color: var(--blue); }

/* ── Empty ── */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
.empty code { display: inline-block; background: var(--surface); border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; font-size: 12px; margin-top: 14px; text-align: left; line-height: 1.8; }

/* ── Trip Detail Modal ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 9000; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(3px); }
.modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.modal-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 22px 16px; border-bottom: 1px solid var(--border); gap: 12px; }
.modal-lt { font-family: monospace; font-size: 18px; font-weight: 700; color: var(--teal); letter-spacing: .5px; }
.modal-vtype { font-size: 11px; color: var(--muted); background: var(--surface2); border: 1px solid var(--border); padding: 2px 8px; border-radius: 10px; margin-left: 8px; vertical-align: middle; }
.modal-driver { font-size: 12px; color: var(--text); margin-top: 4px; }
.modal-agency { font-size: 11px; color: var(--muted); margin-top: 2px; }
.modal-close { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); width: 30px; height: 30px; border-radius: 8px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; }
.modal-close:hover { color: var(--text); border-color: var(--border2); }
.modal-body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 18px; }
/* Route */
.modal-route { display: flex; align-items: stretch; gap: 0; }
.route-station { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.route-station.origin { border-right: none; border-radius: 10px 0 0 10px; }
.route-station.dest   { border-left: none;  border-radius: 0 10px 10px 0; border-left: 1px solid var(--border); }
.route-arrow { display: flex; align-items: center; justify-content: center; padding: 0 2px; background: var(--surface2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); color: var(--muted); font-size: 18px; }
.rs-label { font-size: 9px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 4px; }
.rs-name  { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.rs-row   { display: flex; gap: 14px; flex-wrap: wrap; }
.rs-item  { display: flex; flex-direction: column; gap: 1px; }
.rs-item-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.rs-item-val   { font-size: 12px; font-weight: 600; font-family: monospace; }
/* KPIs grid */
.modal-kpis { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
.mkpi { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
.mkpi-label { font-size: 9px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 3px; }
.mkpi-val   { font-size: 20px; font-weight: 700; line-height: 1; }
.mkpi-sub   { font-size: 10px; color: var(--muted); margin-top: 2px; }
/* Ops timeline */
.modal-section-title { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 8px; }
.ops-timeline { display: flex; gap: 0; }
.ops-step { flex: 1; text-align: center; position: relative; }
.ops-step:not(:last-child)::after { content:''; position: absolute; top: 14px; left: 50%; width: 100%; height: 1px; background: var(--border2); z-index: 0; }
.ops-dot  { width: 28px; height: 28px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 12px; margin: 0 auto 6px; position: relative; z-index: 1; }
.ops-dot.done { background: rgba(34,197,94,.12); border-color: var(--green); }
.ops-step-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.ops-step-time  { font-size: 11px; font-weight: 600; font-family: monospace; margin-top: 2px; }
/* Clickable rows */
table.main-table tbody tr { cursor: pointer; }
table.main-table tbody tr:hover td { background: rgba(59,130,246,.06); }

@media (max-width:1200px) { .stats { grid-template-columns: repeat(3,1fr); } }
@media (max-width:800px)  { .stats { grid-template-columns: repeat(2,1fr); } .modal-kpis { grid-template-columns: repeat(2,1fr); } }
</style>
