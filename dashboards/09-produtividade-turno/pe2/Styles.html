<style>
:root, :root[data-theme="dark"] {
  --bg: #07080C; --surface: #0E1016; --surface2: #171A23; --border: rgba(255,255,255,.07); --border-s: rgba(255,255,255,.14);
  --text: #F5F6FA; --muted: #9BA0B4; --brand: #FF6A2B; --brand2: #FF3D6E;
  --ok: #34D399; --open: #FBBF24; --late: #F87171; --lost: #EF4444;
  --t-lost: #EF4444; --t-crit: #FB923C; --t-high: #FBBF24; --t-att: #60A5FA; --t-safe: #64748B;
  --card-bg: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.016));
  --card-bd: linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.03) 45%, rgba(255,255,255,.06));
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 18px 36px -20px rgba(0,0,0,.75);
  --c-miss: #F87171; --c-scan: #FB923C; --c-sort: #FBBF24; --c-dup: #60A5FA; --c-exc: #A78BFA; --sh1: #60A5FA; --sh2: #FBBF24; --sh3: #A78BFA;
  --aura1: rgba(255,106,43,.16); --aura2: rgba(90,110,255,.13); --hatch: rgba(0,0,0,.35);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F3F4F8; --surface: #FFFFFF; --surface2: #EEF0F5; --border: rgba(20,24,40,.09); --border-s: rgba(20,24,40,.18);
  --text: #12141C; --muted: #545A6E; --brand: #E8470F; --brand2: #D61F55;
  --ok: #15803D; --open: #B45309; --late: #DC2626; --lost: #B91C1C;
  --t-lost: #B91C1C; --t-crit: #C2410C; --t-high: #A16207; --t-att: #1D4ED8; --t-safe: #475569;
  --card-bg: linear-gradient(180deg, #fff, #FBFBFD);
  --card-bd: linear-gradient(180deg, rgba(20,24,40,.13), rgba(20,24,40,.05));
  --shadow: 0 1px 2px rgba(20,24,40,.05), 0 12px 28px -16px rgba(20,24,40,.2);
  --c-miss: #DC2626; --c-scan: #C2410C; --c-sort: #A16207; --c-dup: #1D4ED8; --c-exc: #6D28D9; --sh1: #1D4ED8; --sh2: #A16207; --sh3: #6D28D9;
  --aura1: rgba(255,106,43,.10); --aura2: rgba(90,110,255,.08); --hatch: rgba(255,255,255,.45);
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 70px; }
body { background: var(--bg); color: var(--text); font: 400 14px/1.45 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; font-feature-settings: 'cv11', 'ss01'; -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--brand); color: #fff; padding: 8px 12px; border-radius: 8px; z-index: 100; }
.skip:focus { left: 8px; }
.muted { color: var(--muted); } .xs { font-size: 11.5px; } .sm { font-size: 13px; }
.mono { font-family: 'Fira Code', ui-monospace, Consolas, monospace; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.aura { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(760px 440px at 6% -8%, var(--aura1), transparent 70%), radial-gradient(680px 420px at 100% 0%, var(--aura2), transparent 70%); }
.page { max-width: 1360px; margin: 0 auto; padding: 12px 12px 56px; }

 
.card { background: var(--card-bg); border: 1px solid transparent; border-radius: 18px; padding: 14px; position: relative; box-shadow: var(--shadow); min-width: 0; }
.card::before, .kc::before, .kt::before, .tier::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: var(--card-bd); pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card-h.wrap { flex-wrap: wrap; align-items: center; }
.card-h h3 { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
.grid2 { display: grid; gap: 10px; margin-bottom: 10px; }
.chap { padding-top: 18px; }
.sec { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 10px; }
.sec i { font-style: normal; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; font-size: 12px; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand2)); }
.sec small { font-size: 11.5px; font-weight: 400; color: var(--muted); margin-left: auto; }

 
.hero { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 18px 16px 8px; overflow: hidden; background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 16%, var(--surface)) 0%, var(--surface) 45%, color-mix(in srgb, #5B6CFF 14%, var(--surface)) 100%); }
.hero-eb { font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.hero h1 { font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -.04em; margin: 4px 0 6px; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--brand), var(--brand2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero-sub { font-size: 11.5px; color: var(--muted); }
.hero-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.hp { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--border-s); color: var(--muted); }
:root[data-theme="light"] .hp { background: rgba(20,24,40,.05); }
.hp b { color: var(--text); font-weight: 600; }
.hp .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; } .hp .dot.stale { background: var(--open); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.hero-art { width: 100%; max-width: 420px; height: auto; justify-self: center; }
.art-n circle { fill: var(--bg); stroke: url(#gArt); stroke-width: 2.5; }
.art-l text { font-size: 9px; fill: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.art-v text { font-size: 13px; font-weight: 700; fill: var(--text); font-variant-numeric: tabular-nums; }
.hero-a { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; }
.btn-i { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--muted); transition: background .18s, color .18s; }
.btn-i:hover { background: rgba(255,255,255,.08); color: var(--text); }
.btn-i.spin .ic { animation: spin .9s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }

 
.fbar { position: sticky; top: 0; z-index: 30; display: flex; gap: 8px; align-items: flex-end; overflow-x: auto; margin: 10px -12px 0; padding: 8px 12px; scrollbar-width: none;
  background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-bottom: 1px solid var(--border); }
.fbar::-webkit-scrollbar { display: none; }
.fld { display: flex; flex-direction: column; gap: 3px; flex: none; }
.fld > label, .fld > span.l { font-size: 9.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-left: 2px; }
.seg { display: inline-flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { min-height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; color: var(--muted); font-weight: 500; transition: background .18s, color .18s; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; box-shadow: 0 6px 16px -8px var(--brand); }
.chip { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 38px; min-width: 130px; padding: 0 12px; border: 1px solid var(--border-s); border-radius: 11px; background: var(--surface2); font-size: 13px; font-weight: 500; white-space: nowrap; transition: border-color .18s, background .18s; }
.chip:hover { border-color: var(--brand); }
.chip .ic { width: 15px; height: 15px; color: var(--muted); }
.chip.on { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 14%, var(--surface2)); }
.chip.tag { min-width: 0; min-height: 34px; align-self: flex-end; border-radius: 999px; }
.chip.clear { border-style: dashed; color: var(--muted); min-width: 0; align-self: flex-end; min-height: 34px; border-radius: 999px; }

 
.k3 { display: grid; gap: 10px; margin-bottom: 10px; }
.kc { position: relative; border-radius: 18px; padding: 14px 14px 12px; background: var(--card-bg); border: 1px solid transparent; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; gap: 4px; min-height: 176px; }
.kc::after { content: ''; position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; background: radial-gradient(circle, color-mix(in srgb, var(--k) 20%, transparent), transparent 70%); pointer-events: none; }
.kc-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kc-t { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.kc-t .ic { width: 26px; height: 26px; padding: 5px; border-radius: 8px; background: color-mix(in srgb, var(--k) 18%, transparent); color: var(--k); }
.st { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: .04em; text-transform: uppercase; background: color-mix(in srgb, var(--k) 18%, transparent); color: var(--k); white-space: nowrap; }
.kc-big { font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -.045em; font-variant-numeric: tabular-nums; margin-top: 6px; }
.kc-sub { font-size: 12px; color: var(--muted); }
.kc-sub b { color: var(--text); font-weight: 600; }
.spark { width: 100%; height: 52px; margin-top: auto; display: block; }
.mini { display: grid; gap: 6px; margin-top: auto; }
.mini-b { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
.mini-b i { display: block; min-width: 2px; }
.mini-l { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); }
.mini-l span { display: inline-flex; align-items: center; gap: 5px; } .mini-l i { width: 8px; height: 8px; border-radius: 2px; } .mini-l b { color: var(--text); font-variant-numeric: tabular-nums; }
.hb { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 11.5px; color: var(--muted); }
.hb .bar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; } .hb .bar i { display: block; height: 100%; border-radius: 3px; }
.hb b { color: var(--text); font-variant-numeric: tabular-nums; }

.k4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kt { position: relative; border-radius: 16px; padding: 12px; background: var(--card-bg); border: 1px solid transparent; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px; min-height: 96px; text-align: left; }
button.kt { transition: transform .2s; } button.kt:hover { transform: translateY(-2px); }
.kt .kc-t .ic { width: 22px; height: 22px; padding: 4px; }
.kt-v { font-size: 26px; font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 4px; }
.kt-s { font-size: 11.5px; color: var(--muted); }
.kt.don { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 14px; }
.donut-w { position: relative; width: 92px; flex: none; aspect-ratio: 1; }
.donut-w svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.donut-w circle { fill: none; stroke-width: 12; transition: stroke-dasharray .9s cubic-bezier(.2,.8,.2,1), stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1); }
.donut-w .trk { stroke: var(--surface2); }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-weight: 800; font-size: 16px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.lg-rows { display: grid; gap: 4px; flex: 1; min-width: 0; }
.lg-r { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; font-size: 12px; } .lg-r i { width: 8px; height: 8px; border-radius: 2px; } .lg-r b { font-variant-numeric: tabular-nums; font-weight: 650; } .lg-r em { font-style: normal; color: var(--muted); margin-left: 6px; font-size: 11px; }

 
.stack { display: flex; height: 100%; border-radius: 4px; overflow: hidden; gap: 1px; }
.stack i { display: block; min-width: 0; }
.s-ok { background: var(--ok); } .s-open { background: var(--open); } .s-late { background: var(--late); }
.s-lost { background: var(--lost); background-image: repeating-linear-gradient(135deg, var(--hatch) 0 3px, transparent 3px 6px); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.legend b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

 
.flow { display: grid; gap: 10px; padding: 12px; }
.fg { position: relative; border: 1px solid color-mix(in srgb, var(--g) 55%, transparent); border-radius: 14px; padding: 22px 8px 8px; background: color-mix(in srgb, var(--g) 5%, transparent); }
.fg-t { position: absolute; top: -9px; left: 12px; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; background: var(--bg); border: 1px solid color-mix(in srgb, var(--g) 55%, transparent); color: var(--g); }
.fg-n { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.fn { text-align: left; border-radius: 10px; padding: 8px 9px; background: var(--surface2); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 3px; transition: border-color .18s, transform .18s; min-width: 0; }
.fn:hover { border-color: var(--g); transform: translateY(-1px); }
.fn[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 1.5px var(--brand); }
.fn-n { font-size: 10.5px; color: var(--muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fn-v { font-size: 20px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.fn-b { height: 5px; } .fn-m { font-size: 10.5px; color: var(--muted); }
.fn-m b.r { color: var(--late); } .fn-m b.o { color: var(--open); }
.fg.hot .fn.warn { border-color: color-mix(in srgb, var(--late) 55%, transparent); }

 
.rows { display: flex; flex-direction: column; gap: 1px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: center; width: 100%; text-align: left; padding: 7px 8px; border-radius: 9px; min-height: 44px; border: 1px solid transparent; transition: background .15s; }
.row:hover { background: rgba(255,255,255,.04); } :root[data-theme="light"] .row:hover { background: rgba(20,24,40,.04); }
.row[aria-pressed="true"] { background: color-mix(in srgb, var(--brand) 12%, transparent); border-color: color-mix(in srgb, var(--brand) 60%, transparent); }
.row-n { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-v { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.row-bar { grid-column: 1 / -1; height: 7px; }
.row-m { grid-column: 1 / -1; font-size: 10.5px; color: var(--muted); } .row-m b { color: var(--text); font-weight: 600; }
.pct-ok { color: var(--ok); } .pct-mid { color: var(--open); } .pct-bad { color: var(--late); }
.link-btn { color: var(--brand); font-size: 13px; font-weight: 500; min-height: 40px; padding: 0 8px; }
.chart-wrap { position: relative; height: 230px; } .chart-wrap.short { height: 200px; }

 
.tiers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
.tier { position: relative; text-align: left; border-radius: 14px; padding: 11px 12px; min-height: 84px; background: var(--card-bg); border: 1px solid transparent; box-shadow: var(--shadow); overflow: hidden; transition: transform .2s, box-shadow .2s, background .2s; }
.tier::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
.tier:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -18px var(--c); }
.tier[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 14%, var(--surface)); box-shadow: 0 0 0 1.5px var(--c), 0 14px 30px -18px var(--c); }
.tier-n { font-size: 28px; font-weight: 800; letter-spacing: -.04em; color: var(--c); font-variant-numeric: tabular-nums; line-height: 1.1; }
.tier-l { font-size: 12.5px; font-weight: 650; } .tier-s { font-size: 10.5px; color: var(--muted); }
.tier:nth-child(5) { grid-column: 1 / -1; }

 
.mx-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table.mx { border-collapse: separate; border-spacing: 3px; width: 100%; min-width: 420px; font-size: 12px; }
table.mx th { font-weight: 600; font-size: 10.5px; text-align: center; padding: 2px 4px; white-space: nowrap; }
table.mx th:first-child, table.mx td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; padding-right: 8px; color: var(--muted); }
table.mx td { text-align: center; padding: 0; } table.mx td:first-child { white-space: nowrap; font-size: 11.5px; }
.mx-c { display: block; width: 100%; min-height: 34px; border-radius: 8px; font-variant-numeric: tabular-nums; font-weight: 650; background: color-mix(in srgb, var(--c) calc(var(--a) * 1%), var(--surface2)); }
.mx-c:disabled { color: var(--muted); font-weight: 400; cursor: default; }
.mx-c:not(:disabled):hover { outline: 2px solid var(--c); } .mx-c[aria-pressed="true"] { outline: 2px solid var(--text); }

 
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; width: 100%; }
.search, .select { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-s); border-radius: 11px; padding: 0 12px; min-height: 40px; background: var(--surface2); }
.search { flex: 1 1 170px; } .search .ic { color: var(--muted); width: 16px; height: 16px; }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; min-height: 36px; font-size: 16px; }
.select select { background: none; border: 0; outline: none; min-height: 36px; font-size: 13px; } .select select option { background: var(--surface); color: var(--text); }
.search:focus-within, .select:focus-within { border-color: var(--brand); }
.btn-s { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 1px solid var(--border-s); border-radius: 11px; font-size: 13px; font-weight: 500; background: var(--surface2); transition: border-color .18s, filter .18s; }
.btn-s:hover { border-color: var(--brand); } .btn-s .ic { width: 15px; height: 15px; }
.btn-p { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; border-color: transparent; box-shadow: 0 8px 20px -10px var(--brand); } .btn-p:hover { filter: brightness(1.1); }
.pill { display: inline-block; background: color-mix(in srgb, var(--brand) 18%, transparent); border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; margin-left: 6px; vertical-align: middle; font-variant-numeric: tabular-nums; }
.cards { display: grid; gap: 8px; margin-top: 10px; }
.pk { text-align: left; width: 100%; background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--c); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; transition: transform .2s, box-shadow .2s; }
.pk:hover { box-shadow: 0 12px 26px -18px var(--c); transform: translateY(-1px); }
.pk-1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pk-id { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.pk-cd { font-size: 18px; font-weight: 800; letter-spacing: -.03em; color: var(--c); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pk-2 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.pk-3 { font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 650; background: color-mix(in srgb, var(--c, var(--muted)) 18%, transparent); color: var(--c, var(--muted)); white-space: nowrap; }
.badge.plain { background: var(--surface); border: 1px solid var(--border-s); color: var(--muted); font-weight: 500; }
.tbl-wrap { display: none; }
.more { padding-top: 12px; }
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
